<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kasir.mu Admin</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/admin.css?v={{VERSION}}" />
<script src="/admin/theme.js?v={{VERSION}}"></script>
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="back-link" href="https://kasir.mu/" title="Back to website" aria-label="Back to website">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
      </a>
      <div class="brand"><img class="brand-logo" src="/favicon.svg" alt="kasir.mu" width="28" height="28" /><span class="brand-text">Admin</span></div>

      <nav class="nav" aria-label="Admin sections">
        <button class="nav-btn nav-active" data-tab="dashboard" type="button" aria-current="page">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
          <span>Dashboard</span>
        </button>
        <button class="nav-btn" data-tab="tenants" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span>Tenants</span>
        </button>
        <button class="nav-btn" data-tab="health" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
          <span>Health</span>
        </button>
      </nav>

      <div class="topbar-actions">
        <button class="btn btn-ghost btn-sm theme-toggle" id="theme-toggle" type="button" aria-label="Toggle light/dark theme" title="Toggle theme">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <a class="btn btn-ghost btn-sm db-link" href="https://license.kasir.mu/_/" target="_blank" rel="noopener noreferrer">DB</a>
        <button class="btn btn-ghost btn-sm" id="logout-btn" type="button">Log out</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <!-- The page's own heading. Every panel below is rendered by admin.js into
         #content, which is also where the skip link lands — so without this,
         the document had NO headings at all: a screen-reader user jumping to
         content arrived at a region with nothing to announce, and the outline
         was empty. It is screen-reader-only because the visible title is the
         "Admin" brand in the topbar, and repeating it would read as two
         headings for the same thing. -->
    <h1 class="sr-only">kasir.mu admin dashboard</h1>
    <div id="content"><div class="skeleton" style="height:10rem"></div></div>
  </main>

  <div id="modal-root"></div>

  <script src="/admin/admin-utils.js?v={{VERSION}}"></script>
  <script src="/admin/admin.js?v={{VERSION}}"></script>
</body>
</html>
