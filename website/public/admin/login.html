<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kasir.mu Admin — Sign in</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/login.css?v={{VERSION}}" />
<script src="/admin/theme.js?v={{VERSION}}"></script>
<script src="/admin/admin-utils.js?v={{VERSION}}"></script>
</head>
<body>
  <a class="skip-link" href="#auth-form">Skip to sign in</a>
  <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle light/dark theme" title="Toggle theme">
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  </button>
  <div class="card">
    <div class="logo"><img class="logo-img" src="/favicon.svg" alt="kasir.mu" width="28" height="28" /><span>kasir.mu</span></div>
    <h1>Admin Sign in</h1>
    <p class="sub">Sign in to manage tenants, licenses, and system settings</p>

    <!-- Clear Segmented Mode Tabs -->
    <div class="auth-tabs" role="tablist">
      <button type="button" class="auth-tab active" id="tab-otp" role="tab" aria-selected="true" aria-controls="otp-group">Email Code</button>
      <button type="button" class="auth-tab" id="tab-password" role="tab" aria-selected="false" aria-controls="password-group">Password</button>
    </div>

    <div id="login-form">
      <form id="auth-form">
        <label for="email">Admin Email</label>
        <input id="email" type="email" placeholder="admin@example.com" autocomplete="email" required />

        <!-- Password Mode Input -->
        <div id="password-group" class="hidden" role="tabpanel" aria-labelledby="tab-password">
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" />
        </div>

        <!-- Email Code (OTP) Input -->
        <div id="otp-group" class="hidden" role="tabpanel" aria-labelledby="tab-otp">
          <label for="otp-code">6-Digit Verification Code</label>
          <div class="otp-row">
            <input id="otp-code" type="text" maxlength="6" pattern="[0-9]{6}" inputmode="numeric" placeholder="123456" autocomplete="one-time-code" />
          </div>
        </div>

        <!-- B33 (WCAG 4.1.3): these were silent to screen readers — a
             sighted-only user learned about errors/success. role=alert
             announces assertively, role=status politely. -->
        <div id="success-msg" class="success hidden" role="status"></div>
        <div id="error-msg" class="error hidden" role="alert"></div>

        <button type="submit" class="btn" id="login-btn">Send Verification Code</button>
      </form>

      <p id="otp-cooldown" class="note hidden"></p>
    </div>

    <div id="loading-state" class="hidden">
      <p class="loading-text">Communicating with server…</p>
    </div>
  </div>
  <script src="/admin/login.js?v={{VERSION}}"></script>
</body>
</html>
