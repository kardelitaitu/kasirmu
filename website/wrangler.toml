# kasir.mu Website — Cloudflare Workers (static assets)
#
# The site is a pure static build (Astro outputs dist/), served at
# https://kasir.mu. Workers static assets honors public/_headers (CSP)
# and public/_redirects (301s) exactly like Pages does.
#
# Deploy (from website/):   npm run build && npx wrangler deploy
# Or via CI:                .github/workflows/website.yml
#
# Alternative: Cloudflare Pages (Git integration) also works — the build
# command/output are the same (`npm run build` → `dist/`); wrangler.toml is
# then ignored and the env vars go in Pages → Settings → Builds.

name = "oz-pos"

# Worker + static assets: worker.ts serves the site from the ASSETS binding
# and exposes /__oz/runtime-config.js backed by the LICENSE_API_URL [vars]
# binding, so the backend URL can change at runtime without rebuilding the
# bundle (the build-time PUBLIC_LICENSE_API_URL stays as the fallback).
main = "worker.ts"
assets = { directory = "./dist", binding = "ASSETS", run_worker_first = true, not_found_handling = "404-page" }

# The runtime compatibility date. Bump deliberately (never forward-date):
# `npx wrangler deploy` warns if this is more than a few days old.
compatibility_date = "2026-08-16"

# ── Routes (ADR #42) ─────────────────────────────────────────────
# dashboard.kasir.mu and admin.kasir.mu route to this Worker. `routes` MUST be
# a top-level key: it used to sit after the [observability.logs] table header,
# which nests it as observability.logs.routes — wrangler warns "Unexpected
# fields found in observability field: routes" and silently drops the routes,
# so the subdomains were never bound by this config.
routes = [
  "dashboard.kasir.mu/*",
  "admin.kasir.mu/*",
]

[vars]
# Runtime backend URL — overrides the build-time PUBLIC_LICENSE_API_URL.
# Update this (dashboard → Worker → Settings → Variables, or wrangler.toml)
# when the Northflank host changes; no site rebuild required.
LICENSE_API_URL = "https://license.kasir.mu"
# CONTACT_WEBHOOK_URL is a Worker SECRET, not a [vars] entry: committing it
# would let anyone who can read this repo spam the support channel, and the
# placeholder that used to live here was not a valid webhook (so a deploy that
# relied on it returned 502 "Discord send failed" for every message). Set it with:
#   npx wrangler secret put CONTACT_WEBHOOK_URL
# Unset → /api/contact returns 503 and the form degrades to a mailto link.
# Cloudflare account for the Health-tab deployments proxy (/__oz/cf-deploys).
# The API token itself is a Worker secret: npx wrangler secret put CF_API_KEY
CLOUDFLARE_ACCOUNT_ID = "872d4b05f29418e3e8c8a35d687e3dda"

# PUBLIC_* env vars are baked into the JS at BUILD time (import.meta.env),
# so they are NOT bindings — set them when running `npm run build`:
#   PUBLIC_LICENSE_API_URL=… PUBLIC_PADDLE_CLIENT_TOKEN=… npm run build

[observability.logs]
enabled = true
invocation_logs = true

