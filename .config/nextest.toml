# cargo-nextest configuration for kasir.mu
# Docs: https://nexte.st/book/configuration.html
#
# Usage:
#   cargo nextest run                    # all tests
#   cargo nextest run -p kasirmu-core         # single crate
#   cargo nextest run --changed          # only changed files (git diff)
#   cargo nextest run --partition 1/4    # shard 1 of 4 (CI)

[profile.default]
# Fail-fast: stop after first failure in CI, keep going locally
fail-fast = { max-fail = 1 }

# ── Test threads: 4, and this is a MEASURED ceiling, not a spare core ──────
# kasirmu-bridge full suite, 1542 tests, same machine (Ryzen 9 7950X, 16C/32T):
#   libtest default (32 threads) -> 1395-1471 s
#   --test-threads=4             -> 355.95 s   (1542 passed, 0 failed)
#   --test-threads=8             -> 50.80 s for kds:: alone, vs 26.37 s at 4
#   --test-threads=32            -> 92.90 s for kds:: alone, vs 26.37 s at 4
# Adding threads makes it SLOWER. The cause is already documented in
# crates/kasirmu-core/src/migrations.rs: clones of the migrated test-db
# snapshot (fresh_db) degrade past two threads -- 1.15 s at 1, 0.76 s at 2,
# 2.18 s at 8, 3.75 s at 32 for 384 clones -- most likely SQLite's global
# allocation mutex. Every TestBridge::new() takes that path, which is why the
# modules that build many bridges (kds, auth, reports, pos, staff) are the slow
# ones and the 332-test topology module, which mostly does not, finishes in 9.7 s.
#
# AND IT HOLDS FOR THE BIGGEST CRATE TOO, re-measured 2026-10-23 so this is not a
# one-crate anecdote. kasirmu-core --lib, 3674 tests, same machine:
#   1 thread     -> 107.04 s
#   2 threads    ->  77.35 s
#   4 threads    ->  65.10 s   <- the same optimum
#   8 threads    -> 114.43 s
#   default (32) -> 179.96 s    (2.8x slower than 4)
# 3674 passed, 0 failed at every point on that curve, so the setting costs no
# coverage -- it only stops the runner from racing itself. Two crates, two
# independently measured curves, the same minimum at 4.
#
# So 4 is not a compromise between speed and safety: it is the fastest measured
# point, and it is what [profile.quick] already used.
test-threads = 4

# Retry flaky tests up to 2 times with exponential backoff
retries = { backoff = "exponential", count = 2, delay = "1s" }

# Per-test timeout: 2 minutes (prevents hung tests blocking CI)
slow-timeout = { period = "120s", terminate-after = 3 }

# JUnit XML output. This is the ONLY machine-readable record of a retry-rescued
# flake. nextest writes it as <flakyFailure> inside the <testcase>, while the
# `failures=` attribute on both <testsuites> and <testsuite>, and the conventional
# <failure> element, all record that same test as PASSED. Measured against a
# scratch crate built to answer exactly this (one test panicking on attempt 1 and
# passing on attempt 2, retries = 1): the run printed `2 passed (1 flaky)` and
# exit 0, and its report said failures="0" with one <flakyFailure> and zero
# <failure>. A consumer written against the JUnit shape people know reads that as
# green.
#   read it with: python scripts/verify-pg-tests-ran.py --nextest-junit <path>
#
# `path` resolves relative to the PROFILE'S OWN ARTIFACT DIRECTORY, not to the
# workspace root -- measured: `path = "junit.xml"` wrote
# target/nextest/default/junit.xml. The value this block carried until 2026-09-16
# was "target/nextest/ci/junit.xml", so the file really landed at
# target/nextest/default/target/nextest/ci/junit.xml for [profile.default] (what
# dev-ci.yml:244 runs, no --profile passed) and at
# target/nextest/ci/target/nextest/ci/junit.xml for [profile.ci], which inherits
# this block and is what release.yml:149 and scripts/release.sh:65 run. Neither is
# the path written in the comment, and the only reference to the single-fold form
# anywhere in the repo is .github/workflows/ci.yml.bak:433 -- a retired workflow
# GitHub never executes. The report has been produced on every CI run and read by
# nothing, at a location nobody was told.
[profile.default.junit]
path = "junit.xml"
report-name = "kasirmu-test"

# CI profile: stricter settings
[profile.ci]
inherits = "default"
fail-fast = true
slow-timeout = { period = "90s", terminate-after = 2 }
retries = { backoff = "exponential", count = 1, delay = "2s" }

# Speed profile: single thread, no retries, fast local iteration
[profile.quick]
retries = 0
test-threads = 4
slow-timeout = { period = "30s", terminate-after = 1 }

# ── The shared dev Postgres is ONE resource, and these tests mutate it ───────────────
# Measured 2026-09-29 on a full workspace run: 19 tests failed and were then rescued by
# the retry, every one of them kasirmu-cloud's Postgres integration tests (db_tests,
# email_pg_tests, sync_store_tests, tests/pg_stock_guard, tests/pg_init_reconciliation,
# tests/pg_trigger_ports). They are not nondeterministic -- they RACE. Several call
# `PG_INIT`, which applies the whole schema to `public`, and others assert on that same
# schema: `pg_integration_apply_schema_can_be_skipped` requires `public` to be EMPTY
# (db_tests.rs:459) while its neighbours are filling it. Two at once is a self-inflicted
# collision whose loser the retry rescues, which is exactly what the flake receipt
# (scripts/verify-pg-tests-ran.py) exists to make visible -- the JUnit totals call all
# 19 of them passes. Serialize them instead of paying for the retry.
[test-groups.shared-postgres]
max-threads = 1

[[profile.default.overrides]]
# Every test whose name contains `pg` reaches that one database, including the
# integration binaries, whose names carry it too (`pg_trigger_ports::...`).
#
# AUDITED 2026-09-29 and the name filter was too narrow. The group was keyed on
# `test(/pg/)`, which is a heuristic about NAMES. Measuring the criterion that actually
# matters -- which tests connect with `apply_schema = true`, the flag that applies PG_INIT to
# the shared public schema -- found webhooks_tests.rs (:634, :910), sync_api_tests.rs (:928,
# :1873, :2430), prune_tests.rs, main_tests.rs and others doing exactly that with no `pg`
# anywhere in their names. They were never serialized, so they could race the very tests this
# group exists to protect. The filter is the PACKAGES that hold those tests: coarser, and true
# by construction, where a name filter rots the moment someone writes a Postgres test without
# `pg` in its name -- which is exactly how this hole opened.
filter = 'test(/pg/) | package(kasirmu-cloud) | package(kasirmu-api) | package(platform-sync)'
test-group = 'shared-postgres'

