# ── 05. Rust Compilation & Linting ─────────────────────────────────────
# Criticality: P0
# Duration: ~2m (with cached target/registry)
# Scope: cargo fmt, cargo check (workspace), cargo clippy (all-targets, all-features)

jobs:
  cargo-check:
    executor: rust-executor
    steps:
      - checkout
      - ensure-rust-stable
      - install-linux-deps
      - prepare-dist-stubs
      - restore_cache:
          keys:
            - v2-cargo-cache-{{ checksum "Cargo.lock" }}
            - v2-cargo-cache-
      - run:
          name: Cargo Format Check
          command: cargo fmt --all -- --check
          no_output_timeout: 15m
      - run:
          name: Cargo Check Workspace
          command: cargo check --workspace --all-targets --all-features -j 2
          no_output_timeout: 15m
      - run:
          name: Cargo Clippy
          command: cargo clippy --all-targets --all-features -j 2 -- -D warnings
          no_output_timeout: 15m
      - save_cache:
          key: v2-cargo-cache-{{ checksum "Cargo.lock" }}
          paths:
            - ~/.cargo/registry/index
            - ~/.cargo/registry/cache
            - ~/.cargo/git/db
            - target
