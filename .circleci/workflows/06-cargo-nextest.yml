# ── 06. Rust Test Suite ────────────────────────────────────────────────
# Criticality: P0
# Duration: ~2m30s
# Scope: cargo nextest across all workspace crates with PostgreSQL service container

jobs:
  cargo-nextest:
    executor: rust-test-executor
    steps:
      - checkout
      - ensure-rust-stable
      - install-linux-deps
      - prepare-dist-stubs
      - restore_cache:
          keys:
            - v2-cargo-cache-{{ checksum "Cargo.lock" }}
            - v2-cargo-cache-
      - run:
          name: Install cargo-nextest
          command: |
            curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C ~/.cargo/bin
          no_output_timeout: 15m
      - run:
          name: Wait for PostgreSQL
          command: |
            for i in $(seq 1 30); do
              if (echo > /dev/tcp/localhost/5432) >/dev/null 2>&1; then
                echo "PostgreSQL is ready"
                break
              fi
              echo "Waiting for PostgreSQL..."
              sleep 1
            done
          no_output_timeout: 15m
      - run:
          name: Run Cargo Nextest
          command: cargo nextest run --workspace --all-features -j 2
          no_output_timeout: 15m
      - save_cache:
          key: v2-cargo-cache-{{ checksum "Cargo.lock" }}
          paths:
            - ~/.cargo/registry/index
            - ~/.cargo/registry/cache
            - ~/.cargo/git/db
            - target
