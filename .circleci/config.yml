version: 2.1

# ── Executors ────────────────────────────────────────────────────────
executors:
  node-executor:
    docker:
      - image: cimg/node:24.0
    resource_class: medium

  rust-executor:
    docker:
      - image: cimg/rust:1.85.0
    resource_class: medium
    environment:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: "-D warnings -C debuginfo=0 -C codegen-units=16 -C link-arg=-fuse-ld=lld"
      RUSTC_WRAPPER: ""
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"

  rust-test-executor:
    docker:
      - image: cimg/rust:1.85.0
      - image: cimg/postgres:17.2
        environment:
          POSTGRES_USER: oz_test
          POSTGRES_PASSWORD: oz_test_password
          POSTGRES_DB: oz_test_db
    resource_class: medium
    environment:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: "-D warnings -C debuginfo=0 -C codegen-units=16 -C link-arg=-fuse-ld=lld"
      OZ_TEST_PG_URL: postgres://oz_test:oz_test_password@localhost:5432/oz_test_db
      RUSTC_WRAPPER: ""
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"

  polyglot-executor:
    docker:
      - image: cimg/rust:1.85.0-node
    resource_class: medium
    environment:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: "-D warnings -C debuginfo=0 -C codegen-units=16 -C link-arg=-fuse-ld=lld"
      RUSTC_WRAPPER: ""
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"

  rust-node-executor:
    docker:
      - image: cimg/rust:1.85.0-node
    resource_class: medium
    environment:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: "-D warnings -C debuginfo=0 -C codegen-units=16 -C link-arg=-fuse-ld=lld"
      RUSTC_WRAPPER: ""
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"

# ── Commands ──────────────────────────────────────────────────────────
commands:
  ensure-rust-stable:
    description: "Ensure Rust toolchain is up-to-date stable with clippy and rustfmt"
    steps:
      - run:
          name: Ensure Rust Stable
          command: |
            rustup update stable
            rustup default stable
            rustup component add rustfmt clippy

  install-linux-deps:
    description: "Install Linux GTK/WebKit/Tauri system dependencies and lld linker"
    steps:
      - run:
          name: Install System Dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
              librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
              libdbus-1-dev libudev-dev pkg-config lld clang

  prepare-dist-stubs:
    description: "Create frontend dist stubs for Tauri compile macros"
    steps:
      - run:
          name: Create Frontend Dist Stubs
          command: |
            mkdir -p ui/dist ui/dist-tablet ui/dist-desktop
            touch ui/dist/index.html ui/dist-tablet/index.html ui/dist-desktop/index.html

# ── Jobs ──────────────────────────────────────────────────────────────
jobs:
  static-gates:
    executor: polyglot-executor
    steps:
      - checkout
      - run:
          name: Install Go, Python, PyYAML & Verification Tools
          command: |
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends python3 python3-pip python3-yaml curl
            pip install --break-system-packages pyyaml || true
            curl -fsSL https://go.dev/dl/go1.24.0.linux-amd64.tar.gz | sudo tar -C /usr/local -xz
            echo 'export PATH="/usr/local/go/bin:$PATH"' >> $BASH_ENV
          no_output_timeout: 15m
      - run:
          name: Architecture Boundaries
          command: python3 scripts/verify-architecture-boundaries.py --strict
          no_output_timeout: 15m
      - run:
          name: No Hardcoded Money Formatting
          command: python3 scripts/verify-no-hardcoded-money-format.py
          no_output_timeout: 15m
      - run:
          name: Windows Config Drift
          command: python3 scripts/verify-windows-config.py
          no_output_timeout: 15m
      - run:
          name: Skill Drift Guard
          command: bash .agents/skills/skill-drift-guard/scripts/detect.sh --report
          no_output_timeout: 15m
      - run:
          name: Unified Healthcheck Test
          command: sh apps/unified/test-healthcheck.sh
          no_output_timeout: 15m
      - run:
          name: Panic Inventory (ADR #33)
          command: python3 scripts/scan-unwrap-panic.py --fail-on-recoverable
          no_output_timeout: 15m
      - run:
          name: Release Workflow Validation
          command: |
            python3 scripts/verify-release-workflow.py
            python3 scripts/verify-release-workflow.py --self-test
          no_output_timeout: 15m
      - run:
          name: Go Lints & Tests (License Server)
          command: |
            test -z "$(gofmt -l apps/license-server)" || { gofmt -l apps/license-server; exit 1; }
            go -C apps/license-server vet ./...
            go -C apps/license-server test -short ./...
          no_output_timeout: 15m
      - run:
          name: Conventional-Commit Subjects Self-Test
          command: python3 scripts/verify-commit-subjects.py --self-test
          no_output_timeout: 15m
      - run:
          name: Modular CircleCI Config Drift
          command: |
            python3 scripts/compose-circleci.py --check
            python3 scripts/compose-circleci.py --self-test
          no_output_timeout: 15m
  i18n:
    executor: node-executor
    steps:
      - checkout
      - run:
          name: Install Python
          command: |
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends python3
          no_output_timeout: 15m
      - restore_cache:
          keys:
            - v2-ui-deps-{{ checksum "ui/package-lock.json" }}
            - v2-ui-deps-
      - run:
          name: Install UI Dependencies
          command: cd ui && npm ci --no-audit --no-fund --ignore-scripts
          no_output_timeout: 15m
      - save_cache:
          key: v2-ui-deps-{{ checksum "ui/package-lock.json" }}
          paths:
            - ~/.npm
            - ui/node_modules
      - run:
          name: i18n Lint (Parity + Untranslated + Duplicate Keys)
          command: bash scripts/lint-i18n.sh
          no_output_timeout: 15m
      - run:
          name: FTL Duplicate-Key Dry Run
          command: python3 scripts/dedupe-ftl.py --dry-run
          no_output_timeout: 15m
  ui-lint-typecheck:
    executor: node-executor
    steps:
      - checkout
      - run:
          name: Install Python (Timezone Invariance)
          command: |
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends python3
          no_output_timeout: 15m
      - restore_cache:
          keys:
            - v2-ui-deps-{{ checksum "ui/package-lock.json" }}
            - v2-ui-deps-
      - run:
          name: Install UI Dependencies
          command: cd ui && npm ci --no-audit --no-fund --ignore-scripts
          no_output_timeout: 15m
      - save_cache:
          key: v2-ui-deps-{{ checksum "ui/package-lock.json" }}
          paths:
            - ~/.npm
            - ui/node_modules
      - run:
          name: UI Typecheck
          command: cd ui && npm run typecheck
          no_output_timeout: 15m
      - run:
          name: UI Lint
          command: cd ui && npm run lint
          no_output_timeout: 15m
      - run:
          name: Analytics Timezone Invariance
          command: python3 scripts/check-tz-invariance.py
          no_output_timeout: 15m

  ui-test-slice:
    executor: node-executor
    parameters:
      slice:
        type: integer
      total:
        type: integer
        default: 4
    steps:
      - checkout
      - restore_cache:
          keys:
            - v2-ui-deps-{{ checksum "ui/package-lock.json" }}
            - v2-ui-deps-
      - run:
          name: Install UI Dependencies
          command: cd ui && npm ci --no-audit --no-fund --ignore-scripts
          no_output_timeout: 15m
      - save_cache:
          key: v2-ui-deps-{{ checksum "ui/package-lock.json" }}
          paths:
            - ~/.npm
            - ui/node_modules
      - run:
          name: Run Vitest Shard << parameters.slice >>/<< parameters.total >>
          command: cd ui && npx vitest run --shard=<< parameters.slice >>/<< parameters.total >>
          no_output_timeout: 15m
  website:
    executor: node-executor
    steps:
      - checkout
      - run:
          name: Install Python
          command: |
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends python3
          no_output_timeout: 15m
      - run:
          name: Website Asset Hygiene
          command: python3 scripts/verify-website-assets.py
          no_output_timeout: 15m
      - restore_cache:
          keys:
            - v2-website-deps-{{ checksum "website/package-lock.json" }}
            - v2-website-deps-
      - run:
          name: Install Dependencies
          command: cd website && npm ci --no-audit --no-fund
          no_output_timeout: 15m
      - save_cache:
          key: v2-website-deps-{{ checksum "website/package-lock.json" }}
          paths:
            - ~/.npm
            - website/node_modules
      - run:
          name: Install Playwright Dependencies
          command: cd website && npx playwright install --with-deps chromium
          no_output_timeout: 15m
      - run:
          name: Typecheck & Lint
          command: cd website && npm run check
          no_output_timeout: 15m
      - run:
          name: Unit Tests
          command: cd website && npm test
          no_output_timeout: 15m
      - run:
          name: Build
          command: cd website && npm run build
          no_output_timeout: 15m
  cargo-check:
    executor: rust-executor
    steps:
      - checkout
      - ensure-rust-stable
      - install-linux-deps
      - prepare-dist-stubs
      - restore_cache:
          keys:
            - v2-cargo-cache-{{ checksum "Cargo.lock" }}
            - v2-cargo-cache-
      - run:
          name: Cargo Format Check
          command: cargo fmt --all -- --check
          no_output_timeout: 15m
      - run:
          name: Cargo Check Workspace
          command: cargo check --workspace --all-targets --all-features -j 1
          no_output_timeout: 15m
      - run:
          name: Cargo Clippy
          command: cargo clippy --all-targets --all-features -j 1 -- -D warnings
          no_output_timeout: 15m
      - save_cache:
          key: v2-cargo-cache-{{ checksum "Cargo.lock" }}
          paths:
            - ~/.cargo/registry/index
            - ~/.cargo/registry/cache
            - ~/.cargo/git/db
            - target
  cargo-nextest:
    executor: rust-test-executor
    steps:
      - checkout
      - ensure-rust-stable
      - install-linux-deps
      - prepare-dist-stubs
      - restore_cache:
          keys:
            - v2-cargo-cache-{{ checksum "Cargo.lock" }}
            - v2-cargo-cache-
      - run:
          name: Install cargo-nextest
          command: |
            curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C ~/.cargo/bin
          no_output_timeout: 15m
      - run:
          name: Wait for PostgreSQL
          command: |
            for i in $(seq 1 30); do
              if (echo > /dev/tcp/localhost/5432) >/dev/null 2>&1; then
                echo "PostgreSQL is ready"
                break
              fi
              echo "Waiting for PostgreSQL..."
              sleep 1
            done
          no_output_timeout: 15m
      - run:
          name: Run Cargo Nextest
          command: cargo nextest run --workspace --all-features -j 2
          no_output_timeout: 15m
      - save_cache:
          key: v2-cargo-cache-{{ checksum "Cargo.lock" }}
          paths:
            - ~/.cargo/registry/index
            - ~/.cargo/registry/cache
            - ~/.cargo/git/db
            - target
  release-readiness:
    executor: rust-node-executor
    steps:
      - checkout
      - run:
          name: Check Release Version Self-Test
          command: node scripts/check-release-version.mjs --self-test
          no_output_timeout: 15m
      - run:
          name: Verify Updater Signature Self-Test
          command: node scripts/verify-updater-signature.mjs --self-test
          no_output_timeout: 15m
      - run:
          name: Generate Latest JSON Self-Test
          command: node scripts/generate-latest-json.mjs --self-test
          no_output_timeout: 15m
      - run:
          name: Check Updater Compatibility
          command: node scripts/check-updater-compat.mjs
          no_output_timeout: 15m
# ── Workflows ─────────────────────────────────────────────────────────
workflows:
  version: 2

  01-static-gates:
    jobs:
      - static-gates

  02-i18n-quality:
    jobs:
      - i18n

  03-ui-pipeline:
    jobs:
      - ui-lint-typecheck
      - ui-test-slice:
          matrix:
            parameters:
              slice: [1, 2, 3, 4]

  04-website:
    jobs:
      - website

  05-cargo-check:
    jobs:
      - cargo-check

  06-cargo-nextest:
    jobs:
      - cargo-nextest

  07-release-readiness:
    jobs:
      - release-readiness
