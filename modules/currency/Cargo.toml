[package]
name = "modules-currency"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "OZ-POS Currency/Exchange Module: ISO-4217 currencies, exchange rates, multi-currency support."

# Inherits [workspace.lints] from the root Cargo.toml (missing_docs = warn).
[lints]
workspace = true

[dependencies]
foundation = { workspace = true }
platform-core = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
platform-kernel = { workspace = true }
kasirmu-core = { workspace = true }
