[package]
name = "modules-settings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "kasir.mu Settings Module: store configuration, feature flags, receipt formatting, sync setup."

# Inherits [workspace.lints] from the root Cargo.toml (missing_docs = warn).
[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
foundation = { workspace = true }
# Phase 3 P3.2: the repository reaches the DB through
# kasirmu_core::db::namespaced, so core is a normal dependency (it was
# dev-only while the repository used a bare &Connection).
kasirmu-core = { workspace = true }
rusqlite = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
platform-kernel = { workspace = true }
