[package]
name = "modules-inventory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "kasir.mu Inventory Module: product catalog, stock management, variants, categories."

# Inherits [workspace.lints] from the root Cargo.toml (missing_docs = warn).
[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
foundation = { workspace = true }
rusqlite = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
platform-kernel = { workspace = true }
kasirmu-core = { workspace = true }
# P1-1: `models.rs` parses values that arrive from outside the process — a
# raw IPC string in `products.product_type`, a pasted product name — so the
# interesting cases are the ones nobody writes down. See
# `models_proptests.rs` for the contracts asserted and, importantly, for the
# one the task file asked for that this crate does NOT hold.
proptest = { workspace = true }
