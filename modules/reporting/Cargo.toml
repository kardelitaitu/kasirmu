[package]
name = "modules-reporting"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "kasir.mu Reporting Module: the reporting vertical's module shell (domain surface retired in Phase 3 P3.1)."

# Inherits [workspace.lints] from the root Cargo.toml (missing_docs = warn).
[lints]
workspace = true

# The read-only domain surface (repository/service/models/error) was retired
# in Phase 3 P3.1; the shell is all that remains, so only the deps the shell
# and its tests actually name are declared.
[dependencies]
foundation = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
platform-kernel = { workspace = true }
serde_json = { workspace = true }
