[package]
name = "oz-updater-compat-check"
version = "0.0.0"
edition = "2021"
publish = false
description = "Replicates tauri-plugin-updater's verify_signature against real minisign-verify to prove the OZ-POS release scripts emit client-compatible updater signatures (AUDIT-28 RELEASE-04)."

# Standalone crate — deliberately NOT a member of the root workspace (mirrors
# the tools/fuzz/ crate pattern), so this check does not perturb the workspace lock.
[workspace]

[dependencies]
# Pin the exact crate versions the real client resolves:
#   tauri-plugin-updater 2.10.1 -> minisign-verify "0.2" (Cargo.lock: 0.2.5)
#                                -> base64 "0.22"
minisign-verify = "=0.2.5"
base64 = "0.22"
serde_json = "1"

# Embeds an `asInvoker` requestedExecutionLevel manifest into the Windows
# exe (see build.rs + app.manifest). Without a manifest Windows treats the
# unsigned binary as an unknown app and raises a UAC/SmartScreen consent
# prompt on EVERY run; the embedded manifest declares it never requests
# elevation. No-op on non-Windows targets.
[build-dependencies]
embed-resource = "2"
