<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="autocomplete" content="off" />
    <title>kasir.mu</title>

    <!-- Favicon & PWA icons (legacy + modern browser support) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#10b981" />

    <!-- Restore saved theme before first paint to prevent theme flash. -->
    <script>
      (function() {
        // Reads BOTH keys on purpose. 'kasirmu-theme-v4' is what the app
        // writes (ThemeProvider.tsx:41); 'oz-pos-theme-v4' is the legacy key
        // it migrates FROM and then deletes on first load. This script used
        // to read only the legacy key -- which by the time it ran had been
        // removed, so `theme` was always null, no attribute was ever set,
        // and the CSS fell through to prefers-color-scheme. On a light OS
        // with the app set to dark that rendered a WHITE frame before
        // React's dark splash: the theme flash this script exists to stop.
        var theme = null;
        try {
          theme = localStorage.getItem('kasirmu-theme-v4')
               ?? localStorage.getItem('oz-pos-theme-v4');
        } catch(e) {}
        // 'default' is the pre-0.0.37 glass value; ThemeProvider maps it to
        // dark, so mirror that rather than leaving the attribute unset.
        if (theme === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
        } else if (theme === 'dark' || theme === 'default') {
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          // Nothing stored yet: match ThemeProvider's own default (dark),
          // NOT the OS. Leaving the attribute unset is what let
          // prefers-color-scheme disagree with the app's default theme.
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>

    <!-- Localize the boot-splash label before React/Fluent loads.
         Mirrors LocaleContext's storage key for the shipped locales. -->
    <script>
      (function() {
        var el = document.querySelector('[data-oz-locale-text]');
        if (!el) return;
        var locale = null;
        try { locale = localStorage.getItem('oz-pos-locale'); } catch (e) {}
        if (locale === 'id') el.textContent = 'Memuat\u2026';
      })();
    </script>

    <!-- Inline theme base styles so the first paint already has the correct background and text color. -->
    <style>
      /* `light dark` lets the browser pick from the OS, and the explicit
         per-theme rules below then decide from the app's own choice — which
         is what the script above has already written onto <html> before this
         rule is parsed. An unconditional `dark` here told the UA the canvas
         was dark regardless of theme, so a light install had a dark base
         layer under everything until the author background painted. */
      :root {
        color-scheme: light dark;
        accent-color: #5a9fd4;
      }
      html[data-theme="dark"] { color-scheme: dark; }
      html[data-theme="light"] { color-scheme: light; }

      html, body {
        background: radial-gradient(ellipse at 50% -10%, #132540 0%, #07111d 60%, #040a12 100%);
        color: #f0f6ff;
        margin: 0;
        padding: 0;
        /* `height` + `overflow: hidden`, matching index.mobile.html. This entry
           used `min-height: 100dvh` on html, body AND #root, so three
           full-viewport minimums stacked and the document ran a fraction
           taller than the window — enough to raise a scrollbar over the
           splash, which is position:fixed inset:0 and therefore exactly
           viewport-sized. The shell itself never scrolls the document:
           .app-layout is height:100dvh/overflow:hidden and .app-content owns
           the only content scroll (AppLayout.css), so clamping the document
           cannot take scrolling away from any screen. */
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
      }

      /* Light theme override (applied via data-theme attribute or OS preference).
         Must name BODY as well as html. The dark rule above is `html, body`,
         and a bare `html[data-theme="light"]` outranks it on <html> only
         (0,1,1 vs 0,0,1) — <body> kept matching the dark gradient, so a
         light-themed install painted a DARK first frame and then flipped to
         the white React splash. That flash is the defect this rule repairs. */
      html[data-theme="light"],
      html[data-theme="light"] body {
        background: linear-gradient(160deg, #f1f5f9 0%, #e9eef4 50%, #e2e8f0 100%);
        color: #1e293b;
      }

      /* height, not min-height: the third stacked viewport block was the
         overflow this entry's scrollbar came from. Mirrors index.mobile.html,
         which already shipped this shape. */
      #root {
        height: 100%;
        overflow: hidden;
      }
    </style>

    <!-- Boot splash (stage 1): token-first with static fallbacks so the
         very first frame is correct even before tokens.css lands; once
         the theme stylesheet loads the vars resolve to theme values.
         Keep values in sync with the React stage
         (components/AppBootSplash.tsx) and index.mobile.html. -->
    <style>
      .app-splash {
        position: fixed;
        inset: 0;
        /* Same stacking as the React stage: --z-splash is the highest token
           on the scale (tokens.css), so the splash covers modal/toast/tooltip.
           The fallback matters because tokens.css has not loaded yet at this
           stage — without a z-index here the element is `auto`, and `auto`
           loses to any LATER body sibling that sets one, so a dev overlay or
           a drag region would paint over the splash while the app is still
           booting. That is the exact property the "keep values in sync"
           comment above promises is kept. */
        z-index: var(--z-splash, 700);
        /* Own background, so the splash never depends on what is behind it.
           It used to be transparent and rely on <body>, whose base is the
           DARK gradient — so stage 1 painted dark in BOTH themes and a
           light-themed install saw a dark loading screen. The React stage
           always had this (components.css sets --color-bg-primary); stage 1
           did not, which is the drift that let it differ.
           The literals are the :root/tokens.css values, needed because
           tokens.css has not loaded when this rule first paints. */
        background-color: var(--color-bg-primary, #111827);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: var(--space-5, 1.25rem);
        color: var(--color-fg-secondary, #94a3b8);
        font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif);
        font-size: var(--text-base, 0.875rem);
      }
      /* Theme-aware first frame. The var() fallback above cannot know the
         theme, so a light install would still paint #111827 until tokens.css
         lands. These rules use the same hardcoded palette the <body> rules
         use, and they match the React stage's --color-bg-primary per theme. */
      html[data-theme="dark"] .app-splash,
      html:not([data-theme="light"]) .app-splash {
        background-color: #111827;
      }
      html[data-theme="light"] .app-splash {
        background-color: #ffffff;
      }
      html[data-theme="light"] .app-splash { color: #596577; }
      .app-splash__label { font-size: var(--text-sm, 0.75rem); }
    </style>

    <!-- No remote font reference here on purpose. Both shells ship CSP
         font-src 'self' data: and name no font origin, so this link could
         never load in a packaged build — it only made bare-browser dev
         render a face the shipped app does not have. -->
  </head>
  <body>
    <!-- ── Static boot splash (pre-React stage) ──────────────────────
         Painted by the browser from HTML alone — no JS, no fonts, no
         chunks. Covers the dead white/blank frame between navigation
         start (F5) and React's first commit. React replaces this node
         on mount (ReactDOM.createRoot clears container children), so
         there is no manual removal to leak. Keep the inline styles
         synchronized with .app-splash in themes/components.css and
         index.mobile.html. -->
    <div id="boot-splash" aria-hidden="true">
      <div class="app-splash">
        <span class="app-splash__label" data-oz-locale-text>Loading…</span>
      </div>
    </div>
    <div id="root"></div>
    <!-- Dev-mode Tauri mock (stubbed IPC for browser-only preview).
         Vite alias (dev-mock/tauri-api.ts) handles all invoke() calls.
         Only mockWindows / mockConvertFileSrc need the Tauri mocks
         lib — and those are skipped when __TAURI_INTERNALS__ is locked. -->
    <script type="module">
      import { mockWindows, mockConvertFileSrc } from '@tauri-apps/api/mocks';

      // ── Robust Tauri v2 mock bootstrap ──────────────────────────
      //
      // Tauri v2 defines __TAURI_INTERNALS__ as read-only. The mocks lib
      // needs it to be writable so it can install ipc / convertFileSrc stubs.
      // It also expects a transformCallback stub so channel-based IPC
      // (event listeners, streaming) doesn't crash before the mock is installed.
      //
      // The Vite alias (dev-mock/tauri-api.ts) handles invoke() directly,
      // so the window-level stubs are a best-effort complement.

      const MOCK_INTERNALS_STUB = {
        // Stub transformCallback so code that accesses it before mockWindows
        // runs doesn't throw. Returns a unique ID — unused since invoke() is
        // handled by the Vite alias.
        transformCallback(callback, _once) {
          const id = window.crypto?.randomUUID?.()
            ?? `cb-${Date.now()}-${Math.random().toString(36).slice(2)}`;
          return id;
        },
      };

      let mocksReady = false;
      try {
        delete window.__TAURI_INTERNALS__;
        Object.defineProperty(window, '__TAURI_INTERNALS__', {
          value: MOCK_INTERNALS_STUB,
          writable: true,
          configurable: true,
        });
        mocksReady = true;
      } catch {
        console.warn('[DEV] __TAURI_INTERNALS__ is locked — window mocks skipped');
      }

      if (mocksReady) {
        mockWindows('main');
        mockConvertFileSrc('windows');
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
