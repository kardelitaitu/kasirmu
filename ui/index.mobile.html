<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- TAB-05: WCAG 1.4.4 (Resize Text) — no maximum-scale / user-scalable
         lockout. Pinch-zoom stays enabled; touch-action: manipulation in the
         inline styles below prevents double-tap zoom without blocking
         pinch-to-zoom. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#10b981" />

    <!-- Favicon & PWA icons (legacy + modern browser support) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <title>Kasir.mu</title>
    <!-- Restore saved theme before first paint to prevent theme flash. -->
    <script>
      (function() {
        // Reads BOTH keys on purpose. 'kasirmu-theme-v4' is what the app
        // writes (ThemeProvider.tsx:41); 'oz-pos-theme-v4' is the legacy key
        // it migrates FROM and then deletes on first load. This script used
        // to read only the legacy key -- which by the time it ran had been
        // removed, so `theme` was always null, no attribute was ever set,
        // and the CSS fell through to prefers-color-scheme. On a light OS
        // with the app set to dark that rendered a WHITE frame before
        // React's dark splash: the theme flash this script exists to stop.
        var theme = null;
        try {
          theme = localStorage.getItem('kasirmu-theme-v4')
               ?? localStorage.getItem('oz-pos-theme-v4');
        } catch(e) {}
        // 'default' is the pre-0.0.37 glass value; ThemeProvider maps it to
        // dark, so mirror that rather than leaving the attribute unset.
        if (theme === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
        } else if (theme === 'dark' || theme === 'default') {
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          // Nothing stored yet: match ThemeProvider's own default (dark),
          // NOT the OS. Leaving the attribute unset is what let
          // prefers-color-scheme disagree with the app's default theme.
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>

    <!-- Localize the boot-splash label before React/Fluent loads.
         Mirrors LocaleContext's storage key for the shipped locales. -->
    <script>
      (function() {
        var el = document.querySelector('[data-oz-locale-text]');
        if (!el) return;
        var locale = null;
        try { locale = localStorage.getItem('oz-pos-locale'); } catch (e) {}
        if (locale === 'id') el.textContent = 'Memuat\u2026';
      })();
    </script>

    <!-- Inline theme base styles so the first paint already has the correct background and text color. -->
    <style>
      /* `light dark` lets the browser pick from the OS, and the explicit
         per-theme rules below then decide from the app's own choice — which
         is what the script above has already written onto <html> before this
         rule is parsed. An unconditional `dark` here told the UA the canvas
         was dark regardless of theme, so a light install had a dark base
         layer under everything until the author background painted. */
      :root {
        color-scheme: light dark;
        accent-color: #5a9fd4;
      }
      html[data-theme="dark"] { color-scheme: dark; }
      html[data-theme="light"] { color-scheme: light; }

      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: none;
        touch-action: manipulation;
        background: radial-gradient(ellipse at 50% -10%, #132540 0%, #07111d 60%, #040a12 100%);
        color: #f0f6ff;
      }

      /* Light theme override (applied via data-theme attribute or OS preference).
         Must name BODY as well as html — see the longer note in index.html:
         the dark rule is `html, body`, so a bare `html[data-theme="light"]`
         repainted only <html> and left <body> dark on a light-themed boot. */
      html[data-theme="light"],
      html[data-theme="light"] body {
        background: linear-gradient(160deg, #f1f5f9 0%, #e9eef4 50%, #e2e8f0 100%);
        color: #1e293b;
      }

      #root {
        height: 100%;
        overflow: hidden;
      }
    </style>

    <!-- Boot splash (stage 1): token-first with static fallbacks so the
         very first frame is correct even before tokens.css lands; once
         the theme stylesheet loads the vars resolve to theme values.
         Keep values in sync with the React stage
         (components/AppBootSplash.tsx) and index.html. -->
    <style>
      .app-splash {
        position: fixed;
        inset: 0;
        /* Same stacking as the React stage: --z-splash is the highest token
           on the scale (tokens.css), so the splash covers modal/toast/tooltip.
           The fallback matters because tokens.css has not loaded yet at this
           stage — without a z-index here the element is `auto`, and `auto`
           loses to any LATER body sibling that sets one, so a dev overlay or
           a drag region would paint over the splash while the app is still
           booting. That is the exact property the "keep values in sync"
           comment above promises is kept. */
        z-index: var(--z-splash, 700);
        /* Own background matching StaffLoginScreen, so the splash seamlessly
           shares canvas with the login screen without any color pop or shift. */
        background-color: var(--color-bg, #12141a);
        background:
          radial-gradient(
            ellipse 80% 60% at 50% 30%,
            color-mix(in srgb, var(--color-accent, #147EFB) 6%, transparent),
            transparent 70%
          ),
          var(--color-bg, #12141a);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: var(--space-5, 1.25rem);
        color: var(--color-fg-secondary, #94a3b8);
        font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif);
        font-size: var(--text-base, 0.875rem);
      }
      /* Theme-aware first frame. The var() fallback above cannot know the
         theme, so a light install would still paint dark until tokens.css
         lands. These rules use the same hardcoded palette the <body> rules
         use, and match the login screen background per theme. */
      html[data-theme="dark"] .app-splash,
      html:not([data-theme="light"]) .app-splash {
        background-color: #12141a;
        background:
          radial-gradient(
            ellipse 80% 60% at 50% 30%,
            rgba(20, 126, 251, 0.06),
            transparent 70%
          ),
          #12141a;
      }
      html[data-theme="light"] .app-splash {
        background-color: #ffffff;
        background:
          radial-gradient(
            ellipse 80% 60% at 50% 30%,
            rgba(20, 126, 251, 0.04),
            transparent 70%
          ),
          #f4f5f7;
      }
      html[data-theme="light"] .app-splash { color: #596577; }
      .app-splash__label { font-size: var(--text-sm, 0.75rem); }
    </style>
  </head>
  <body>
    <!-- ── Static boot splash (pre-React stage) ──────────────────────
         Painted by the browser from HTML alone — no JS, no fonts, no
         chunks. Covers the dead blank frame between navigation start
         (F5) and React's first commit. The React stage
         (components/AppBootSplash.tsx) removes it on mount. Keep the
         inline styles synchronized with index.html. -->
    <div id="boot-splash" aria-hidden="true">
      <div class="app-splash">
        <span class="app-splash__label" data-oz-locale-text>Loading…</span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.mobile.tsx"></script>
  </body>
</html>
