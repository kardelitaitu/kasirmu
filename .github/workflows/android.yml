# ── Android Build Pipeline ─────────────────────────────────────────────
#
# Builds the Android APK for the OZ-POS tablet client (apps/mobile-tauri).
#
# RESTORED 2026-09-22 from .github/workflows/attic/android.yml.bak, which
# 23c963303 retired on 2026-09-02 and 54f64de83 parked in attic/. It is NOT a
# rename: the retired copy could not work as written, and every deviation below
# is deliberate and labelled.
#
# WHY IT EXISTS. ADR #57 §2.1 computes an APK signing-certificate fingerprint
# over JNI in the tablet shell. That read was verified by hand on a real device on
# 2026-09-22, but nothing in CI compiled the Android target — so a regression that
# broke it would be caught by a person, not a pipeline. This job closes that gap:
# it compiles the tablet app for Android and fails if no APK is produced.
#
# VALIDATION, STATED SO NOBODY OVER-TRUSTS THIS FILE. It passes `actionlint` with
# zero findings (2026-09-22), which covers the YAML structure, every `[object Object]`
# expression, the action inputs, and the job graph. It has NEVER BEEN RUN — it
# cannot be, locally. Two things that were therefore NOT checked: the `run:` shell
# blocks (actionlint only lints those when `shellcheck` is on PATH, and it is not on
# this machine), and whether the Android SDK/NDK install actually resolves on a
# GitHub runner. Expect the first `workflow_dispatch` to be the real test; that is
# also why the triggers are narrow, so a first-run failure cannot block a merge.
#
# TRIGGERS ARE DELIBERATELY NARROW. No pull_request/push trigger, so a workflow
# that cannot be exercised locally cannot block anyone's normal flow. Promote it
# to a PR trigger only after it has run green at least once via workflow_dispatch.
#
# Secrets (optional — an absent keystore yields an UNSIGNED apk that still proves
# the build compiles, which is this job's actual assertion):
#   ANDROID_KEYSTORE_BASE64  — base64-encoded .keystore file
#   KEYSTORE_PASSWORD        — keystore master password
#   KEY_PASSWORD             — key password (defaults to KEYSTORE_PASSWORD)
#   KEY_ALIAS                — key alias in the keystore

name: Android Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  android-build:
    name: Android APK (aarch64)
    runs-on: ubuntu-latest
    # A cold Android release build is slow; the local measurement in
    # apps/mobile-tauri/AGENTS.md is ~2m on a warm tree, but a CI runner starts
    # cold and also builds the Rust dependency graph for a new target.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      # ── JDK 21, matching apps/mobile-tauri/AGENTS.md ────────────
      # ADAPTED: the retired file pinned JDK 17. The repo now pins 21
      # (`JAVA_HOME` must be JDK 21, never Android Studio's JBR), and CI should
      # match the toolchain the guide tells contributors to use, or a build that
      # passes here can fail there.
      - name: Setup JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      # ── NDK, installed explicitly ───────────────────────────────
      # ADDED. The retired file never installed the NDK, and its own header blamed
      # "the NDK toolchain" for it being a stub — so this is the likely reason it
      # was unreliable. The version matches apps/mobile-tauri/AGENTS.md
      # (30.0.14904198); cargo-ndk needs ANDROID_NDK_HOME to point at it.
      - name: Install Android NDK
        run: |
          yes | sdkmanager --install "ndk;30.0.14904198" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/30.0.14904198" >> "$GITHUB_ENV"

      # ── Rust toolchain ──────────────────────────────────────────
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: mozilla/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      # ── Node, for tauri.conf.json's beforeBuildCommand ──────────
      # The tablet UI is NOT built as a separate step any more: it moved into
      # `beforeBuildCommand` ("npm run build:mobile --prefix ../ui"), which the
      # Tauri CLI runs for us. The retired file called
      # `vite build --config vite.tablet.config.ts`, and that file no longer
      # exists (renamed to vite.mobile.config.ts by the P11 tree rename). Node is
      # still needed, and so is ui/node_modules.
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'ui/package-lock.json'

      - name: Install UI dependencies
        run: cd ui && npm ci --no-audit --no-fund --ignore-scripts

      # ── Rust build tooling ──────────────────────────────────────
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      # ── Optional signing ────────────────────────────────────────
      # ADAPTED PATH: apps/tablet-client -> apps/mobile-tauri (P11 rename).
      # Writes gen/android/keystore.properties, which the tracked
      # build.gradle.kts signingConfigs block reads. Without the secret this step
      # is skipped and the release build is simply unsigned — still a valid
      # compile check, but not installable.
      - name: Decode keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cd apps/mobile-tauri/gen/android
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > oz-pos-release.keystore
          echo "keyAlias=$KEY_ALIAS" > keystore.properties
          echo "password=$KEYSTORE_PASSWORD" >> keystore.properties
          echo "storeFile=$(pwd)/oz-pos-release.keystore" >> keystore.properties

      # ── Build ───────────────────────────────────────────────────
      # `--target aarch64` matches the single-ABI path the guides measure
      # (apps/mobile-tauri/AGENTS.md) and skips three ABIs nobody ships.
      # No `tauri android init`: the scaffold is COMMITTED (44 tracked files
      # under apps/mobile-tauri/gen/android), so init is unnecessary here and
      # the retired file's call to it was redundant at best.
      - name: Build Android APK
        run: cd apps/mobile-tauri && cargo tauri android build --apk --target aarch64

      # ── Signing material must not linger ────────────────────────
      - name: Remove decoded signing material
        if: always()
        run: |
          rm -f apps/mobile-tauri/gen/android/oz-pos-release.keystore
          rm -f apps/mobile-tauri/gen/android/keystore.properties

      # ── THE ASSERTION ───────────────────────────────────────────
      # The whole point of this job: an APK was actually produced. Bare
      # `upload-artifact` only warns when it finds nothing, so a build that
      # silently emitted no APK would go green without this.
      - name: Assert the APK exists
        run: |
          set -euo pipefail
          count=$(find apps/mobile-tauri/gen/android/app/build/outputs/apk -name '*.apk' | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error::no APK was produced — the Android build did not complete"
            exit 1
          fi
          find apps/mobile-tauri/gen/android/app/build/outputs/apk -name '*.apk' -exec ls -lh {} \;

      # ── Report the signing certificate ──────────────────────────
      # This is the value ADR #57 §2.1 fingerprints at runtime. Printing it here
      # makes the certificate readable from a CI log, so the on-device read has a
      # recorded expectation to compare against rather than a hand-run one.
      # Skipped (not failed) when the build was unsigned — apksigner reports the
      # debug/absent cert differently and that is not a build failure.
      - name: Print the APK signing certificate
        continue-on-error: true
        run: |
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -1)
          APK=$(find apps/mobile-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -1)
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kasirmu-tablet-aarch64
          path: apps/mobile-tauri/gen/android/app/build/outputs/apk/**/*.apk
          retention-days: 90

      - name: sccache stats
        if: always()
        run: sccache --show-stats

# NOT RESTORED, deliberately: the retired file's final step attached the APK to
# the GitHub Release created by release.yml, polling up to 60 minutes for it.
# That is a RELEASE feature, not the build-regression coverage this job exists
# for, and an untested 60-minute poll is a poor first impression for a workflow
# nobody has run yet. Add it once this job has gone green at least once; the
# original logic is preserved at .github/workflows/attic/android.yml.bak:166-205.
