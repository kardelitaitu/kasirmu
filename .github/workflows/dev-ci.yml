name: Dev CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  SCCACHE_GHA_ENABLED: "true"

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  # ── 0. Changes: path router ──────────────────────────────────────────
  # Every job below is gated on this one's outputs. Motivation, measured on
  # PR #95: three pushes cost 75.2 runner-minutes, and the last of them added a
  # 254-line markdown file — 22.0 minutes of Cargo Nextest/Check/UI/Website
  # re-running over a change no job can fail on. Rust is ~77% of every run.
  #
  # Deliberately a plain job rather than dorny/paths-filter: every action in
  # this workflow is pinned to a full commit SHA, and introducing a new
  # third-party dependency is a supply-chain decision that should be explicit.
  # This costs one ~15s job to route the rest.
  #
  # NOTE ON BRANCH PROTECTION: main is currently unprotected, so a job that
  # skips simply reports as skipped. If these jobs are ever made *required*
  # status checks, workflow-level `paths:` would strand PRs (the check never
  # reports), and job-level skipping as used here is the safe form — but a
  # required check that reports "skipped" still satisfies the merge gate, so
  # this design holds either way. What must NOT be done is moving these
  # conditions up to `on.pull_request.paths`.
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.route.outputs.rust }}
      ui: ${{ steps.route.outputs.ui }}
      i18n: ${{ steps.route.outputs.i18n }}
      website: ${{ steps.route.outputs.website }}
      docs: ${{ steps.route.outputs.docs }}
      release: ${{ steps.route.outputs.release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history so the base..head diff has both endpoints. A shallow
          # clone cannot resolve the merge base reliably.
          fetch-depth: 0
      - name: Route
        id: route
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Anything that is not a PR (workflow_dispatch) runs the full matrix,
          # as does a change to this workflow itself -- a filter bug must never
          # be able to hide the jobs it is supposed to gate.
          all() {
            for k in rust ui i18n website docs release; do echo "$k=true" >> "$GITHUB_OUTPUT"; done
            echo "  -> $1: running the full matrix"
            exit 0
          }

          if [ "$EVENT" != "pull_request" ] || [ -z "${BASE:-}" ]; then
            all "non-PR event"
          fi

          files=$(git diff --name-only "$BASE" "$HEAD_SHA")
          echo "changed files:"; echo "$files" | sed 's/^/    /'

          if printf '%s\n' "$files" | grep -qE '^\.github/workflows/dev-ci\.yml$'; then
            all "this workflow changed"
          fi

          # Rust: every workspace member (crates/*, modules/*, platform/*,
          # foundation, the three apps, fuzz, the updater compat check) plus
          # anything that changes how cargo resolves the build.
          printf '%s\n' "$files" | grep -qE \
            '^crates/|^modules/|^platform/|^foundation/|^apps/(cloud-server|desktop-client|tablet-client)/|^fuzz/|^scripts/updater-compat-check/|^Cargo\.(toml|lock)$|^\.cargo/|^rust-toolchain' \
            && echo "rust=true"  >> "$GITHUB_OUTPUT" || echo "rust=false" >> "$GITHUB_OUTPUT"

          # UI: ui/src has zero imports reaching outside ui/, so ui/ is a sound
          # boundary for the vitest suite and its lockfile.
          printf '%s\n' "$files" | grep -qE '^ui/' \
            && echo "ui=true" >> "$GITHUB_OUTPUT" || echo "ui=false" >> "$GITHUB_OUTPUT"

          # i18n: the .ftl bundles, any TSX/TS the parity scanner reads, and the
          # three scripts that implement the gate.
          printf '%s\n' "$files" | grep -qE \
            '^ui/src/locales/|^ui/src/.*\.(ts|tsx)$|^scripts/lint-i18n\.sh$|^scripts/verify-bundle-parity\.py$|^scripts/dedupe-ftl\.py$' \
            && echo "i18n=true" >> "$GITHUB_OUTPUT" || echo "i18n=false" >> "$GITHUB_OUTPUT"

          printf '%s\n' "$files" | grep -qE '^website/' \
            && echo "website=true" >> "$GITHUB_OUTPUT" || echo "website=false" >> "$GITHUB_OUTPUT"

          # Docs/CI truthfulness: the drift checker compares docs/operations/
          # ci-pipeline.md, gates.json, the workflow files and the two local
          # runners against each other. It must fire on ANY of those, and on
          # docs/ generally -- a docs-only PR is exactly the change that can make
          # the CI documentation lie, and before this output existed it ran
          # nothing at all.
          printf '%s\n' "$files" | grep -qE \
            '^docs/|^\.github/workflows/|^scripts/(gates\.json|verify-ci-docs-drift\.py|check\.sh|check-ui\.mjs)$' \
            && echo "docs=true" >> "$GITHUB_OUTPUT" || echo "docs=false" >> "$GITHUB_OUTPUT"

          # Release readiness. R36-11 was filed because the release workflow was
          # retired with an empty commit message and nothing noticed that tagging
          # had stopped producing installers. The deeper cause: the scripts that
          # workflow calls were exercised by NO automated runner at all, so the
          # signing chain could have broken silently too. This route makes a
          # change to any part of it prove the chain still verifies.
          #
          # `tauri.conf.json` is in here because it carries the updater `pubkey`:
          # rotate or typo that key and every client auto-update rejects the
          # signature, which is precisely what check-updater-compat.mjs detects.
          printf '%s\n' "$files" | grep -qE \
            '^scripts/(check-release-version|check-updater-compat|generate-latest-json|verify-updater-signature)\.mjs$|^scripts/updater-compat-check/|^apps/desktop-client/tauri\.conf\.json$|^apps/desktop-client/Cargo\.toml$|^\.github/workflows/release\.yml$|^docs/releases/' \
            && echo "release=true" >> "$GITHUB_OUTPUT" || echo "release=false" >> "$GITHUB_OUTPUT"

      - name: Decisions
        run: |
          echo "rust=${{ steps.route.outputs.rust }} ui=${{ steps.route.outputs.ui }} i18n=${{ steps.route.outputs.i18n }} website=${{ steps.route.outputs.website }}"

  # ── 1. Website: check + test + build ─────────────────────────────────
  website:
    name: Website Check + Build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.website == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Stdlib-only, so it runs before the npm install below: an oversized or
      # raster-in-SVG asset should fail in seconds rather than after a minute of
      # dependency setup. Gate: scripts/gates.json -> "website-assets".
      - name: Website asset hygiene
        run: python3 scripts/verify-website-assets.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'website/package-lock.json'
      - name: Install dependencies
        run: cd website && npm ci --no-audit --no-fund
      - name: Install Playwright (for Mermaid render)
        run: cd website && npx playwright install --with-deps chromium
      - name: Typecheck & Lint
        run: cd website && npm run check
      - name: Unit tests
        run: cd website && npm test
      - name: Build
        run: cd website && npm run build

  # ── 2. Cargo Check: Fast compilation check ────────────────────────────
  cargo-check:
    name: Cargo Check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          # Explicit: the fmt/clippy steps below need these binaries. Making a
          # hard dependency an action's implicit default is how a job starts
          # failing on a toolchain change rather than on a code change.
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libdbus-1-dev libudev-dev pkg-config
      - uses: mozilla/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - name: Prepare frontend dist stubs for Tauri macro
        run: |
          mkdir -p ui/dist ui/dist-tablet ui/dist-desktop
          touch ui/dist/index.html ui/dist-tablet/index.html ui/dist-desktop/index.html
      # Runs before `cargo check` deliberately: it is ~2s warm, so a formatting
      # nit fails fast instead of after a multi-minute compile. Gate:
      # scripts/gates.json -> "rust-fmt".
      - name: Cargo fmt check
        run: cargo fmt --all -- --check
      - name: Cargo check workspace
        run: cargo check --workspace --all-targets --all-features
      # `-D warnings` promotes every clippy warning to an error, matching the
      # repo's own standing rule in AGENTS.md ("must resolve all warnings").
      # Verified green locally before this step was added, so it cannot turn an
      # unrelated PR red. Gate: scripts/gates.json -> "rust-clippy".
      - name: Cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  # ── 3. Cargo Nextest: Fast test execution ────────────────────────────
  cargo-nextest:
    name: Cargo Nextest
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: oz_test
          POSTGRES_PASSWORD: oz_test_password
          POSTGRES_DB: oz_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      OZ_TEST_PG_URL: postgres://oz_test:oz_test_password@localhost:5432/oz_test_db
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libdbus-1-dev libudev-dev pkg-config
      - uses: mozilla/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - name: Prepare frontend dist stubs for Tauri macro
        run: |
          mkdir -p ui/dist ui/dist-tablet ui/dist-desktop
          touch ui/dist/index.html ui/dist-tablet/index.html ui/dist-desktop/index.html
      - name: Install cargo-nextest
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2
        with:
          tool: cargo-nextest
      - name: Run Nextest
        run: cargo nextest run --workspace --all-features

  # ── 4. UI Test: Frontend Vitest suite ─────────────────────────────────
  ui-test:
    name: UI Tests (Vitest)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'ui/package-lock.json'
      - name: Install UI dependencies
        run: cd ui && npm ci --no-audit --no-fund --ignore-scripts
      # `npm test` is bare `vitest run`, which transpiles WITHOUT type-checking,
      # so a type error was invisible to CI. These two steps close that.
      # Gate: scripts/gates.json -> "ui-typecheck", "ui-lint".
      - name: UI typecheck
        run: cd ui && npm run typecheck
      - name: UI lint
        run: cd ui && npm run lint
      - name: Run Vitest
        run: cd ui && npm test
      # GitHub runners are always UTC, so the suite above can never catch a
      # host-timezone dependency. This re-runs the analytics anchor test under
      # four zones and fails if results diverge -- the only CI coverage for the
      # defect that broke PR #95 on a UTC runner.
      # Gate: scripts/gates.json -> "analytics-tz-invariance".
      - name: Analytics timezone invariance
        run: python3 scripts/check-tz-invariance.py

  # ── 5. i18n: Fluent bundle quality gate ──────────────────────────────
  # Restored by the Fluent page audit. This step used to live in ci.yml, which
  # 23c96330 ("backup full workflows to .bak and introduce streamlined Quick
  # Dev CI") retired without a replacement — so for a while the only thing
  # checking locale integrity was the local pre-commit hook, which a fresh
  # clone does not get: core.hooksPath is set by scripts/setup-dev.ps1, not by
  # the repository. scripts/lint-i18n.sh is fail-closed on three categories:
  #   * .id.ftl siblings byte-identical to their English source (Indonesian
  #     users see English text on that screen),
  #   * duplicate Fluent keys, which are silently dropped at bundle join with
  #     first-loaded-wins,
  #   * literal key references resolving in neither locale, across all six
  #     surfaces (getString, requiredLocalized, <Localized id>, nav i18nKey,
  #     SECTION_LABELS, object-literal key fields) and all of ui/src.
  # python3 is preinstalled on ubuntu-latest and these scripts are stdlib-only.
  i18n:
    name: i18n Quality Gate
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.i18n == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'ui/package-lock.json'
      - name: Install UI dependencies
        run: cd ui && npm ci --no-audit --no-fund --ignore-scripts
      - name: i18n lint (parity + untranslated siblings + duplicate keys)
        run: bash scripts/lint-i18n.sh
      - name: FTL duplicate-key dry-run
        run: python3 scripts/dedupe-ftl.py --dry-run

  # ── 6. CI docs / manifest truthfulness ─────────────────────────────────
  # gates.json calls itself "the single source of truth for CI/local-runner gate
  # names and status", and 32 of its 40 `required` gates point at workflows that
  # GitHub no longer executes (R36-10). verify-ci-docs-drift.py has reported that
  # precisely and continuously -- but until now it ran only in the manual
  # check.sh, so the gate auditing CI truthfulness was the one thing CI truthfulness
  # never audited.
  #
  # Deliberately continue-on-error: the checker currently fails with 69 items, and
  # turning CI red for unrelated PRs is worse than the status quo. The point of
  # this step is to make the number VISIBLE and trending on every docs/CI change;
  # flip it to blocking as part of closing R36-10, once the count reaches 0.
  # Not added to northflank-deploy's `needs` for the same reason.
  # Gate: scripts/gates.json -> "ci-docs-drift".
  ci-docs-drift:
    name: CI Docs Drift
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Blocking: the router decides whether every other job runs, so a routing
      # bug that silently skips a suite is the one failure mode this workflow
      # must never allow. The test extracts the real body, so it cannot drift
      # from what CI runs. Gate: scripts/gates.json -> "ci-routing-test".
      - name: CI path router regression test
        run: bash scripts/test-ci-routing.sh
      # This job is the one that decides whether every other job is documented
      # truthfully, so it needs the same proof it demands of others: a mutation
      # test showing it can still fail. Without it, "drift: 0 items" is
      # indistinguishable from "the checker stopped looking" -- the exact failure
      # that let the manifest rot in the first place.
      # Gate: scripts/gates.json -> "ci-docs-drift".
      - name: Drift checker self-test
        run: python3 scripts/verify-ci-docs-drift.py --self-test
      # gates.json is the declared source of truth for which step enforces which
      # gate, so a label naming a step that no longer exists is a false guarantee --
      # and the checker used to accept it, because its runner test was any-of over
      # the labels a gate declares. This mutates check.sh and requires the checker to
      # notice, and first proves the fixture is live at all.
      # Gate: scripts/gates.json -> "runner-labels".
      - name: Runner label integrity
        run: python3 scripts/test-runner-labels.py
      - name: Verify CI docs agree with gates.json and the workflows
        id: drift
        run: |
          set -uo pipefail
          # Blocking as of R36-10 closing: the count reached 0, which was the
          # stated condition for flipping this. It was advisory only while the
          # checker was reporting 77 pre-existing items it had no vocabulary for;
          # keeping it advisory now would mean a future regression is invisible
          # -- which is exactly how the manifest rotted in the first place.
          # The step summary is kept because a bare exit code tells a reader
          # nothing about WHICH contract broke.
          if python3 scripts/verify-ci-docs-drift.py > drift.log 2>&1; then
            status="PASS"
            count=0
          else
            status="FAIL"
            count="$(grep -oE '[0-9]+ drift item' drift.log | tail -1 | grep -oE '[0-9]+' || echo '?')"
          fi
          echo "$status ($count item(s))" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat drift.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat drift.log
          echo "drift_status=$status" >> "$GITHUB_OUTPUT"
          echo "drift_count=$count" >> "$GITHUB_OUTPUT"
          [ "$status" = "PASS" ]

      # The three AGENTS.md mirrors are policed for gate counts and CI claims by
      # the same argument that made the step above blocking: a document that
      # tells agents what is and is not enforced is load-bearing. Twice in this
      # release a mirror stated something the repo contradicted -- `.agents` said
      # Go had no CI backstop after `13f2a1dc` added one, and root said dev-ci
      # "runs on every PR and push" when it has no push trigger. `bump-version.ps1`
      # syncs the mirrors' *version* lines and nothing syncs their *claims*, so
      # this is the sync that was missing.
      #
      # Blocking from day one, unlike ci-docs-drift: it has no baseline and no
      # pre-existing failures, so there is nothing to be red about. Ground truth
      # is read from .githooks/pre-commit, .github/workflows/*.yml and Cargo.toml
      # rather than asserted, so bumping the version or adding a gate updates the
      # expectation automatically. --self-test mutates each mirror and requires a
      # specific finding, and reports a mutation that changes nothing as WRONG
      # rather than letting a check pass because its fixture no longer applies.
      # Gate: scripts/gates.json -> "agents-mirrors".
      - name: AGENTS.md mirror truthfulness
        run: |
          python3 scripts/verify-agents-mirrors.py
          python3 scripts/verify-agents-mirrors.py --self-test

  # ── 7. Static gates that had no CI runner at all ──────────────────────
  # Six checks existed only in scripts/check.sh, which is manual and unhooked,
  # so nothing enforced them on a clone that skipped setup-dev.ps1. Each was run
  # locally and verified GREEN before being wired in -- the same discipline used
  # for R36-08 -- because adding a gate that already fails turns every unrelated
  # PR red.
  #
  # Deliberately NOT in this job:
  #   e2e -- needs the Docker backend; check.sh L203 states E2E is not run there
  #     either. Still only reachable via `cd ui && npm run check:all`.
  #
  # panic-inventory was excluded when this job was first written because it
  # FAILED, and is now included with its findings at zero -- see the step below.
  #
  # Not path-gated: these are ~5s of pure Python/shell and they span rust, ui,
  # go and docs, so routing them risks the same silent-skip failure mode the
  # router test guards against.
  # Gates: scripts/gates.json -> "architecture-boundaries",
  # "no-hardcoded-money-format", "windows-config", "skill-drift",
  # "unified-healthcheck", "go".
  static-gates:
    name: Static Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        # fetch-depth 0 because the subject gate walks a commit range. The
        # default depth of 1 would make `base..HEAD` contain nothing, and the step
        # would pass by checking zero commits -- a green result from an empty
        # input, which is the failure mode every other gate in this job was built
        # to avoid.
        with:
          fetch-depth: 0
      - name: Architecture boundaries
        run: python3 scripts/verify-architecture-boundaries.py --strict
      - name: No hardcoded money formatting
        run: python3 scripts/verify-no-hardcoded-money-format.py
      - name: Windows config drift
        run: python3 scripts/verify-windows-config.py
      - name: Skill drift guard
        run: bash .agents/skills/skill-drift-guard/scripts/detect.sh --report
      - name: Unified healthcheck script test
        run: sh apps/unified/test-healthcheck.sh
      # Restored to CI by R36-12. It was excluded from the first version of this
      # job because it FAILS, and adding a red gate would have turned every
      # unrelated PR red. The failures turned out to be the scanner's own bug --
      # it read the repo's audit stamps as code, and in one file had silently
      # stopped checking at all -- so the gate is now wired in with its findings
      # at zero and its contract stable under `cargo fmt`.
      - name: Panic inventory (ADR #33)
        run: python3 scripts/scan-unwrap-panic.py --fail-on-recoverable
      # R36-11: release.yml was renamed to .bak with an empty commit message and
      # nothing noticed that tagging had stopped producing installers. A workflow
      # that never runs cannot report its own breakage, so this validates the
      # parts that need no tag, key material, or macOS/Windows runner: action
      # pins, referenced paths, docker residue, an inventory gate that demands an
      # artifact no matrix entry builds, and -- most importantly -- that a missing
      # UPDATER_PRIVATE_KEY still hard-fails rather than publishing an unsigned
      # manifest every client will reject.
      - name: Release workflow validation
        run: python3 scripts/verify-release-workflow.py
      - name: Release workflow self-test
        run: python3 scripts/verify-release-workflow.py --self-test
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: apps/license-server/go.mod
          cache-dependency-path: apps/license-server/go.sum
      - name: Go fmt
        run: test -z "$(gofmt -l apps/license-server)" || { gofmt -l apps/license-server; exit 1; }
      - name: Go vet
        run: go -C apps/license-server vet ./...
      - name: Go test (short)
        run: go -C apps/license-server test -short ./...
      # The commit-msg hook enforces the subject format locally, but
      # core.hooksPath is set by setup-dev.ps1 and is not versioned, so a fresh
      # clone that skips setup has no subject gate at all -- the hook's own header
      # says so and names four commits on this range whose entire message is a
      # pasted `git status --porcelain` block. Those four are the reason the hook
      # exists, and this finds exactly them, which is independent evidence the
      # matcher is right rather than merely permissive.
      #
      # The rule is EXTRACTED from .githooks/commit-msg at run time (type list,
      # regex, and the Merge/Revert/fixup/squash/amend exemptions), so the two
      # cannot drift into disagreeing about what is legal.
      #
      # Commits older than the hook's own introduction are skipped, derived from
      # `git log --diff-filter=A -- .githooks/commit-msg` rather than a hardcoded
      # sha: a rule cannot be enforced before it existed, and the count of skipped
      # commits is printed so the grandfathering is visible rather than silent.
      # Requires full history -- actions/checkout defaults to fetch-depth 1, which
      # would make the range empty and the step pass on nothing.
      # Gate: scripts/gates.json -> "commit-subjects".
      - name: Conventional-commit subjects
        run: |
          python3 scripts/verify-commit-subjects.py --self-test
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            python3 scripts/verify-commit-subjects.py \
              --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            echo "not a pull_request event; nothing to compare a base against"
          fi
      # The last hook step with no CI backstop, and the one with the worst history:
      # AGENTS.md records that 14 broken i18n keys shipped while this reported clean.
      # Until now it ran ONLY in the opt-in pre-commit hook -- not in check.sh, not in
      # check:all, not in CI -- so a clone that skips setup-dev.ps1 could reference a
      # key present in neither locale and nothing anywhere would notice.
      #
      # --scan-dirs is load-bearing, not stylistic. The tool defaults to `features`
      # alone; the six directories the hook names add 108 more files (228 -> 336, 47%
      # more coverage). A CI step that omitted the flag would print "0 missing key(s)"
      # while a third of the surface went unexamined -- green from a smaller input,
      # which is the failure this repo keeps rediscovering.
      # Gate: scripts/gates.json -> "bundle-parity".
      - name: i18n bundle parity
        run: |
          python3 scripts/verify-bundle-parity.py \
            --include-getstring --include-nav-keys --include-key-fields \
            --include-dynamic-literals --include-id-maps --check-domain-pairs \
            --scan-dirs features,components,frontend,contexts,hooks,platform
      # These two lived in ci.yml, which 23c96330 retired to .bak, and neither was
      # ever restored -- so for two releases the ONLY guard was the opt-in
      # pre-commit hook. core.hooksPath is set by scripts/setup-dev.ps1 and is not
      # versioned, meaning a fresh clone that skips setup could commit a
      # hand-edited 20260813_init.pg.sql (a GENERATED file, never hand-edited) and
      # merge it clean. AGENTS.md documented that hole in three places; nothing
      # closed it. Both checks are pure text comparison -- no Docker, no psycopg,
      # no sqlite handle -- and together cost ~1.1s, so there was never a build-cost
      # reason to leave them out.
      # Gate: scripts/gates.json -> "pg-schema-drift", "migration-column-types".
      - name: PG schema drift
        run: python3 scripts/generate-pg-migration.py --check
      - name: Migration column types
        run: python3 scripts/verify-migration-column-types.py
      # These ten ran ONLY in scripts/check.sh, which is opt-in and slow enough that most
      # commits never invoke it, or in .githooks/pre-commit, which needs core.hooksPath set
      # by setup-dev.ps1 and is not versioned -- so on a fresh clone that skips setup, or a
      # contributor who simply never ran check.sh, none of this was enforced anywhere.
      # Measured cost of all ten together: ~33s on a warm Linux runner, six of them under a
      # second. Against a job that already runs gofmt, go vet and go test, that is noise.
      #
      # The reason to promote them rather than leave them local is the same one that put the
      # PG drift check here (R36-12): a gate nobody runs is indistinguishable from no gate,
      # and the record in gates.json claimed these were "required" while nothing outside one
      # developer's machine could tell whether they still passed.
      - name: UI typecheck gate self-test
        run: bash scripts/test-typecheck-gate.sh
      - name: EOL guard self-test
        run: bash scripts/test-eol-guard.sh
      - name: Test shadow copies
        run: python3 scripts/verify-test-shadow-copies.py
      - name: IPC command parity
        run: python3 scripts/verify-ipc-parity.py
      - name: Topology template parity
        run: python3 scripts/verify-topology-parity.py
      - name: Feature registry
        run: python3 scripts/verify-feature-registry.py
      - name: Plugin guide parity
        run: python3 scripts/verify-plugin-guide-parity.py
      - name: No raw query params
        run: bash scripts/verify-no-raw-params.sh
      - name: Scoped command coverage
        run: bash scripts/verify-scoped-coverage.sh

  # ── 8. Release readiness ──────────────────────────────────────────────
  # R36-11's root cause was not only that release.yml was renamed to .bak with an
  # empty commit message -- it is that nothing else exercised the release
  # toolchain either, so the signing chain could have rotted silently alongside it
  # and nobody would find out until a customer's auto-update failed.
  #
  # This job runs the parts of the release path that are verifiable WITHOUT a
  # tag, a signing key, or a paid runner:
  #   * check-release-version.mjs --self-test  (tag/version/changelog gate)
  #   * check-updater-compat.mjs               (the important one)
  #
  # check-updater-compat builds a Rust harness pinned to the minisign-verify
  # version the real Tauri updater client uses, feeds generate-latest-json.mjs
  # output through it, and asserts a genuine `tauri signer` signature VERIFIES,
  # a tampered installer is REJECTED, and the pubkey committed in
  # tauri.conf.json parses. Verified locally: all four groups pass.
  #
  # What this does NOT prove: that a real tagged build produces installers. That
  # needs a Windows and a macOS runner and the UPDATER_PRIVATE_KEY secret, and it
  # cannot be exercised without pushing a tag. See the release.yml header.
  #
  # Path-gated on `release` because the harness needs a cold cargo build (~2min).
  # Gates: scripts/gates.json -> "release-readiness".
  release-readiness:
    name: Release Readiness
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.release == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: scripts/updater-compat-check
      - name: Release version gate self-test
        run: node scripts/check-release-version.mjs --self-test
      - name: Updater client compatibility check
        env:
          RUSTC_WRAPPER: ""
        run: node scripts/check-updater-compat.mjs

  # ── 9. Deploy: Northflank (push to main/release or manual dispatch) ──
  northflank-deploy:
    name: Deploy Backend (Northflank)
    runs-on: ubuntu-latest
    needs: [changes, website, cargo-check, cargo-nextest, ui-test, i18n, static-gates]
    # A skipped dependency skips this job. That is intended and is unreachable
    # in practice: `changes` forces every route to true for non-PR events, and
    # the only non-PR event that can reach here is workflow_dispatch.
    # static-gates was added and carries no `if:`, so it can never skip and
    # silently unblock a deploy. ci-docs-drift is deliberately NOT a dependency:
    # it is advisory, and gating a deploy on a known-red count would train people
    # to ignore the gate.
    #
    # Note the `github.event_name == 'push'` half of this condition is dead
    # code: this workflow triggers on pull_request and workflow_dispatch only,
    # so no push event ever runs it. Deploy therefore happens exclusively via
    # manual workflow_dispatch. Left in place because removing it would change
    # nothing observable and the clause is harmless, but it is misleading --
    # see the 0.0.36 backlog.
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/0.0.'))) || github.event_name == 'workflow_dispatch'
    env:
      NF_API: https://api.northflank.com/v1
      NF_PROJECT_ID: ${{ vars.NORTHFLANK_PROJECT_ID || 'oz-pos' }}
      NF_SERVICE_ID: ${{ vars.NORTHFLANK_SERVICE_ID || 'oz-pos-cloud' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check Northflank credentials
        id: check_creds
        env:
          NF_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
        run: |
          if [ -z "$NF_TOKEN" ]; then
            echo "::warning::NORTHFLANK_API_TOKEN is not set; skipping deploy step."
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Trigger Northflank build
        if: steps.check_creds.outputs.has_token == 'true'
        id: trigger
        env:
          NF_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
        run: |
          set -euo pipefail
          resp=$(curl -sS -w '\n%{http_code}' \
            -X POST "$NF_API/projects/$NF_PROJECT_ID/services/$NF_SERVICE_ID/build" \
            -H "Authorization: Bearer $NF_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"sha\":\"$GITHUB_SHA\"}")
          code=$(echo "$resp" | tail -1)
          body=$(echo "$resp" | sed '$d')
          echo "Trigger response (HTTP $code): $body"
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            if [ "$code" = "409" ]; then
              echo "Build already active (409) — checking in-flight build"
              list=$(curl -sS --fail \
                "$NF_API/projects/$NF_PROJECT_ID/services/$NF_SERVICE_ID/build" \
                -H "Authorization: Bearer $NF_TOKEN")
              build_id=$(echo "$list" | jq -r \
                --arg sha "$GITHUB_SHA" \
                '(.data.builds // .data.items // []) | map(select(.sha == $sha and .concluded == false)) | .[0].id // empty')
              if [ -n "$build_id" ]; then
                echo "Adopting in-flight build $build_id (sha $GITHUB_SHA)"
                echo "build_id=$build_id" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            echo "::error::Northflank rejected build trigger (HTTP $code)"
            exit 1
          fi
          build_id=$(echo "$body" | jq -r '.data.id // empty')
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"
      - name: Wait for build to conclude
        if: steps.check_creds.outputs.has_token == 'true' && steps.trigger.outputs.build_id != ''
        env:
          NF_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
          BUILD_ID: ${{ steps.trigger.outputs.build_id }}
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            resp=$(curl -sS -w '\n%{http_code}' \
              "$NF_API/projects/$NF_PROJECT_ID/services/$NF_SERVICE_ID/build/$BUILD_ID" \
              -H "Authorization: Bearer $NF_TOKEN" || true)
            code=$(echo "$resp" | tail -1)
            body=$(echo "$resp" | sed '$d')
            if [ "$code" = "200" ] && [ -n "$body" ]; then
              status=$(echo "$body" | jq -r '.data.status // empty')
              concluded=$(echo "$body" | jq -r '.data.concluded // false')
              echo "poll $i: status=$status concluded=$concluded"
              if [ "$concluded" = "true" ]; then
                if [ "$status" = "SUCCESS" ] || [ "$status" = "COMPLETED" ]; then
                  echo "Northflank build succeeded!"
                  exit 0
                else
                  echo "::error::Northflank build ended with status $status"
                  exit 1
                fi
              fi
            fi
            sleep 10
          done
          echo "::error::Timed out waiting for Northflank build"
          exit 1
