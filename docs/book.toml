# kasir.mu documentation portal — mdBook configuration.
#
# The portal aggregates hand-written guides (docs/), ADRs (docs/decisions/),
# rustdoc output (target/doc/) and TypeDoc output (ui/src). Generated content
# is copied into docs/src/ before building — see the plan at
# docs/plans/documentation-portal-plan.md for the full layout.
[book]
title = "kasir.mu Documentation"
authors = ["kasir.mu contributors"]
language = "en"

[build]
build-dir = "book"

[output.html]
additional-css = ["theme/custom.css"]
# site-url = "/"   # set only when deploying under a subpath (e.g. GitHub Pages)
