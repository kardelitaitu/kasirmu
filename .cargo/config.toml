# Compilation caching for OZ-POS local development.
#
# After installing sccache, run the one-time setup script:
#   powershell -File scripts/setup-cache.ps1   # Windows
#   bash scripts/setup-cache.sh                 # Linux / macOS

[build]
# sccache wraps rustc and caches compiled artifacts on disk.
# A cold `cargo check --workspace` drops from ~22s to ~0.6s on the
# second run (38x speedup on a 32-thread dev machine).
# CI also uses sccache via RUSTC_WRAPPER env var in .github/workflows/.
rustc-wrapper = "sccache"
#
# NOTE: [profile.dev] incremental = true keeps tight edit->check loops
# fast but makes dev-profile compiles non-cacheable for sccache. Clean
# rebuilds, release builds, and CI still cache. Prefix a command with
# CARGO_INCREMENTAL=0 when you want a fully cacheable baseline
# (e.g. CARGO_INCREMENTAL=0 cargo check --workspace).

# ------------------------------------------------------------------
# Fast linkers (local dev only)
# ------------------------------------------------------------------
# Windows MSVC (uses bundled rust-lld for fast, consistent linking)
[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"

# Linux (mold):
# [target.x86_64-unknown-linux-gnu]
# linker = "mold"

# macOS (lld):
# [target.x86_64-apple-darwin]
# linker = "ld64.lld"

# [target.aarch64-apple-darwin]
# linker = "ld64.lld"
