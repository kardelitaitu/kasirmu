# ── OZ-POS Full Stack — Docker Compose ───────────────────────────────
#
# Spins up the core OZ-POS backend in one command:
#   • pos-cloud-server — Rust headless sync & API binary
#   • license-server  — Go/PocketBase license activation server
#   • redis           — in-memory cache (product lookups, pub/sub)
#
# Quick start (SQLite — no external DB needed). Secrets are REQUIRED and
# Compose fails closed if they are absent (DOCKER-04):
#
#   export OZ_API_SECRET=$(openssl rand -hex 32)
#   export OZ_ADMIN_KEY=$(openssl rand -hex 32)
#   export OZ_LICENSE_PRIVATE_KEY="$(cat crates/oz-core/oz-license-private.pem)"
#   docker compose up -d
#   curl http://localhost:3099/api/v1/health
#   curl http://localhost:8080/api/v1/license/status
#
# With PostgreSQL (enterprise — add the pg override, PG_PASSWORD required):
#
#   export OZ_API_SECRET=$(openssl rand -hex 32)
#   export OZ_ADMIN_KEY=$(openssl rand -hex 32)
#   export OZ_LICENSE_PRIVATE_KEY="$(cat crates/oz-core/oz-license-private.pem)"
#   export PG_PASSWORD=$(openssl rand -hex 32)
#   docker compose -f docker-compose.yml -f docker-compose.pg.yml up -d
#
# Required env vars (Compose fails fast when absent):
#   OZ_API_SECRET          — JWT signing secret (generate: openssl rand -hex 32)
#   OZ_ADMIN_KEY           — admin key gating /api/v1/tokens + the plan
#                            endpoint (generate: openssl rand -hex 32)
#   OZ_LICENSE_PRIVATE_KEY — PEM-encoded license signing private key
#                            (from `scripts/generate-license-keys.ps1/.sh`)
#
# Environment overrides:
#   RUST_LOG             — log level (default: info)
#   PG_USER / PG_PASSWORD / PG_DATABASE — PostgreSQL credentials (docker-compose.pg.yml)
#   REDIS_URL            — Redis connection string (default: redis://redis:6379)

services:

  # ── Cloud Server ──────────────────────────────────────────────────
  pos-cloud-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "${OZ_API_PORT:-3099}:${OZ_API_PORT:-3099}"
    environment:
      # Runtime database — SQLite by default.
      OZ_DB_PATH: /data/oz-pos.db
      OZ_API_PORT: "${OZ_API_PORT:-3099}"
      RUST_LOG: "${RUST_LOG:-info}"

      # JWT signing secret — REQUIRED. Compose fails fast if unset so a
      # stack never starts with an empty/weak auth secret (DOCKER-04).
      OZ_API_SECRET: "${OZ_API_SECRET:?OZ_API_SECRET is required (generate: openssl rand -hex 32)}"

      # PostgreSQL connection string (set this to switch to PG backend via
      # docker-compose.pg.yml). Format: postgresql://user:pass@pos-cloud-db:5432/ozpos
      DATABASE_URL: "${DATABASE_URL:-}"

      # Redis cache connection (default: redis://redis:6379 within Docker
      # network). Override with REDIS_URL for external Redis instances.
      REDIS_URL: "${REDIS_URL:-redis://redis:6379}"
      REDIS_CACHE_TTL: "${REDIS_CACHE_TTL:-300}"

      # Admin key gating token minting + the plan admin endpoint (ADR
      # sync-auth-hardening P2 / sync-plan-gating). REQUIRED — compose fails
      # fast if unset so a stack never starts with the mint endpoint open
      # (DOCKER-04, matching OZ_API_SECRET above).
      OZ_ADMIN_KEY: "${OZ_ADMIN_KEY:?OZ_ADMIN_KEY is required (generate: openssl rand -hex 32)}"
      # Plan gating (ADR sync-plan-gating): "1"/"true"/"on" rejects sync
      # from free tenants with 403 plan_required. Unset = off (dev mode).
      OZ_ENFORCE_PLANS: "${OZ_ENFORCE_PLANS:-}"
    volumes:
      - oz_cloud_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider",
             "http://localhost:${OZ_API_PORT:-3099}/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      # Log rotation — bound the json-file driver so logs can never grow
      # unbounded and fill the host disk (max 10 MB per file, 5 files).
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      redis:
        condition: service_healthy

  # ── License Server (Go / PocketBase) ───────────────────────────────
  #
  # Handles license activation, renewal, and status queries. Uses
  # embedded SQLite (PocketBase) — no external database needed.
  #
  # Generate keys first:
  #   powershell -File scripts/generate-license-keys.ps1   # Windows
  #   bash scripts/generate-license-keys.sh                # Linux/macOS
  #
  # Then set OZ_LICENSE_PRIVATE_KEY to the contents of
  # crates/oz-core/oz-license-private.pem.
  license-server:
    build:
      context: ./apps/license-server
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      # REQUIRED — Compose fails fast if unset (DOCKER-04). Generate keys:
      # bash scripts/generate-license-keys.sh / .\scripts\generate-license-keys.ps1
      OZ_LICENSE_PRIVATE_KEY: "${OZ_LICENSE_PRIVATE_KEY:?OZ_LICENSE_PRIVATE_KEY is required (generate: bash scripts/generate-license-keys.sh)}"
    volumes:
      - pb_data:/pb/pb_data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/pb/healthcheck", "http://localhost:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      # Log rotation — bound the json-file driver (max 10 MB per file, 5 files).
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ── Redis Cache ────────────────────────────────────────────────────
  #
  # In-memory cache for product lookups, inventory pub/sub, and
  # rate-limiting token buckets. Always starts with the default profile.
  # DOCKER-02: pinned to an immutable digest (refreshed 2026-08-03).
  redis:
    image: public.ecr.aws/docker/library/redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    logging:
      # Log rotation — bound the json-file driver (max 10 MB per file, 5 files).
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped

  # ── PostgreSQL Database (optional — docker-compose.pg.yml) ────────
  #
  # The enterprise PostgreSQL backend now lives in `docker-compose.pg.yml`
  # and is merged explicitly (`-f docker-compose.yml -f docker-compose.pg.yml`).
  # This keeps required-secret validation scoped: PG_PASSWORD is only
  # required when the pg override is actually in use, while the SQLite
  # quickstart above still starts with just the two core secrets (DOCKER-04).

volumes:
  oz_cloud_data:
  pb_data:
  redis_data:
