[package]
name = "kasirmu-mobile"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "kasir.mu tablet-optimised shell (Tauri v2 mobile). Touch-optimised UI for Android/iOS."

[lib]
name = "kasirmu_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "kasirmu-mobile"
path = "src/main.rs"

# Inherits [workspace.lints] from the root Cargo.toml (missing_docs = warn).
[lints]
workspace = true

[build-dependencies]
tauri-build = { workspace = true }

[dev-dependencies]
tauri = { workspace = true, features = ["test"] }
tempfile = { workspace = true }

[dependencies]
foundation = { workspace = true }
kasirmu-core = { workspace = true }
# Phase 3.3 T1: tablet command bodies begin their move to the shared bridge.
# health.rs is the first repoint (ctx-free commands only); later slices build
# the tablet BridgeCtx seam and repoint the scoped bodies.
kasirmu-bridge = { workspace = true }
reqwest = { workspace = true }
rand = { workspace = true }
kasirmu-hal = { workspace = true }
kasirmu-logging = { workspace = true }
kasirmu-security = { workspace = true }
# ADR #49 Slice 0: `AppState::bridge_ctx` has to name `PluginManager` to own the
# `BridgeCtx::plugins` leg (its type is `&Mutex<Option<PluginManager>>`), so the
# tablet build needs the crate even though this shell never loads a plugin.
# Same dependency the desktop shell declares at apps/desktop-tauri/Cargo.toml:44.
kasirmu-plugin = { workspace = true }
modules-crm = { workspace = true }
modules-inventory = { workspace = true }
modules-settings = { workspace = true }
modules-tax = { workspace = true }
modules-sales = { workspace = true }
modules-staff = { workspace = true }
modules-reporting = { workspace = true }
kasirmu-reporting = { workspace = true }
modules-terminal = { workspace = true }
modules-currency = { workspace = true }
platform-core = { workspace = true }
platform-kernel = { workspace = true }
platform-startup = { workspace = true }
tauri = { workspace = true, features = ["protocol-asset"] }
tauri-plugin-clipboard-manager = { workspace = true }
tauri-plugin-opener = { workspace = true }
# Tablet file pickers (todo-tablet-dialog-content-uri.md Phase 1). The desktop
# shell has carried `tauri-plugin-dialog` since apps/desktop-tauri/Cargo.toml:63;
# the tablet registered no picker at all, which is why every image/backup/export
# affordance on this shell was dead (audit record §D3).
tauri-plugin-dialog = { workspace = true }
# Required by the content-URI bridge, not by any Rust call site: on Android the
# dialog plugin hands back a `content://` URI and every Rust consumer of a picked
# path calls `tokio::fs::read`. `@tauri-apps/plugin-fs` resolves the URI through
# the content resolver (FsPlugin.kt:62-68), so the bytes can be moved to a real
# cache path before they reach kasirmu-bridge.
tauri-plugin-fs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
rusqlite = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

[features]
custom-protocol = ["tauri/custom-protocol"]
