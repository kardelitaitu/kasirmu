# OZ-POS License Server — Local Development Docker Compose
#
# Usage:
#   1. Generate keys:  .\scripts\generate-license-keys.ps1  (PowerShell)
#   2. Start server:   docker compose -f apps/license-server/docker-compose.yml up -d
#   3. Create admin:   docker compose -f apps/license-server/docker-compose.yml exec license-server \
#                        /pb/pocketbase superuser upsert admin@ozpos.my.id password123
#   4. Open admin UI:  http://localhost:8080/_/
#   5. Test activate:  curl -X POST http://localhost:8080/api/v1/license/activate \
#                        -H "Content-Type: application/json" \
#                        -d '{"key": "OZ-PRO-TEST-ABCD-EFGH-IJKL", "tenant_id": "t1", "machine_id": "m1"}'
#
#   Stop:             docker compose -f apps/license-server/docker-compose.yml down
#   Clean:            docker compose -f apps/license-server/docker-compose.yml down -v
#
#   Google sign-in (ADR #54), locally:
#     Set OZ_GOOGLE_CLIENT_ID / OZ_GOOGLE_CLIENT_SECRET, and PIN the redirect — the server
#     otherwise derives https://<Host>/..., which a browser on http://localhost cannot use:
#       OZ_GOOGLE_REDIRECT_URI=http://localhost:8080/api/v1/web/oauth/google/callback
#     Register BOTH localhost callbacks on that Web-application client (http on localhost is
#     Google's documented exception to its https rule):
#       http://localhost:8080/api/v1/web/oauth/google/callback
#       http://localhost:8080/api/v1/desktop/link/google/callback
#     Point the RETURN host at your local site too — the default is the live kasir.mu, which
#     would try to spend a code your local server minted:
#       OZ_WEB_SITE_URL=http://localhost:4321
#     (the default CORS allowlist already admits that origin), and serve the website against
#     this API — `PUBLIC_LICENSE_API_URL=http://localhost:8080`, see website/README.md §local.
#
#     Then open http://localhost:8080/api/v1/web/oauth/google/start?next=/en/account

services:
  license-server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      # REQUIRED — Compose fails fast if unset (DOCKER-04). Generate keys:
      # bash scripts/generate-license-keys.sh / .\scripts\generate-license-keys.ps1
      OZ_LICENSE_PRIVATE_KEY: "${OZ_LICENSE_PRIVATE_KEY:?OZ_LICENSE_PRIVATE_KEY is required (generate: bash scripts/generate-license-keys.sh)}"

      # Google sign-in (ADR #54), for exercising the flow locally — see the header. Compose
      # passes ONLY what this list names, so a variable set on the host is dropped otherwise.
      OZ_GOOGLE_CLIENT_ID: "${OZ_GOOGLE_CLIENT_ID:-}"
      OZ_GOOGLE_CLIENT_SECRET: "${OZ_GOOGLE_CLIENT_SECRET:-}"
      OZ_GOOGLE_REDIRECT_URI: "${OZ_GOOGLE_REDIRECT_URI:-}"
      OZ_WEB_SITE_URL: "${OZ_WEB_SITE_URL:-}"
      OZ_SMTP_HOST: "${OZ_SMTP_HOST:-}"
    volumes:
      - pb_data:/pb/pb_data
    restart: unless-stopped
    healthcheck:
      # DOCKER-05: use the compiled Go healthcheck binary (the runtime image
      # does not install curl) — same endpoint contract as the root compose.
      test: ["CMD", "/pb/healthcheck", "http://localhost:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pb_data:
