[package]
name = "kasirmu-tablet"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "kasir.mu tablet-optimised shell (Tauri v2 mobile). Touch-optimised UI for Android/iOS."

[lib]
name = "kasirmu_tablet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "kasirmu-tablet"
path = "src/main.rs"

# Inherits [workspace.lints] from the root Cargo.toml (missing_docs = warn).
[lints]
workspace = true

[build-dependencies]
tauri-build = { workspace = true }

[dev-dependencies]
tauri = { workspace = true, features = ["test"] }
tempfile = { workspace = true }

[dependencies]
foundation = { workspace = true }
oz-core = { workspace = true }
# Phase 3.3 T1: tablet command bodies begin their move to the shared bridge.
# health.rs is the first repoint (ctx-free commands only); later slices build
# the tablet BridgeCtx seam and repoint the scoped bodies.
oz-bridge = { workspace = true }
reqwest = { workspace = true }
rand = { workspace = true }
oz-hal = { workspace = true }
oz-logging = { workspace = true }
oz-security = { workspace = true }
# ADR #49 Slice 0: `AppState::bridge_ctx` has to name `PluginManager` to own the
# `BridgeCtx::plugins` leg (its type is `&Mutex<Option<PluginManager>>`), so the
# tablet build needs the crate even though this shell never loads a plugin.
# Same dependency the desktop shell declares at apps/desktop-client/Cargo.toml:44.
oz-plugin = { workspace = true }
modules-crm = { workspace = true }
modules-inventory = { workspace = true }
modules-settings = { workspace = true }
modules-tax = { workspace = true }
modules-sales = { workspace = true }
modules-staff = { workspace = true }
modules-reporting = { workspace = true }
oz-reporting = { workspace = true }
modules-terminal = { workspace = true }
modules-currency = { workspace = true }
platform-core = { workspace = true }
platform-kernel = { workspace = true }
platform-startup = { workspace = true }
tauri = { workspace = true, features = ["protocol-asset"] }
# NOTE: tauri-plugin-window-state is KEPT — apps/tablet-client/capabilities/default.json
# references the `window-state:default` permission, which requires the plugin crate at
# build time even though no Rust code calls `.plugin(...)` (udeps cannot see capability refs).
tauri-plugin-clipboard-manager = { workspace = true }
tauri-plugin-window-state = { workspace = true }
tauri-plugin-opener = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
rusqlite = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

[features]
custom-protocol = ["tauri/custom-protocol"]
