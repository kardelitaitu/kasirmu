[package]
name = "kasirmu-cloud"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Headless kasir.mu cloud sync server — no Tauri, no WebView, no GUI."

[[bin]]
name = "kasirmu-cloud"
path = "src/main.rs"

# Inherits [workspace.lints] from the root Cargo.toml (missing_docs = warn).
[lints]
workspace = true

[dependencies]
oz-api = { workspace = true }
oz-core = { workspace = true }
oz-logging = { workspace = true }
# agents-1: the Midtrans QRIS driver behind /api/payment/midtrans/qris.
# First consumer of this crate in the workspace — the driver shipped tested
# but unwired (todo-payment-agents-1.md repair stamp, 09-13).
oz-payment = { workspace = true }
foundation = { workspace = true }
platform-sync = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
rusqlite = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tower-http = { workspace = true }
tower = { workspace = true }
thiserror = { workspace = true }
tokio-postgres = { workspace = true }
bytes = "1"
deadpool-postgres = { workspace = true }
tokio-postgres-rustls = { workspace = true }
rustls = { workspace = true }
rustls-native-certs = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
reqwest = { workspace = true }
lettre = { workspace = true }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
console-subscriber = { workspace = true, optional = true }

prometheus = { workspace = true }

[features]
default = []
console = ["dep:console-subscriber"]

[build-dependencies]
# Embeds the asInvoker application manifest into the Windows exe (see
# build.rs + app.manifest + app.rc). No-op on non-Windows targets.
embed-resource = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
http-body-util = { workspace = true }
serial_test = { workspace = true }
wiremock = { workspace = true }
