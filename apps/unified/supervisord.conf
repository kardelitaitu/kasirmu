; ── OZ-POS Unified Image — supervisor configuration ───────────────────
; Runs the single public entry point (caddy on :80) plus the two app
; functions (PocketBase :8080 auth, oz-cloud-server :3099 sync).
;
; supervisord itself runs as root so caddy can bind the privileged :80
; port; each app process drops to the non-root `ozpos` user (DOCKER-01).
; Environment variables (OZ_API_SECRET, OZ_LICENSE_PRIVATE_KEY, ...) are
; inherited from the container so no secrets are hard-coded here.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

; ── Reverse proxy / single public entry point ─────────────────────────
[program:caddy]
command=/usr/bin/caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
user=root
autorestart=true
startsecs=10
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ── Auth function (PocketBase / Go license server) ────────────────────
; DOCKER-11: `--dir=/data/pb_data` keeps PocketBase inside the single
; /data volume (same volume as the sync SQLite DB at /data/kasir.db) so
; one persistent volume covers both functions.
[program:license]
command=/app/pocketbase serve --http=0.0.0.0:8080 --dir=/data/pb_data
directory=/app
user=ozpos
autorestart=true
startsecs=5
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ── Sync function (Rust cloud server) ─────────────────────────────────
; SIGTERM triggers the cloud server's graceful shutdown + 30s drain.
[program:sync]
command=/app/oz-cloud-server
directory=/app
user=ozpos
autorestart=true
startsecs=5
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
