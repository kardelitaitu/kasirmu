[package]
name = "foundation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "kasir.mu foundation crate: Money, Currency, Sku, Cart, and shared contracts, errors, enums."

# Inherits [workspace.lints] from the root Cargo.toml (missing_docs = warn).
[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
regex = { workspace = true }
# 2026-09-28 (ADR-61 / C26): `ProductType::parse_stored_or_default` emits a documented
# `tracing::warn!` about unmapped `product_type` values. That parser is needed below
# `kasirmu-core` (its DB readers) AND inside `modules-inventory` (its repository) AND by
# `kasirmu-api` (its PG reader), so the only home that serves all three without duplicating
# the diagnostic is this tier. `tracing` is a facade with no cost unless a subscriber is
# installed, which is why it is acceptable here and a database driver would not be.
tracing = { workspace = true }
# 2026-09-28 (ADR-61 / C26): the moved sales types stamp their own timestamps — `Sale::from_cart_with_user`,
# `RefundLine::new` and `Refund::new` all call `chrono::Utc::now().to_rfc3339_opts(.., true)` exactly as
# they did in `modules-sales`, so the types cannot move without the crate. This is a time formatter, not a
# driver: foundation stays free of the database dependency the tier rule actually forbids (`rusqlite`).
chrono = { workspace = true }
serde = { workspace = true, features = ["derive"] }
uuid = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
serde_json = { workspace = true }
