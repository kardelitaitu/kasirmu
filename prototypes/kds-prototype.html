<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f0f14">
<link rel="manifest" href="manifest.json">
<title>KDS v2 — Kitchen Display Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Design-language typography: Inter across the whole UI — variable
     font (400–800 in one file), tall x-height keeps glyphs legible at
     14px and below, exactly the sizes a POS screen runs at. Loaded via
     Google Fonts with font-display: swap; the platform stack after it
     (-apple-system → SF Pro, Segoe UI on Windows, Roboto on Android)
     is the instant fallback if Inter is blocked. Weight ladder:
     700 headings · 600 subheadings · 500 emphasis · 400 body. */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* Touch-screen modern scrollbar: thin, transparent, no visible track */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: var(--r-xs); }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.25); }
  * { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.15) transparent; }
  /* Light theme: darker thumb so it stays visible on light backgrounds */
  .kds-screen.light ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); }
  .kds-screen.light ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.35); }
  .kds-screen.light * { scrollbar-color: rgba(0,0,0,0.2) transparent; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: #e6e6e6; /* dark default; light override via :has below */
    display: flex;    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 0;
    margin: 0;
    /* page zoom > 100% scales the screen beyond the viewport — without
       this, the body grows and spawns a page scrollbar. The screen
       itself already clips (overflow:hidden); the body must too. */
    overflow: hidden;
    /* text rendering: hint the engine to prefer legibility. -webkit-font-
       smoothing only applies on macOS; on Windows the key fix is not
       compositing cards (see .kds-card) so ClearType stays enabled. */
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }
  /* light theme: body text colour should match the screen's --text */
  body:has(.kds-screen.light) { color: #1a1a1a; }

  /* ── THEME (dark default, light override via .light class) ── */
  .kds-screen {
    /* Corner radius scale — one source of truth, +20% from the original
       4-based set: panels 20 · cards 14 · controls 10 · tiny chips 5 */
    --r-lg: 20px;
    --r-md: 14px;
    --r-sm: 10px;
    --r-xs: 5px;
    --bg: #0f0f14;
    --bg-top: #1a1a25;
    --bg-surface: #181825;
    --bg-tabs: rgba(255,255,255,0.06);
    --bg-tab-active: rgba(255,255,255,0.14);
    --bg-hover: rgba(255,255,255,0.08);
    --bg-active: rgba(255,255,255,0.09);
    --border: rgba(255,255,255,0.06);
    --border-strong: rgba(255,255,255,0.15);
    --text: #e6e6e6;
  }
  .kds-screen.light {
    --bg: #f2f2f5;
    --bg-top: #ffffff;
    --bg-surface: #ffffff;
    --bg-tabs: rgba(0,0,0,0.06);
    --bg-tab-active: rgba(0,0,0,0.12);
    --bg-hover: rgba(0,0,0,0.06);
    --bg-active: rgba(0,0,0,0.1);
    --border: rgba(0,0,0,0.08);
    --border-strong: rgba(0,0,0,0.18);
    --text: #1a1a1a;
  }

  /* ── Screen: 3-flex ─────────────────────────────── */
  .kds-screen {
    display: flex;
    flex-direction: column;
    height: 100vh;
    width: 100%;
    background: var(--bg);
    overflow: hidden;
    user-select: none;
  }

  /* ── TOPMENU ────────────────────────────────────── */
  .kds-topmenu {
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 10px 18px;
    background: var(--bg-top);
    border-bottom: 1px solid var(--border);
    gap: 12px;
  }
  .kds-topmenu-left { display: flex; align-items: center; gap: 10px; color: var(--text); justify-self: start; }
  .kds-filter { position: relative; display: flex; align-items: center; }
  .kds-filter-panel {
    position: absolute; top: calc(100% + 6px); left: 0; min-width: 220px;
    background: var(--bg-top); border: 1px solid var(--border-strong); border-radius: var(--r-md);
    padding: 10px; z-index: 100; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    animation: kds-drop-in 0.18s ease-out;
    transform-origin: top center;
  }
  @keyframes kds-drop-in {
    from { opacity: 0; transform: translateY(-6px) scaleY(0.95); }
    to { opacity: 1; transform: translateY(0) scaleY(1); }
  }
  /* Generic button hide/show — directional SOTA motion:
     show decelerates (fast start, soft settle — arrives),
     hide accelerates (slow start, fast finish — leaves).
     NO scale on these: they wrap text (the filter button), and scaling
     text re-rasterizes it in a new layer (font-type flash). */
  .kds-anim-showing { animation: kds-in 0.25s cubic-bezier(0.2, 0, 0, 1); }
  .kds-anim-hiding { animation: kds-out 0.18s cubic-bezier(0.4, 0, 1, 1) forwards; pointer-events: none; }
  @keyframes kds-in {
    from { opacity: 0; transform: translateY(-4px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes kds-out {
    from { opacity: 1; transform: translateY(0); }
    to   { opacity: 0; transform: translateY(4px); }
  }
  .kds-filter-option {
    display: flex; align-items: center; gap: 6px;
    padding: 7px 14px; border-radius: var(--r-sm); cursor: pointer; font-size: 13px;
    min-height: 34px;
    color: var(--text); opacity: 0.85; transition: all 0.1s;
    white-space: nowrap;
    /* no icon, no count — just the category name */
  }
  /* hover bg only on unselected options — an ACTIVE (blue) option keeps
     its colour; hover there is just the gentle pop on the label */
  .kds-filter-option:not(.checked):hover { background: rgba(255,255,255,0.07); }
  .kds-filter-option.checked { background: #147EFB; color: #fff; opacity: 1; }
  /* view-mode row (All / Prepared) above the category grid */
  .kds-filter-modes { display: flex; gap: 6px; margin-bottom: 8px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
  /* completed-tab modes: no grid below, so no divider */
  .kds-filter-modes.no-sep { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
  /* Up to 3 columns; each button is only as wide as its label (max-content) */
  .kds-filter-grid { display: grid; grid-template-columns: repeat(3, max-content); gap: 6px; justify-content: start; }
  .kds-tabs { position: relative; display: flex; gap: 4px; background: rgba(255,255,255,0.06); border-radius: var(--r-sm); padding: 3px; justify-self: center; }
  /* light theme: white track is invisible on the white topmenu → darken */
  .kds-screen.light .kds-tabs { background: rgba(0,0,0,0.1); }
  .kds-tab-indicator {
    position: absolute; top: 3px; left: 3px; bottom: 3px;
    background: #147EFB; border-radius: var(--r-sm);
    transition: left 0.28s cubic-bezier(0.33, 1, 0.68, 1), width 0.28s cubic-bezier(0.33, 1, 0.68, 1);
    pointer-events: none;
    transform-origin: center;
  }
  .kds-tab {
    position: relative; z-index: 1;
    padding: 5px 16px; border-radius: var(--r-sm); border: none;
    background: transparent; color: var(--text); opacity: 0.5; cursor: pointer; font-size: 13px;
    font-weight: 600; /* constant weight → no text reflow on active */
    /* 34px min-height (design-language Small) — same tier as the
       filter/shift buttons; the 18px line-height still pins the label
       and count badge on one baseline inside the taller box */
    min-height: 34px;
    line-height: 18px; /* fixed line-height — text (13px) and count (12px)
       share the same box height, so align-items: center aligns both
       perfectly; without this the default line-heights differ and the
       baselines drift */
    transition: opacity 0.15s;
    /* flex: children (label + count) become flex items, so the
       hover scale() animation actually applies (transforms don't
       work on plain inline spans) */
    display: inline-flex; align-items: center; gap: 5px;
    /* ⚠ REMEMBER: any button whose children you scale() on hover must
       be a flex/grid container (or children display:inline-block).
       See the .kds-btn helper header for the same rule. */
  }
  .kds-tab:hover { opacity: 0.8; }
  .kds-tab.active { opacity: 1; color: #fff; }
  .kds-tab.active .kds-tab-count { opacity: 0.8; }
  .kds-tab-count { opacity: 0.6; font-size: 13px; }
  .kds-tab.active .kds-tab-count { opacity: 0.8; }
  .kds-topmenu-right { display: flex; align-items: center; gap: 8px; position: relative; justify-self: end; }

  /* ── BUTTON HELPER (.kds-btn) ─────────────────────
     State model:
       default  → background: var(--btn-bg)
       :hover   → background: var(--btn-hover)
       :active  → background: var(--btn-active)  (pressed)
       .is-active (state class, not :active) → var(--btn-state)
     Variants set the tokens; the base class owns geometry + states only.
     ⚠ IMPORTANT: inline-flex is required — transforms (scale pop)
       do NOT work on plain inline children. The hover pop animation
       targets direct children (> *), which must be flex/grid items
       for the transform to render.
     Modifiers:
       --stack  → grid-stacked labels (width = widest label)
       --icon   → square icon button (back, hamburger)
       --filter → caret + 'all' blue state (category dropdown trigger)
       --muted  → translucent (tabs, idle controls) */
  .kds-btn {
    --btn-bg: #147EFB;        /* default colour */
    --btn-fg: #fff;
    --btn-hover: #1168D4;     /* normal hover (darker blue) */
    --btn-active: #0D52AD;    /* pressed */
    --btn-state: #147EFB;     /* persistent .is-active state */
    --btn-state-hover: #ef4444; /* hover while in state */
    padding: 3px 16px; border-radius: var(--r-sm); border: none;
    background: var(--btn-bg); color: var(--btn-fg); opacity: 1;
    cursor: pointer; font-size: 13px; font-weight: 600;
    transition: background 0.15s, color 0.15s, transform 0.06s;
    white-space: nowrap;
    display: inline-flex; align-items: center; justify-content: center;
    gap: 6px;
    -webkit-tap-highlight-color: transparent;
    /* Heights are border-box (see * rule): min-height 22px → 22px total.
       Text buttons sit at 22px; icon buttons are 40×40 (design-language
       icon-only rule); the shift/filter variants override min-height to
       34px to match the tab slider track. */
    min-height: 22px;
  }
  .kds-btn:hover { background: var(--btn-hover); }
  .kds-btn:active { background: var(--btn-active); transform: translateY(1px); }
  .kds-btn.is-active { background: var(--btn-state); }
  .kds-btn.is-active:hover { background: var(--btn-state-hover); }
  /* Hover feedback: scale the WHOLE button layer, pre-promoted with
     will-change. The layer is created BEFORE the interaction, so the
     text texture is rasterized once with the correct font; the hover
     pop then GPU-transforms that texture — no one-frame font flash.
     This is the production text-animation strategy (vs the old
     transform-on-text, which re-rasterized glyphs mid-flight and
     flashed the fallback font). */
  .kds-btn { will-change: transform; }
  .kds-btn:hover { transform: scale(1.04); }
  .kds-btn:active { background: var(--btn-active); transform: translateY(1px); }

  /* --stack: labels share one grid cell → width = widest label */
  .kds-btn--stack { display: inline-grid; grid-template-areas: 'l'; align-items: center; justify-items: center; }
  .kds-btn--stack > span { grid-area: l; opacity: 0; pointer-events: none; transition: opacity 0.1s; }
  .kds-btn--stack > span.visible { opacity: 1; }

  /* --icon: square transparent icon button (back, hamburger, any SVG).
     Stays 40×40 — design-language icon-only rule: hit area stays 40px
     (large enough for a fingertip). */
  .kds-btn--icon {
    width: 40px; height: 40px; padding: 0;
    background: transparent; color: var(--text); opacity: 0.7;
  }
  .kds-btn--icon:hover { background: rgba(255,255,255,0.08); opacity: 1; }
  .kds-btn--icon:active { background: rgba(255,255,255,0.12); transform: translateY(1px); }
  .kds-btn--icon svg { width: 18px; height: 18px; transform-box: fill-box; }

  /* --filter: caret rotation + blue 'all' state — height matches the
     34px shift button and tab slider track */
  .kds-btn--filter { min-height: 34px; --btn-bg: rgba(255,255,255,0.06); --btn-fg: var(--text); --btn-hover: rgba(255,255,255,0.08); --btn-active: rgba(255,255,255,0.12); }
  .kds-btn--filter.all { background: #147EFB; color: #fff; opacity: 1; }
  .kds-btn--filter.all .caret { opacity: 0.7; }
  .kds-btn--filter .caret { opacity: 0.5; display: inline-flex; align-items: center; transition: transform 0.2s; }
  .kds-btn--filter .caret svg { width: 18px; height: 18px; }
  .kds-btn--filter.open .caret { transform: rotate(180deg); }

  /* Variant: start/end shift — blue rest; GREEN hover when starting
     (not in shift), RED hover when stopping (in shift, destructive).
     The .is-active state decides which hover colour applies.
     min-height: 34px — the blue backdrop matches the Open/Completed
     tab slider track (34px). Everything is border-box, so this IS the
     final height (22px base + this override). */
  .kds-btn--shift {
    min-height: 34px;
    --btn-hover: #22c55e;      /* starting → green */
    --btn-active: #16a34a;
    --btn-state: #147EFB;
    --btn-state-hover: #ef4444; /* stopping → red */
  }
  /* Variant: plain/muted (tabs, filter when not active) */
  .kds-btn--muted {
    --btn-bg: rgba(255,255,255,0.06);
    --btn-fg: var(--text);
    --btn-hover: rgba(255,255,255,0.08);
    --btn-active: rgba(255,255,255,0.12);
    --btn-state: rgba(255,255,255,0.14);
    --btn-state-hover: rgba(255,255,255,0.18);
  }

/* Hamburger panel — same drop-in animation as the filter dropdown.
   Radius scale (4-based): panel 16 · cards 12 · controls 8 — one
   consistent rhythm across the whole panel. */
  .kds-hamburger-panel {
    position: absolute; top: calc(100% + 6px); right: 0; width: 375px;
    overflow: hidden;
    /* iOS grouped-settings layering: the panel IS the page — near-black
       in dark (groups float lighter above it), gray F2F2F7 in light
       (groups are white cards). The card colour is scoped here so order
       cards elsewhere keep their own --bg-surface. */
    background: var(--bg);
    --bg-surface: #1c1c1e;
    border: 1px solid var(--border-strong); border-radius: var(--r-lg);
    padding: 0; z-index: 100; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    animation: kds-drop-in 0.18s ease-out;
    transform-origin: top right;
  }
  .kds-screen.light .kds-hamburger-panel { --bg-surface: #ffffff; }
  /* scrollable body — no header, the panel starts with its sections.
     overflow-y: overlay floats the scrollbar OVER the content instead
     of reserving layout width, so the rows never shift when the panel
     grows tall enough to scroll (Chromium-only; acceptable for the KDS
     tablet target — same justification as the page-zoom note). Firefox
     falls back to auto + scrollbar-width: thin. */
  .kds-panel-body {
    max-height: calc(100vh - 80px);
    overflow-y: overlay; overflow-x: hidden;
    padding: 14px;
    scrollbar-width: thin;
  }
  .kds-panel-section { margin-bottom: 14px; }
  .kds-panel-section:last-child { margin-bottom: 0; }
  .kds-panel-section h3 { font-size: 12px; font-weight: 600; color: var(--text); opacity: 0.5; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.08em; }
  /* section head row: eyebrow + theme tag (which config is being edited) */
  .kds-section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .kds-section-head h3 { margin-bottom: 0; }
  .kds-theme-tag {
    font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--text); opacity: 0.45;
    padding: 2px 8px; border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--bg-surface);
  }
  /* setting card: one boxed group; rows inside are separated by hairline
     dividers. ONE architecture for every group — Display, Behaviour,
     Card Colours all use it. */
  .kds-setting-card {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    overflow: hidden;
  }
  .kds-setting-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 12px 14px; min-height: 44px; position: relative;
  }
  /* iOS inset separator: hairline starts at the label text (14px inset
     from the group edge), and the last row has no separator (the + rule
     naturally skips it). */
  .kds-setting-row + .kds-setting-row::before {
    content: ''; position: absolute; top: 0; left: 14px; right: 0;
    border-top: 1px solid var(--border);
  }
  .kds-setting-label { font-size: 15px; font-weight: 500; color: var(--text); opacity: 0.85; }
  .kds-setting-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .kds-setting-caption { font-size: 13px; color: var(--text); opacity: 0.45; }  /* visible keyboard focus anywhere inside the panel — buttons only,
     the hex/native inputs have their own focus treatment */
  .kds-panel-body button:focus-visible {
    outline: 2px solid #147EFB; outline-offset: 1px;
  }
  /* P4: visible keyboard focus across the whole screen (tabs, item
     rows, category headers, status buttons, filter options, inputs) */
  .kds-screen button:focus-visible,
  .kds-screen [role="option"]:focus-visible,
  .kds-screen input:focus-visible {
    outline: 2px solid #147EFB; outline-offset: 1px;
  }

  /* Card-colour accordion (in the hamburger panel) —
     head toggles, body collapses. One open at a time. */
  .kds-acc-head {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; padding: 12px 14px; min-height: 44px;
    background: transparent; border: none; cursor: pointer;
    font-size: 15px; font-weight: 500; color: var(--text); opacity: 0.85;
    font-family: inherit;
    position: relative;
    transition: background 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .kds-acc-head:hover { background: var(--border); }
  .kds-acc-head:active { background: var(--bg-hover); }
  .kds-acc-head:not(:first-child)::before {
    content: ''; position: absolute; top: 0; left: 14px; right: 0;
    border-top: 1px solid var(--border);
  }
  .kds-acc-head svg { width: 14px; height: 14px; opacity: 0.35; transition: transform 0.2s; }
  .kds-acc-head[aria-expanded="true"] svg { transform: rotate(180deg); }
  .kds-acc-body { padding: 6px 12px 12px; }
  .kds-color-group { margin-bottom: 12px; }
  .kds-color-group:last-child { margin-bottom: 0; }
  .kds-color-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .kds-color-head label { font-size: 15px; color: var(--text); opacity: 0.85; flex: 1; min-width: 0; }
  /* native colour picker chip: shows the current colour, click → OS picker.
     36px — the design-language Forms text-input height (2.25rem) */
  .kds-native {
    width: 36px; height: 36px; padding: 0; border: 1px solid var(--border-strong);
    border-radius: var(--r-sm); background: transparent; cursor: pointer; flex-shrink: 0;
  }
  .kds-native::-webkit-color-swatch-wrapper { padding: 3px; }
  .kds-native::-webkit-color-swatch { border-radius: 6px; border: none; }
  .kds-hex-input {
    width: 64px; height: 36px; padding: 0 8px; border-radius: var(--r-sm); font-size: 13px;
    border: 1px solid var(--border-strong); background: var(--bg-surface);
    color: var(--text); opacity: 0.8; text-align: center; font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', 'Fira Code', ui-monospace, monospace;
    transition: all 0.15s; flex-shrink: 0;
  }
  .kds-hex-input:focus {
    outline: 2px solid #147EFB; outline-offset: -2px;
    border-color: #147EFB; opacity: 1;
  }
  /* Destructive reset row (iOS red-centred) — lives in its own card,
     spaced from the colour editor above like a separate group */
  .kds-reset-card { margin-top: 14px; }
  .kds-reset-btn {
    width: 100%; padding: 12px 14px; min-height: 44px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    background: transparent; border: none;
    color: #ef4444; font-size: 15px; font-weight: 500;
    font-family: inherit;
    cursor: pointer; transition: background 0.15s;
  }
  .kds-reset-btn:hover { background: var(--bg-hover); }
  .kds-reset-btn:active { background: var(--bg-active); }
  .kds-reset-btn svg { width: 14px; height: 14px; opacity: 0.8; }

  /* Theme toggle — same slider pattern as the Open/Completed tabs:
   a blue pill indicator slides between Dark/Light with a
   squash-and-stretch (scale) animation. Options are sun/moon glyphs. */
  .kds-theme-toggle {
    position: relative; display: flex; gap: 4px;
    background: rgba(255,255,255,0.06); border-radius: var(--r-sm); padding: 3px;
    border: none; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  /* light theme: darken the track so the slider is visible */
  .kds-screen.light .kds-theme-toggle { background: rgba(0,0,0,0.08); }
  .kds-theme-indicator {
    position: absolute; top: 3px; left: 3px; bottom: 3px;
    background: #147EFB; border-radius: 7px;
    transition: left 0.28s cubic-bezier(0.33, 1, 0.68, 1), width 0.28s cubic-bezier(0.33, 1, 0.68, 1);
    pointer-events: none;
    transform-origin: center;
  }
  .kds-theme-option {
    position: relative; z-index: 1;
    display: inline-flex; align-items: center; justify-content: center;
    padding: 8px 9px; border-radius: 7px; border: none;
    background: transparent; color: var(--text); opacity: 0.5;
    transition: opacity 0.15s;
  }
  .kds-theme-option svg { width: 14px; height: 14px; }
  .kds-theme-option:hover { opacity: 0.8; }
  .kds-theme-option.on { opacity: 1; color: #fff; }

  /* Display scale (global page) + Card size — each a row inside the
     Display card: label left, − / value / + stepper right. */
  .kds-zoom-row { display: flex; align-items: center; gap: 4px; }
  .kds-zoom-btn { width: 36px; height: 36px; padding: 0; font-size: 14px; font-weight: 600; border-radius: var(--r-sm); }
  /* the value is a clickable reset-to-100% button — underline on hover
     makes the reset affordance discoverable without a tooltip */
  .kds-zoom-value {
    width: 80px; height: 36px; padding: 0 14px; text-align: center;
    flex-shrink: 0;
    font-size: 15px; font-weight: 500; color: var(--text); opacity: 0.85;
    cursor: pointer; border-radius: var(--r-sm);
  }
  .kds-zoom-value:hover { opacity: 1; background: var(--border); text-decoration: underline; text-underline-offset: 3px; }

  /* ── MAIN ───────────────────────────────────────── */
  .kds-main {
    flex: 1 1 auto; overflow-y: auto; overflow-x: auto; min-height: 0; padding: 14px;
    /* JS masonry: .kds-col columns grow in height, so vertical scroll
       works (CSS columns can't scroll inside a fixed-height box). */
    display: flex; flex-direction: row; align-items: flex-start;
    gap: 12px;
  }
  .kds-main > .kds-col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
  .kds-main > .kds-col > .kds-card { width: 100%; max-width: 100%; }
  .kds-main.empty { align-items: center; justify-content: center; }
  .kds-main.empty > .kds-empty { flex: initial; align-self: auto; }

  /* Tab slide transition */
  @keyframes kds-slide-in-right { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes kds-slide-in-left { from { opacity: 0; transform: translateX(-40px); } to { opacity: 1; transform: translateX(0); } }
  .kds-main.slide-right { animation: kds-slide-in-right 0.25s ease-out; }
  .kds-main.slide-left { animation: kds-slide-in-left 0.25s ease-out; }
  .kds-empty {
    /* centered in the middle of the main area (both axes): flex:1 grows
       on the main axis, align-self:stretch fills the cross axis in row
       AND column layouts */
    display: flex; align-items: center; justify-content: center;
    flex: 1; align-self: stretch;
    color: var(--text); opacity: 0.35; font-size: 14px;
  }

  /* ── ORDER CARD: 3-flex ─────────────────────────── */
  .kds-card {
    display: flex; flex-direction: column;
    background: var(--bg-surface); border-radius: var(--r-sm); overflow: hidden;
    border: 1px solid var(--border); min-height: 0; height: fit-content;
    width: 100%; max-width: 100%;
    transition: border-color 0.2s, filter 0.18s ease; color: var(--text);
    /* NOTE: no will-change:transform here — promoting every card to its
       own compositor layer permanently disables subpixel (ClearType)
       antialiasing on Windows, making text look thin/blurry. It is only
       applied during FLIP moves (.kds-moving) when actually animating. */
  }
  .kds-card:hover { border-color: var(--border-strong); }

  /* Card lifecycle animations (spawn / gone / move) via FLIP.
     SOTA motion language (Material):
       Enter  → decelerate  cubic-bezier(0.2, 0, 0, 1)  fast start, slow settle
       Exit   → accelerate  cubic-bezier(0.4, 0, 1, 1)  slow start, fast leave
       Move   → standard    cubic-bezier(0.4, 0, 0.2, 1) smooth glide
     Rhythm: 300ms spawn / 250ms leave / 350ms move.
     Directionality: spawn ARRIVES (rises in from below, expands),
     leave DEPARTS (drops away, compresses) — distinct personalities. */
  @keyframes kds-card-in {
    from { opacity: 0; transform: scale(0.9) translateY(14px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .kds-card-spawn { animation: kds-card-in 0.3s cubic-bezier(0.2, 0, 0, 1); }
  .kds-card.leaving {
    pointer-events: none;
    animation: kds-card-out 0.25s cubic-bezier(0.4, 0, 1, 1) forwards;
  }
  @keyframes kds-card-out {
    from { opacity: 1; transform: scale(1) translateY(0); }
    to { opacity: 0; transform: scale(0.85) translateY(10px); }
  }
  .kds-moving { will-change: transform; transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1) !important; }
  /* reduced motion: the in-app toggle (body.no-anim) is the single
     control. NO prefers-reduced-motion media query here — an OS-level
     setting was silently killing the animations even when the user
     explicitly turned them on in the hamburger. */
  body.no-anim .kds-card-spawn, body.no-anim .kds-card.leaving { animation: none; }
  body.no-anim .kds-moving { transition: none; }
  /* P1: tab slide animation also gated by the in-app toggle */
  body.no-anim .kds-main.slide-right, body.no-anim .kds-main.slide-left { animation: none; }

  .kds-card-header {
    flex: 0 0 auto; display: flex; align-items: center; gap: 9px;
    padding: 9px 13px; font-size: 12px; font-weight: 500; /* SF Medium — emphasis */
    transition: background 0.2s;
    /* the whole header is a toggle button (minimize/restore the card) */
    width: 100%; border: none; text-align: left; cursor: pointer;
    font-family: inherit; font-weight: inherit; -webkit-tap-highlight-color: transparent;
    /* color set inline via contrastText(bg); children only vary opacity
       Layout: 3 flex children — icon | left column | right column.
       Left column stacks (order-no, order-id); right column stacks
       (customer, status) so the visual rows match the old design:
       row1: #12 ... customer, row2: id ... status */
  }
  .kds-card-header:hover { filter: brightness(1.06); }
  .kds-card.collapsed .kds-card-header { border-radius: var(--r-sm); } /* rounded bottom when minimized */
  .kds-card-header-icon { display: flex; align-items: center; flex-shrink: 0; padding-right: 2px; }
  .kds-card-header-row { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .kds-card-header-left { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .kds-card-header-right { flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
  .kds-card-header .order-no { font-weight: 700; } /* SF Bold — heading */
  .kds-card-header .customer { font-weight: 500; } /* SF Medium — emphasis */
  .kds-card-header .time { opacity: 0.6; font-size: 11px; font-weight: 400; white-space: nowrap; }
  /* meta row: received HH:MM · live elapsed, then the fixed-height status
     slot — both vertically centered on one line (P2: spec HH:MM restored) */
  .kds-card-header-meta { display: flex; align-items: center; gap: 8px; min-height: 22px; }
  .kds-card-header .status {
    opacity: 0.55; font-size: 12px; font-weight: 400; font-style: italic;
    /* fixed height for ALL states: the blank placeholder, the text-only
       paused, and the pill variants (processing/prepared, which add
       padding) must occupy the same box so the header never changes
       height when the status appears/disappears. border-box makes the
       pill padding fit inside the fixed height. */
    box-sizing: border-box;
    height: 22px; line-height: 18px;
    display: inline-flex; align-items: center;
  }
  .kds-card-header .status.paused { opacity: 0.9; font-style: normal; display: inline-flex; align-items: center; gap: 3px; }
  .kds-card-header .status.processing {
    opacity: 1; font-style: normal;
    animation: kds-blink 2.5s ease-in-out infinite;
    padding: 2px 8px; border-radius: 6px; font-weight: 600;
    display: inline-flex; align-items: center;
  }
  /* prepared: everything is done, awaiting Mark Finish — pill (bg inline) */
  .kds-card-header .status.prepared {
    background: #22c55e; color: #fff; opacity: 1; font-style: normal;
    padding: 2px 8px; border-radius: 6px; font-weight: 600;
    display: inline-flex; align-items: center; gap: 3px;
  }
  @keyframes kds-blink { 0%, 100% { opacity: 0.9; } 50% { opacity: 0.2; } }
  .kds-service-icon { width: 22px; height: 22px; flex-shrink: 0; }
  .kds-rush-badge {
    /* color set inline via contrastText(rush) */
    font-size: 12px; font-weight: 700; padding: 2px 6px;
    border-radius: var(--r-xs); letter-spacing: 0.5px;
  }

  .kds-card-main { flex: 1 1 auto; min-height: 0; padding: 0; position: relative; }

  /* Collapsible section: animates to any height via grid-template-rows.
     The grid MUST have exactly ONE child — with two children the second
     creates an implicit auto row that never collapses. So main + footer
     are wrapped in a single .kds-card-collapsible-inner.
     Directional curves are set inline by JS per toggle:
       expand  → decelerate (fast start, soft settle — unfolds)
       collapse → accelerate (slow start, fast finish — tucks away) */
  .kds-card-collapsible {
    flex: 1 1 auto; min-height: 0;
    display: grid; grid-template-rows: 1fr;
    /* fallback when JS hasn't set a directional curve */
    transition: grid-template-rows 0.3s cubic-bezier(0.2, 0, 0, 1), opacity 0.2s ease;
  }
  .kds-card-collapsible-inner {
    min-height: 0; overflow: hidden; display: flex; flex-direction: column;
    transform-origin: top center;
    transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .kds-card.collapsed .kds-card-collapsible { grid-template-rows: 0fr; opacity: 0; }
  /* fold: content compresses toward the top while the row collapses */
  .kds-card.collapsed .kds-card-collapsible-inner { transform: scaleY(0.85); }

  .kds-category { border-bottom: 1px solid var(--border); padding: 3px 0 2px 0; transition: background 0.15s; }
  /* last category keeps its divider — the footer separator is the
     category's own bottom border, so it stays present even when the
     order has no notes */
  .kds-category:last-child { padding-bottom: 2px; }
  /* Whole-section hover + press (station-level unit): when the header is
     hovered OR pressed, the ENTIRE category block lights up (header +
     its items). Items alone do NOT trigger it — they toggle individually. */
  .kds-category:has(.kds-category-header:hover) { background: rgba(255,255,255,0.06); }
  .kds-category:has(.kds-category-header:active) { background: rgba(255,255,255,0.09); }
  .kds-screen.light .kds-category:has(.kds-category-header:hover) { background: rgba(0,0,0,0.06); }
  .kds-screen.light .kds-category:has(.kds-category-header:active) { background: rgba(0,0,0,0.1); }
  .kds-category-header {
    display: flex; align-items: center; gap: 8px;
    width: 100%; padding: 6px 13px; border: none; background: transparent;
    color: var(--text); opacity: 0.85; cursor: pointer; font-size: 12px; font-weight: 400;
    transition: background 0.1s; text-align: left;
    /* fixed row height: identical whether checked or not */
    min-height: 30px; line-height: 1.2;
  }
  /* not bold until checked: the whole category flips to 600 when its
     checkmark appears (done state) */
  .kds-category-header:has(.kds-cat-check.done) { font-weight: 600; }
  .kds-category-header:hover { background: transparent; }
  /* non-interactive header (completed-card recall view) */
  .kds-category-header.static { cursor: default; }
  /* pressed state is the whole section (see :has rules above), not just
     the header — keep the header itself transparent so the section
     highlight reads as one unit */
  /* left area: the single "n/M CategoryName" label, pushed to the very right */
  .kds-cat-label {
    flex: 1; display: flex; justify-content: flex-end;
    opacity: 0.85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* right area: reserved check slot — always occupies width so the
     header never shifts when the check appears/disappears */
  .kds-cat-check {
    flex-shrink: 0; width: 16px; height: 16px;
    display: inline-flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity 0.15s;
  }
  .kds-cat-check.done { opacity: 1; color: #22c55e; }
  .kds-cat-check.done svg { stroke-width: 4; }

  .kds-item { padding: 0 6px; }
  .kds-item-row {
    display: flex; flex-direction: column;  /* allows the note to live inside the button */
    width: 100%; padding: 4px 7px; border: none; background: transparent;
    color: var(--text); opacity: 0.85; cursor: pointer; font-size: 14px; border-radius: var(--r-sm);
    transition: background 0.1s; text-align: left;
    /* fixed row height: identical whether checked or not (the done-time
       text appears/disappears without changing the row size) */
    min-height: 28px; line-height: 1.3;
  }
  .kds-item-row-inner {
    display: flex; align-items: center; justify-content: space-between;
    min-height: 20px; gap: 6px;
  }
  .kds-item-row:hover { background: rgba(255,255,255,0.05); }
  .kds-item-row:active { background: rgba(255,255,255,0.09); }
  /* light theme: white hover is invisible on white cards → use dark */
  .kds-screen.light .kds-item-row:hover { background: rgba(0,0,0,0.06); }
  .kds-screen.light .kds-item-row:active { background: rgba(0,0,0,0.1); }
  .kds-item-row.done { opacity: 0.4; }
  .kds-item-left { display: flex; align-items: center; gap: 7px; min-width: 0; }
  /* fixed qty column: '2×' vs '4×' share a width so item names AND
     their notes line up in one column (the note indents to the name).
     20px fits the widest single-digit qty ('4×' = 17px glyphs) with
     ~3px slack — much tighter than a wider fixed column. */
  .kds-item-qty { opacity: 0.6; font-size: 13px; flex-shrink: 0; width: 20px; font-weight: 600; }
  .kds-item-row.done .kds-item-qty { opacity: 0.6; font-weight: 400; }
  /* opposite of the category header: item names are bold (600) while
     NOT done — the cook's attention belongs on what's left — and drop
     to regular (500) once checked off (the dimmed done state already
     reads as finished) */
  .kds-item-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .kds-item-row.done .kds-item-name { font-weight: 500; }
  .kds-item-done-time { opacity: 0.45; font-size: 12px; flex-shrink: 0; }
  .kds-item-note {
    opacity: 0.5; font-style: italic; font-size: 12px;
    /* own line, indented to the item NAME column: 20px fixed qty
       column + 7px gap = 27px (the note already inherits the button's
       7px padding, so its own padding is qty + gap only). Vertical
       space is real (2px above, 3px below) so the note reads as a
       second line, not a caption glued to the qty. */
    padding: 2px 0 3px 27px; overflow: hidden; text-align: left;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .kds-order-notes {
    opacity: 0.55; font-style: italic; font-size: 12px;
    padding: 0 13px; /* no border-top — the divider lives on the last
       category, so a note-less order still gets the separation.
       Top AND bottom spacing come from .kds-card-footer (padding-top
       + gap), so the note-less and note-ful footers keep the same
       rhythm: 6px above content, 6px between rows. */
  }

  .kds-card-footer {
    flex: 0 0 auto; padding: 6px 10px 7px; display: flex; flex-direction: column; gap: 6px;
  }
  .kds-footer-actions { display: flex; gap: 6px; }
  .kds-footer-actions .kds-status-btn { flex: 1; }
  .kds-status-btn {
    width: 100%; min-height: 34px; padding: 7px 0; border-radius: var(--r-sm); border: none;
    font-size: 12px; font-weight: 600; line-height: 1; cursor: pointer; transition: all 0.15s;
    display: flex; align-items: center; justify-content: center; gap: 7px;
    /* background + color set inline via colors.* + contrastText; hover shifts opacity */
  }
  .kds-status-btn svg { display: block; }
  .kds-status-btn:hover { opacity: 0.85; }
  .kds-status-btn.finish {
    background: transparent; border: 1px solid var(--border-strong);
    color: var(--text); opacity: 0.55; font-size: 12px;
  }
  .kds-status-btn.finish:hover { opacity: 1; background: var(--border); }

  /* ── Completed tab — same card language as Open, in time-bucket
     columns (Kanban: Recent / 1h / 6h / 24h). Cards are minimized by
     default; expanding shows the full ticket. */
  .kds-main.completed-view { display: flex; flex-direction: row; flex-wrap: wrap; align-items: flex-start; gap: 12px; }
  /* Completed buckets flow responsively: 4-up on kitchen displays
     (each ~310px), wrapping to 2×2 on tablets and a single column on
     narrow phones — same philosophy as the open grid */
  .kds-main.completed-view > .kds-col { flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
  .kds-main.completed-view > .kds-col > .kds-card { width: 100%; max-width: 100%; }
  /* Old-hardware perf: skip layout/paint of completed cards below the
     fold — the browser renders only what's near the viewport. The
     intrinsic size keeps the scrollbar stable while they're skipped.
     Individual/column toggles still work: off-screen cards simply
     appear at their new state when scrolled into view. */
  .kds-main.completed-view .kds-card { content-visibility: auto; contain-intrinsic-size: 60px; }
  /* Completed buckets flow responsively: 4-up on kitchen displays
     (each ~310px), wrapping to 2×2 on tablets and a single column on
     narrow phones — same philosophy as the open grid */
  .kds-main.completed-view > .kds-col { flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
  /* Completed tab = recall surface: every item is done, so the 'done'
     dimming would grey out the whole menu. Full-opacity menu text. */
  .kds-main.completed-view .kds-category-header,
  .kds-main.completed-view .kds-item-row,
  .kds-main.completed-view .kds-item-row.done { opacity: 1; }
  /* Prepared (waiter) filter on the open tab: only fully-done orders are
     shown, so the done-dimmed menu reads at full opacity too */
  .kds-main.prepared-filter .kds-category-header,
  .kds-main.prepared-filter .kds-item-row,
  .kds-main.prepared-filter .kds-item-row.done { opacity: 1; }
  .kds-completed-col-head {
    font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--text); opacity: 0.7; padding: 6px 10px;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    background: var(--bg-tabs); border: none; border-radius: var(--r-sm); cursor: pointer;
    font-family: inherit; width: 100%; text-align: left;
    transition: background 0.15s, opacity 0.15s;
  }
  .kds-completed-col-head:hover { background: var(--bg-hover); opacity: 0.8; }
  .kds-completed-col-count { opacity: 0.6; font-weight: 600; }
  .kds-completed-col-chev { opacity: 0.5; transition: transform 0.2s; flex-shrink: 0; }
  .kds-completed-col-head[aria-expanded="true"] .kds-completed-col-chev { transform: rotate(180deg); }
  /* reopen: full-width card footer button, muted (secondary action) */
  .kds-status-btn.reopen {
    background: transparent; border: 1px solid var(--border-strong);
    color: var(--text); opacity: 0.65; font-size: 12px;
  }
  .kds-status-btn.reopen:hover { opacity: 1; background: var(--border); }

  /* ── SCREEN FOOTER ──────────────────────────────── */
  .kds-screen-footer {
    flex: 0 0 auto; display: flex; align-items: center; justify-content: center;
    gap: 12px; padding: 3px 14px; color: var(--text); opacity: 0.4; font-size: 11px;
    border-top: 1px solid var(--border); pointer-events: none;
  }
  .kds-screen-footer .sep { opacity: 0.5; }

  /* Reusable switch (used for sound, auto-accept, animations) — the
     design-language settings-toggle-slider pattern, scaled for the
     KDS touchscreen: track 48×25, knob 20px, translate 23px on
     toggle, bounce ease cubic-bezier(0.34, 1.56, 0.64, 1). */
  .kds-switch {
    position: relative; width: 48px; height: 25px; border-radius: 12.5px; border: none;
    background: rgba(255,255,255,0.12); cursor: pointer; transition: background 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .kds-switch::after {
    content: ''; position: absolute; top: 2.5px; left: 2.5px;
    width: 20px; height: 20px; border-radius: 50%; background: #fff;
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .kds-switch.on { background: #147EFB; }
  .kds-switch.on::after { transform: translateX(23px); }
  /* light theme: darken the switch track so it is visible on white */
  .kds-screen.light .kds-switch { background: rgba(0,0,0,0.08); }
  .kds-screen.light .kds-switch.on { background: #147EFB; }
  /* light theme: muted helper buttons (zoom steppers, filter idle) need
     dark overlays — the dark-theme white tokens vanish on white cards */
  .kds-screen.light .kds-btn--muted {
    --btn-bg: rgba(0,0,0,0.05);
    --btn-hover: rgba(0,0,0,0.09);
    --btn-active: rgba(0,0,0,0.12);
    --btn-state: rgba(0,0,0,0.1);
    --btn-state-hover: rgba(0,0,0,0.14);
  }
  /* light theme: hover overlays that were dark-only white (P1) */
  .kds-screen.light .kds-btn--icon:hover { background: rgba(0,0,0,0.08); opacity: 1; }
  .kds-screen.light .kds-btn--icon:active { background: rgba(0,0,0,0.12); }
  .kds-screen.light .kds-filter-option:not(.checked):hover { background: rgba(0,0,0,0.07); }

  /* ── Confirm modal (P4: styled replacement for window.confirm) ── */
  .kds-modal-backdrop {
    position: fixed; inset: 0; z-index: 300;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.55);
    animation: kds-drop-in 0.18s ease-out;
  }
  .kds-modal-backdrop[hidden] { display: none; }
  /* anchored mode (force-finish): NO page-wide veil — the blurred card
     is the focus cue. The backdrop stays transparent but still catches
     outside-clicks to cancel. */
  .kds-modal-backdrop.anchored { background: transparent; }
  /* anchor wrapper: default transparent (flex centering passes through);
     anchored mode pins it at the order card's centre */
  .kds-modal-anchor { display: contents; }
  .kds-modal-anchor.anchored { display: block; position: fixed; z-index: 301; transform: translate(-50%, -50%); }
  .kds-modal {
    width: min(360px, calc(100vw - 48px));
    background: var(--bg-top); border: 1px solid var(--border-strong);
    border-radius: var(--r-lg); padding: 18px; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  /* CPU/GPU-efficient card blur for the anchored confirm: blurs ONE small
     card layer (single compositor pass, small radius) instead of a
     full-screen backdrop-filter, which re-samples the whole backing
     store every frame and is far more expensive. No will-change — the
     layer promotes only while the class is applied, so text stays
     ClearType-crisp when idle. */
  .kds-card.blurred { filter: blur(5px); pointer-events: none; }
  .kds-modal-title { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
  .kds-modal-msg { font-size: 12px; color: var(--text); opacity: 0.7; line-height: 1.5; margin-bottom: 16px; }
  .kds-modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
  .kds-modal-actions .kds-btn { min-height: 28px; }
  .kds-modal-actions .kds-btn.danger { --btn-bg: #ef4444; --btn-hover: #dc2626; --btn-active: #b91c1c; }

  /* Visually-hidden live region (P4: aria-live) */
  .kds-visually-hidden {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }
</style>
</head>
<body>
<div class="kds-screen light" id="screen">
  <!-- TOPMENU -->
  <div class="kds-topmenu">
    <div class="kds-topmenu-left">
      <button class="kds-btn kds-btn--icon" id="back-btn" title="Back" aria-label="Back" data-testid="kds-topbar-back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:18px;height:18px"><path d="M15 19l-7-7 7-7"/></svg>
      </button>
      <div class="kds-filter" id="filter-wrap">
        <button class="kds-btn kds-btn--filter all" id="filter-btn" aria-haspopup="listbox" aria-expanded="false" data-testid="kds-topbar-filter"><span>All Categories</span><span class="caret"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 9h12l-6 7z"/></svg></span></button>
        <div class="kds-filter-panel" id="filter-panel" role="listbox" aria-multiselectable="true" style="display:none"></div>
      </div>
    </div>
    <div class="kds-tabs" id="tabs">
      <span class="kds-tab-indicator" id="tab-indicator"></span>
      <button class="kds-tab active" data-tab="open" data-testid="kds-tab-open"><span>Open</span><span class="kds-tab-count" id="count-open">0</span></button>
      <button class="kds-tab" data-tab="completed" data-testid="kds-tab-completed"><span>Completed</span><span class="kds-tab-count" id="count-completed">0</span></button>
    </div>
    <div class="kds-topmenu-right">
      <button class="kds-btn kds-btn--shift kds-btn--stack" id="shift-btn" data-testid="kds-topbar-shift"><span class="visible">Start Shift</span><span>End Shift</span></button>
      <button class="kds-btn kds-btn--icon" id="hamburger-btn" title="Settings" aria-label="Settings" aria-haspopup="true" aria-expanded="false" data-testid="kds-topbar-settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="kds-hamburger-panel" id="hamburger-panel" role="dialog" aria-label="Settings" aria-hidden="true" style="display:none;">
        <div class="kds-panel-body">
          <!-- DISPLAY: theme + scale -->
          <div class="kds-panel-section">
            <h3>Display</h3>
            <div class="kds-setting-card">
              <div class="kds-setting-row">
                <span class="kds-setting-label">Theme</span>
                <button class="kds-theme-toggle" id="theme-toggle" title="Toggle light/dark" aria-label="Toggle light or dark theme" data-testid="kds-settings-theme-toggle">
                  <span class="kds-theme-indicator" id="theme-indicator"></span>
                  <span class="kds-theme-option" data-theme="dark" aria-label="Dark theme">
                    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.39 5.39 0 0 1-4.4 2.26 5.4 5.4 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
                  </span>
                  <span class="kds-theme-option on" data-theme="light" aria-label="Light theme">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
                  </span>
                </button>
              </div>
              <div class="kds-setting-row">
                <span class="kds-setting-label">Display scale</span>
                <div class="kds-zoom-row">
                  <button class="kds-btn kds-btn--muted kds-zoom-btn" id="pagezoom-out" aria-label="Zoom out" data-testid="kds-settings-zoom-out">−</button>
                  <button class="kds-btn kds-btn--muted kds-zoom-value" id="pagezoom-value" title="Reset to 100%" aria-label="Reset zoom to 100%" data-testid="kds-settings-zoom-value">100%</button>
                  <button class="kds-btn kds-btn--muted kds-zoom-btn" id="pagezoom-in" aria-label="Zoom in" data-testid="kds-settings-zoom-in">+</button>
                </div>
              </div>
              <div class="kds-setting-row">
                <span class="kds-setting-label">Columns</span>
                <div class="kds-zoom-row">
                  <button class="kds-btn kds-btn--muted kds-zoom-btn" id="cols-out" aria-label="Fewer columns" data-testid="kds-settings-cols-out">−</button>
                  <button class="kds-btn kds-btn--muted kds-zoom-value" id="cols-value" title="Reset to auto" aria-label="Reset columns to auto" data-testid="kds-settings-cols-value">Auto</button>
                  <button class="kds-btn kds-btn--muted kds-zoom-btn" id="cols-in" aria-label="More columns" data-testid="kds-settings-cols-in">+</button>
                </div>
              </div>
            </div>
          </div>
          <!-- BEHAVIOUR: kitchen toggles -->
          <div class="kds-panel-section">
            <h3>Behaviour</h3>
            <div class="kds-setting-card">
              <div class="kds-setting-row">
                <div class="kds-setting-text">
                  <span class="kds-setting-label">New order sound</span>
                  <span class="kds-setting-caption">Chime when an order arrives</span>
                </div>
                <button class="kds-switch on" id="toggle-sound" role="switch" aria-checked="true" aria-label="New order sound" data-testid="kds-settings-sound-toggle"></button>
              </div>
              <div class="kds-setting-row">
                <div class="kds-setting-text">
                  <span class="kds-setting-label">Auto-accept</span>
                  <span class="kds-setting-caption">New orders appear without tapping Accept</span>
                </div>
                <button class="kds-switch" id="toggle-ack" role="switch" aria-checked="false" aria-label="Auto-accept new orders" data-testid="kds-settings-autoaccept-toggle"></button>
              </div>
              <div class="kds-setting-row">
                <div class="kds-setting-text">
                  <span class="kds-setting-label">Card animations</span>
                  <span class="kds-setting-caption">Spawn and reorder effects</span>
                </div>
                <button class="kds-switch on" id="toggle-anim" role="switch" aria-checked="true" aria-label="Card spawn and move animations" data-testid="kds-settings-anim-toggle"></button>
              </div>
            </div>
          </div>
          <!-- CARD COLOURS: per-theme config, accordion groups + scoped reset -->
          <div class="kds-panel-section">
            <div class="kds-section-head">
              <h3>Card Colours</h3>
              <span class="kds-theme-tag" id="theme-tag">dark</span>
            </div>
            <div class="kds-setting-card">
              <div id="color-panel"></div>
            </div>
            <!-- Destructive reset row — its own group, centered red text,
                 spaced from the colour card above (see .kds-reset-card) -->
            <div class="kds-setting-card kds-reset-card">
              <button class="kds-reset-btn" id="reset-colors" data-testid="kds-settings-colors-reset">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
                Reset colours
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- MAIN -->
  <div class="kds-main" id="main"></div>

  <!-- SCREEN FOOTER -->
  <div class="kds-screen-footer">
    <span id="footer-user">kitchen-username</span><span class="sep">|</span>
    <span id="footer-workspace">kds-branch-2</span><span class="sep">|</span>
    <span id="footer-ip">192.168.1.42</span><span class="sep">|</span>
    <span id="clock">14 Aug 14:55</span><span class="sep">|</span>
    <span id="footer-sync">Last sync: 2s ago</span><span class="sep">|</span>
    <span id="footer-status">Connected</span>
  </div>

  <!-- Confirm modal — styled replacement for window.confirm (P4).
       The anchor wrapper lets it sit centered on a specific order card
       (force-finish) instead of the screen middle; default display:
       contents keeps the old flex-centered behaviour. -->
  <div class="kds-modal-backdrop" id="confirm-backdrop" hidden>
    <div class="kds-modal-anchor" id="confirm-anchor">
      <div class="kds-modal" id="confirm-modal" role="dialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-msg">
        <h2 class="kds-modal-title" id="confirm-title"></h2>
        <p class="kds-modal-msg" id="confirm-msg"></p>
        <div class="kds-modal-actions">
          <button class="kds-btn kds-btn--muted" id="confirm-cancel" type="button" data-testid="kds-confirm-cancel">Cancel</button>
          <button class="kds-btn" id="confirm-ok" type="button" data-testid="kds-confirm-ok">Confirm</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Visually-hidden live region: announces order state to screen readers -->
  <div class="kds-visually-hidden" id="screen-announcer" aria-live="polite"></div>
</div>

<script>
  /* Colour system: 8 configurable colours in 3 semantic groups.
     Every coloured element on a card is driven by these — kitchens
     colour-code differently, so all of them are user-controllable.
     Custom-only: each slot is set with the native picker or hex input,
     no preset swatches. */
  const COLOR_GROUPS = [
    { title: 'Service Types', keys: [
      { key: 'dinein', label: 'Dine-in' },
      { key: 'takeaway', label: 'Takeaway' },
    ]},
    { title: 'Badges', keys: [
      { key: 'rush', label: 'Rush badge' },
      { key: 'processing', label: 'Processing badge' },
      { key: 'prepared', label: 'Prepared badge' },
    ]},
    { title: 'Action Buttons', keys: [
      { key: 'pause', label: 'Pause button' },
      { key: 'resume', label: 'Resume button' },
      { key: 'complete', label: 'Complete button' },
    ]},
  ];
  const DEFAULT_COLORS_DARK = {
    dinein: '#22c55e', takeaway: '#147EFB',
    rush: '#ef4444', processing: '#f59e0b', prepared: '#22c55e',
    pause: '#f59e0b', resume: '#147EFB', complete: '#4ade80',
  };
  /* Light theme defaults — tuned for white surfaces (muted, desaturated
     headers; dark prepared/complete for contrast on light cards) */
  const DEFAULT_COLORS_LIGHT = {
    dinein: '#89a1c8', takeaway: '#9484b8',
    rush: '#f04242', processing: '#89a1c8', prepared: '#242424',
    pause: '#dcdfe5', resume: '#3b4972', complete: '#a72525',
  };
  /* Theme choice is persisted so colour experiments survive a reload —
     with per-theme colour configs, the theme you're tuning has to stick.
     DEFAULT is light; a saved 'dark' flips it. The static HTML starts in
     light so a fresh load has no dark flash. */
  const THEME_KEY = 'kds-proto-theme';
  let theme = 'light';
  try { if (localStorage.getItem(THEME_KEY) === 'dark') theme = 'dark'; } catch {}
  document.getElementById('screen').classList.toggle('light', theme === 'light');
  document.querySelectorAll('#theme-toggle .kds-theme-option').forEach(o =>
    o.classList.toggle('on', o.dataset.theme === theme));

  /* Per-theme colour configs — one set for dark, one for light, so the
     kitchen tunes colours against each theme independently. The ACTIVE
     config is the current theme's. Prototype-only persistence (per-user
     storage comes with the real backend). */
  const COLORS_KEY = 'kds-proto-colors-v2'; // legacy flat config — migrated once
  const THEME_COLORS_KEY = 'kds-proto-colors-v3';
  function loadColorConfigs() {
    let cfg = { dark: { ...DEFAULT_COLORS_DARK }, light: { ...DEFAULT_COLORS_LIGHT } };
    try {
      const raw = localStorage.getItem(THEME_COLORS_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed.dark) cfg.dark = { ...cfg.dark, ...parsed.dark };
        if (parsed.light) cfg.light = { ...cfg.light, ...parsed.light };
        return cfg;
      }
      /* migrate the legacy flat config into BOTH themes once */
      const legacy = localStorage.getItem(COLORS_KEY);
      if (legacy) {
        const old = JSON.parse(legacy);
        cfg = { dark: { ...DEFAULT_COLORS_DARK, ...old }, light: { ...DEFAULT_COLORS_LIGHT, ...old } };
      }
    } catch {}
    return cfg;
  }
  function saveColorConfigs() { try { localStorage.setItem(THEME_COLORS_KEY, JSON.stringify(colorConfigs)); } catch {} }
  function currentTheme() { return document.getElementById('screen').classList.contains('light') ? 'light' : 'dark'; }
  let colorConfigs = loadColorConfigs();
  let colors = colorConfigs[currentTheme()];
  let tab = 'open';
  /* Active tab persists so reloads land where you were testing */
  const TAB_KEY = 'kds-proto-tab';
  try { if (localStorage.getItem(TAB_KEY) === 'completed') tab = 'completed'; } catch {}
  if (tab === 'completed') {
    document.querySelectorAll('.kds-tab').forEach(b => b.classList.toggle('active', b.dataset.tab === 'completed'));
  }

  /* ── Mock data pools — shared by the initial board and the live
     arrival simulation, so new orders match the existing style.
     MUST sit before `let orders = initialOrders()` (const/let are in
     the temporal dead zone until here — function declarations hoist,
     these do not). ── */
  const mockCustomers = ['John Smith', 'Jane Doe', 'Alice Wang', 'Bob Lee', 'Maria Garcia', 'Tom Harris', 'Emma Wilson', 'Liam Brown', 'Sofia Rossi', 'Noah Kim', 'Olivia Chen', 'Lucas Meier'];
  const mockTables = ['T1', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'T8', 'T9', 'T10', 'T11', 'T12'];
  const mockNotes = ['', '', '', '', 'no garlic', 'extra spicy', 'medium rare', 'no onions', 'gluten free', 'well done'];
  const mockCatSpecs = [
    { course: '🥗 Appetizers', pool: ['Calamari', 'Bruschetta', 'Garlic Bread', 'Spring Rolls', 'Dumplings', 'Caesar Salad', 'Soup'] },
    { course: '🥩 Mains', pool: ['Steak A', 'Grilled Chicken', 'Beef Noodles', 'Spaghetti', 'Salmon', 'Pork Chop', 'Ribeye', 'Lamb Curry'] },
    { course: '🧃 Juice', pool: ['Orange Juice', 'Apple Juice', 'Lemonade', 'Watermelon Juice'] },
    { course: '☕ Hot Drinks', pool: ['Coffee', 'Tea', 'Hot Chocolate', 'Espresso'] },
    { course: '🧊 Cold Drinks', pool: ['Iced Tea', 'Soda', 'Milkshake', 'Iced Latte'] },
  ];
  let mockSeed = 12345; // fixed seed → same board every load; arrivals continue the sequence
  const mockRand = () => (mockSeed = (mockSeed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  const mockPick = (arr) => arr[Math.floor(mockRand() * arr.length)];

  let orders = initialOrders().concat(mockCompletedOrders());
  /* Category filter: null = All, otherwise a Set of course names to show */
  let filterCats = null;
  /* Waiter view: 'prepared' shows only orders whose items are ALL done
     (the kitchen finished; a waiter team closes them out). Mutually
     exclusive with category filtering — picking a category clears it. */
  let filterMode = 'all';
  /* Completed-tab filter: 'all' | 'dinein' | 'takeaway' — the recall
     surface has its own mode row (All / Dine in / Takeaway), separate
     from the Open tab's category + prepared filters. */
  let completedFilter = 'all';
  /* Stable columns: every order is born into a column ONCE and never
     moves sideways — only up as cards above it complete. RUSH → column
     0 (top-left). Others → the shortest column at birth. */
  const orderCols = new Map();

  /* Column count: 0 = auto (responsive), 1–4 = manual override.
     Persisted; 'Auto' is the default and the value button resets to it. */
  const COLS_KEY = 'kds-proto-columns';
  let columnOverride = 0;
  try { const v = parseInt(localStorage.getItem(COLS_KEY), 10); if (!isNaN(v) && v >= 1 && v <= 4) columnOverride = v; } catch {}
  function saveCols() { try { localStorage.setItem(COLS_KEY, String(columnOverride)); } catch {} }
  function applyCols() {
    const el = document.getElementById('cols-value');
    if (el) el.textContent = columnOverride === 0 ? 'Auto' : String(columnOverride);
  }
  function stepCols(delta) {
    const cur = columnOverride === 0 ? (delta > 0 ? 1 : 4) : columnOverride + delta;
    columnOverride = Math.max(0, Math.min(4, cur));
    saveCols(); applyCols(); render();
  }
  document.getElementById('cols-out').addEventListener('click', () => stepCols(-1));
  document.getElementById('cols-in').addEventListener('click', () => stepCols(1));
  document.getElementById('cols-value').addEventListener('click', () => { columnOverride = 0; saveCols(); applyCols(); render(); });
  applyCols();

  /* ── Mock board: 12 active orders ───────────────────
     Deterministic generator: mixes statuses (new/processing/paused),
     dine-in vs takeaway, priorities, category combinations, notes.
     doneAt is a timestamp so elapsed durations compute live. */
  function initialOrders() {
    const now = Date.now();
    const minAgo = (m) => now - m * 60000;
    const seq = (n) => '20260202-' + (12520 + n);
    const orders = [];
    for (let n = 0; n < 12; n++) {
      const id = seq(n);
      const minAge = 3 + Math.floor(mockRand() * 22);      // received 3–25 min ago
      const received = minAgo(minAge);
      const dineIn = mockRand() < 0.7;                     // 70% dine-in
      const nCats = 1 + Math.floor(mockRand() * 3);        // 1–3 categories
      const pickedCats = [];
      const pool = [...mockCatSpecs];
      for (let c = 0; c < nCats && pool.length; c++) {
        pickedCats.push(pool.splice(Math.floor(mockRand() * pool.length), 1)[0]);
      }
      // Status: new orders have nothing done (they transition on first tap);
      // processing has a mix; paused is mostly done
      const status = n % 6 === 5 ? 'paused' : n % 3 === 0 ? 'new' : 'processing';

      const categories = pickedCats.map((cs, ci) => {
        const nItems = 1 + Math.floor(mockRand() * 3);     // 1–3 items per category
        const used = new Set();
        const items = [];
        for (let i = 0; i < nItems; i++) {
          let name = mockPick(cs.pool);
          let guard = 0;
          while (used.has(name) && guard++ < 10) name = mockPick(cs.pool);
          used.add(name);
          const qty = 1 + Math.floor(mockRand() * 4);
          // Done probability depends on status: processing more items done,
          // paused many done, new none (so it can transition on first tap)
          let done;
          if (status === 'new') done = false;
          else done = mockRand() < (status === 'paused' ? 0.9 : 0.55);
          items.push({
            id: id + '-i' + ci + '-' + i,
            name, qty,
            done,
            doneAt: done ? minAgo(minAge - Math.floor(mockRand() * Math.max(1, minAge - 1))) : null,
            note: mockPick(mockNotes),
          });
        }
        return { course: cs.course, items };
      });

      orders.push({
        id, display: String(8 + n), table: dineIn ? mockPick(mockTables) : null,
        customer: mockPick(mockCustomers), received,
        priority: mockRand() < 0.15, dineIn, status, notes: mockPick(mockNotes),
        categories,
      });
    }
    return orders;
  }

  /* ── Live arrival simulation ────────────────────────
     One fresh order every 30 s, 20% chance of RUSH. Feeds the spawn
     animation, count badge, aria-live announcer and (when enabled) the
     arrival sound — the 'New order sound' kitchen toggle finally acts. */
  let mockArrivalN = 0;
  function mockNewOrder() {
    const n = mockArrivalN++;
    const id = '20260202-' + (12532 + n);           // continue after the 12 initial ids
    const now = Date.now();
    const dineIn = mockRand() < 0.7;
    const nCats = 1 + Math.floor(mockRand() * 3);
    const pool = [...mockCatSpecs];
    const pickedCats = [];
    for (let c = 0; c < nCats && pool.length; c++) {
      pickedCats.push(pool.splice(Math.floor(mockRand() * pool.length), 1)[0]);
    }
    const categories = pickedCats.map((cs, ci) => {
      const nItems = 1 + Math.floor(mockRand() * 3);
      const used = new Set();
      const items = [];
      for (let i = 0; i < nItems; i++) {
        let name = mockPick(cs.pool);
        let guard = 0;
        while (used.has(name) && guard++ < 10) name = mockPick(cs.pool);
        used.add(name);
        items.push({
          id: id + '-i' + ci + '-' + i,
          name, qty: 1 + Math.floor(mockRand() * 4),
          done: false, doneAt: null,               // fresh order, nothing started
          note: mockPick(mockNotes),
        });
      }
      return { course: cs.course, items };
    });
    return {
      id, display: String(20 + n), table: dineIn ? mockPick(mockTables) : null,
      customer: mockPick(mockCustomers), received: now,
      priority: mockRand() < 0.2,                  // 20% RUSH
      dineIn, status: 'new', notes: mockPick(mockNotes),
      categories,
    };
  }
  function playArrivalSound() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine'; osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.12, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(); osc.stop(ctx.currentTime + 0.25);
    } catch { /* no audio context (jsdom / blocked) — silent */ }
  }
  setInterval(() => {
    const o = mockNewOrder();
    orders.push(o);
    if (kitchen.sound === true) playArrivalSound();
    announce('New order #' + (o.table || o.display) + (o.priority ? ' — RUSH' : '') + ' received.');
    if (tab === 'completed') {
      /* on the recall surface — don't rebuild its ~120-card DOM for an
         order that isn't even completed. The open count badge is the
         only visible thing that changes (filter is an Open-tab concern;
         switching back to Open re-renders properly anyway). */
      document.getElementById('count-open').textContent = orders.filter(o2 => o2.status !== 'completed').length;
    } else {
      render();
    }
  }, 30000);

  /* ── Completed-tab mock: ~5 orders per hour over the last 24h ── */
  function mockCompletedOrders() {
    const list = [];
    const now = Date.now();
    let idx = 0;
    for (let h = 0; h < 24; h++) {
      for (let i = 0; i < 5; i++) {
        const completedAt = now - (h * 3600000 + Math.floor(mockRand() * 3600000));
        const prepMin = 3 + Math.floor(mockRand() * 22);
        const received = completedAt - prepMin * 60000;
        const id = '20260202-' + (12000 + idx);
        const dineIn = mockRand() < 0.7;
        const nCats = 1 + Math.floor(mockRand() * 3);
        const pool = [...mockCatSpecs];
        const pickedCats = [];
        for (let c = 0; c < nCats && pool.length; c++) pickedCats.push(pool.splice(Math.floor(mockRand() * pool.length), 1)[0]);
        const categories = pickedCats.map((cs, ci) => {
          const nItems = 1 + Math.floor(mockRand() * 3);
          const used = new Set();
          const items = [];
          for (let j = 0; j < nItems; j++) {
            let name = mockPick(cs.pool);
            let guard = 0;
            while (used.has(name) && guard++ < 10) name = mockPick(cs.pool);
            used.add(name);
            const doneAt = received + Math.floor(mockRand() * (completedAt - received));
            items.push({ id: id + '-i' + ci + '-' + j, name, qty: 1 + Math.floor(mockRand() * 4), done: true, doneAt, note: mockPick(mockNotes) });
          }
          return { course: cs.course, items };
        });
        list.push({
          id, display: String(500 + idx), table: dineIn ? mockPick(mockTables) : null,
          customer: mockPick(mockCustomers), received,
          priority: mockRand() < 0.15, dineIn, status: 'completed', completedAt,
          notes: mockPick(mockNotes), categories,
        });
