            return `
            <div class="kds-category">
              <button class="kds-category-header" onclick="toggleCatC('${o.id}', ${origIdx})" data-testid="kds-order-card-${o.display}-cat-${slugify(plainName(cat.course))}">
                <span class="kds-cat-label">${cat.items.filter(i => i.done).length}/${cat.items.length} ${plainName(cat.course)}</span>
                <span class="kds-cat-check${cat.items.every(i => i.done) ? ' done' : ''}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:10px;height:10px"><path d="M4 12.5l5 5L20 6.5"/></svg></span>
              </button>
              ${cat.items.map((it, ii) => `
                <div class="kds-item">
                  <button class="kds-item-row${it.done ? ' done' : ''}" onclick="toggleItemC('${o.id}', ${origIdx}, ${ii})" data-testid="kds-order-card-${o.display}-item-${slugify(it.name)}">
                    <span class="kds-item-row-inner">
                      <span class="kds-item-left">
                        <span class="kds-item-qty">${it.qty}×</span>
                        <span class="kds-item-name">${it.name}</span>
                      </span>
                      ${it.done && it.doneAt ? `<span class="kds-item-done-time">${fmtDuration(it.doneAt - o.received)}</span>` : ''}
                    </span>
                    ${it.note ? `<span class="kds-item-note">${it.note}</span>` : ''}
                  </button>
                </div>
              `).join('')}
            </div>
          `}).join('')}
        </div>
        <div class="kds-card-footer">
          ${o.notes ? `<div class="kds-order-notes">Notes: "${o.notes}"</div>` : ''}
          ${footerActions}
        </div>
        </div>
      </div>
    </div>`;
  }

  /* Completed-tab column toggle: clicking a bucket header expands or
     minimizes ALL cards in that column at once (same collapsedOrders
     set the per-card toggle uses, so the two stay consistent). */
  let completedBucketIds = {};
  function toggleCol(key) {
    const ids = completedBucketIds[key] || [];
    if (!ids.length) return;
    const allCollapsed = ids.every(id => collapsedOrders.has(id));
    ids.forEach(id => { if (allCollapsed) collapsedOrders.delete(id); else collapsedOrders.add(id); });
    render();
  }

  function completedCardHTML(o) {
    const hdrBg = o.dineIn ? colors.dinein : colors.takeaway;
    const hdrText = contrastText(hdrBg);
    const at = o.completedAt || o.received;
    const dur = Math.max(0, at - o.received);
    const collapsed = collapsedOrders.has(o.id);
    const catRows = o.categories.map(cat => `
      <div class="kds-category">
        <div class="kds-category-header static">
          <span class="kds-cat-label">${cat.items.filter(i => i.done).length}/${cat.items.length} ${plainName(cat.course)}</span>
          <span class="kds-cat-check done"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:10px;height:10px"><path d="M4 12.5l5 5L20 6.5"/></svg></span>
        </div>
        ${cat.items.map(it => `
          <div class="kds-item">
            <div class="kds-item-row done">
              <span class="kds-item-row-inner">
                <span class="kds-item-left">
                  <span class="kds-item-qty">${it.qty}×</span>
                  <span class="kds-item-name">${it.name}</span>
                </span>
                ${it.doneAt ? `<span class="kds-item-done-time">${fmtDuration(it.doneAt - o.received)}</span>` : ''}
              </span>
              ${it.note ? `<span class="kds-item-note">${it.note}</span>` : ''}
            </div>
          </div>
        `).join('')}
      </div>
    `).join('');
    return `
    <div class="kds-card${collapsed ? ' collapsed' : ''}" data-id="${o.id}" data-received="${o.received}" data-testid="kds-order-card-${o.display}">
      <button class="kds-card-header" style="background:${hdrBg};color:${hdrText}" onclick="toggleCardCollapsed('${o.id}', this)" aria-expanded="${collapsed ? 'false' : 'true'}" data-testid="kds-order-card-${o.display}-header">
        <div class="kds-card-header-icon">${o.dineIn ? DINE_ICON : TAKEAWAY_ICON}</div>
        <div class="kds-card-header-left">
          <div class="kds-card-header-row">
            <span class="order-no">#${o.table || o.display}</span>
          </div>
        </div>
        <div class="kds-card-header-right">
          <span class="customer">${o.customer}</span>
          <div class="kds-card-header-meta">
            <span class="time">${new Date(at).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })} · in ${fmtDuration(dur)}</span>
          </div>
        </div>
      </button>
      <div class="kds-card-collapsible">
        <div class="kds-card-collapsible-inner">
          <div class="kds-card-main">${catRows}</div>
          <div class="kds-card-footer">
            <div class="kds-footer-actions">
              <button class="kds-status-btn reopen" onclick="confirmReopen('${o.id}', this)" data-testid="kds-order-card-${o.display}-status-reopen">${RESUME_ICON.replace('<svg', '<svg style="width:14px;height:14px"')}Reopen</button>
            </div>
          </div>
        </div>
      </div>
    </div>`;
  }

  let leaveLock = false;
  let prevTab = 'open';

  function render() {
    if (leaveLock) return; // a card is mid-leave; defer until animationend
    const main = document.getElementById('main');
    const savedScroll = main.scrollTop; // preserve scroll position across rebuild
    const animOn = kitchen.anim !== false && tab === prevTab;

    /* Static positioning — cards stay where they are once placed:
       RUSH/priority first, then oldest received first (FIFO).
       Paused orders do NOT move to the bottom: the ⏸ icon + amber
       colour already mark them, and keeping them in place avoids
       confusing card jumps on pause/resume. */
    const open = orders
      .filter(o =>
        o.status !== 'completed'
        /* waiter view: only orders where the kitchen finished everything */
        && (filterMode !== 'prepared' || o.categories.every(c => c.items.every(i => i.done)))
        && (!filterCats || visibleCats(o).length > 0))
      .sort((a, b) => {
        if (a.priority !== b.priority) return a.priority ? -1 : 1;
        return a.received - b.received; // oldest first
      });
    const allDone = orders.filter(o => o.status === 'completed');
    const done = completedFilter === 'all'
      ? allDone
      : allDone.filter(o => (completedFilter === 'dinein') === o.dineIn);
    document.getElementById('count-open').textContent = open.length;
    document.getElementById('count-completed').textContent = allDone.length;

    if (tab === 'open') {
      main.className = 'kds-main' + (open.length === 0 ? ' empty' : '') + (prevTab !== 'open' ? ' slide-right' : '') + (filterMode === 'prepared' ? ' prepared-filter' : '');

      /* ── FLIP: FIRST — record old card positions ── */
      let oldPos = null;
      if (animOn) {
        oldPos = new Map();
        main.querySelectorAll('.kds-card[data-id]').forEach(card => {
          const r = card.getBoundingClientRect();
          oldPos.set(card.dataset.id, {
            left: r.left, top: r.top, width: r.width, height: r.height, el: card,
          });
        });
      }

      main.innerHTML = '';
      if (open.length === 0) {
        main.innerHTML = '<div class="kds-empty">' +
          (filterMode === 'prepared'
            ? 'No prepared orders — kitchen still cooking'
            : filterCats && filterCats.size > 0
              ? 'No open orders in the selected categories'
              : 'No active orders — kitchen is clear') +
          '</div>';
      } else {
        /* JS masonry: equal columns, each card to the shortest column so
           heights pack with no gaps. Responsive card width: 380px on
           kitchen displays (1280px → exactly 3 columns; 1600px+ → 4),
           shrinking to ~240px on narrow phone viewports so the board
           still shows 3–4 columns. Formula accounts for the 12px
           inter-column gaps and the 14px main padding. */
        const gap = 12, pad = 14;
        const avail = (main.clientWidth || 1200) - pad * 2;
        const minW = Math.max(240, Math.min(380, Math.round(avail / 3.4)));
        /* manual column override (hamburger) beats the responsive calc */
        const nCols = columnOverride > 0
          ? columnOverride
          : Math.max(1, Math.min(4, Math.floor((avail + gap) / (minW + gap))));
        const cols = [];
        for (let c = 0; c < nCols; c++) {
          const el = document.createElement('div');
          el.className = 'kds-col';
          main.appendChild(el);
          cols.push(el);
        }
        /* Stable columns (no more masonry re-packing):
           - Every order is born into a column ONCE (orderCols) and never
             moves sideways — it only slides up as cards above complete.
             This kills the 'jumping around' feel.
           - Birth placement: RUSH → column 0 top-left (attention origin);
             every other order → the SHORTEST column (fewest cards) so the
             board stays packed without ever re-balancing sideways.
           - Within a column: RUSH first, then oldest-first (FIFO) — the
             per-column sort re-derives this, so existing cards never
             re-order among themselves; a fresh RUSH slots to the top
             (the one accepted downward push) and a fresh normal order
             lands at the bottom. */
        const lists = Array.from({ length: nCols }, () => []);
        const fresh = [];
        open.forEach(o => {
          if (orderCols.has(o.id)) lists[Math.min(orderCols.get(o.id), nCols - 1)].push(o);
          else fresh.push(o);
        });
        fresh.forEach(o => {
          let ci = 0;
          if (!o.priority) {
            let best = 0, bestLen = Infinity;
            lists.forEach((l, i) => { if (l.length < bestLen) { bestLen = l.length; best = i; } });
            ci = best;
          }
          orderCols.set(o.id, ci);
          lists[ci].push(o);
        });
        lists.forEach(list => list.sort((a, b) => {
          if (a.priority !== b.priority) return a.priority ? -1 : 1;
          return a.received - b.received; // oldest first
        }));
        lists.forEach((list, ci) => {
          list.forEach(o => {
            const wrap = document.createElement('div');
            wrap.innerHTML = cardHTML(o);
            const card = wrap.firstElementChild;
            if (card) cols[ci].appendChild(card);
          });
        });
      }
      /* restore the scroll position BEFORE any FLIP measurement —
         innerHTML = '' resets scrollTop to 0, which would both yank the
         kitchen back to the top and, worse, make the FLIP rects be read
         in a different coordinate space than the old positions (the
         classic scrolled-FLIP glitch: cards jump while animating). */
      main.scrollTop = savedScroll;

      /* ── FLIP: LAST + INVERT + PLAY ──
         Gone cards are handled by complete() (they animate out in place
         BEFORE the re-render), so here we only FLIP survivors + spawn. */
      if (animOn && oldPos && oldPos.size > 0) {
        const newCards = main.querySelectorAll('.kds-card[data-id]');

        /* FLIP: animate existing cards from old → new position */
        newCards.forEach(card => {
          const id = card.dataset.id;
          const o = oldPos.get(id);
          if (!o) {
            card.classList.add('kds-card-spawn');
            return;
          }
          const r = card.getBoundingClientRect();
          const dx = o.left - r.left;
          const dy = o.top - r.top;
          if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return; // no move
          card.classList.add('kds-moving');
          card.style.transform = `translate(${dx}px, ${dy}px)`;
          void card.offsetWidth; // force reflow → the inverted position is rendered
          card.style.transform = '';
          const end = () => { card.classList.remove('kds-moving'); card.removeEventListener('transitionend', end); };
          card.addEventListener('transitionend', end);
        });
      }
    } else {
      main.className = 'kds-main completed-view' + (prevTab !== 'completed' ? ' slide-left' : '');
      if (done.length === 0) {
        main.innerHTML = '<div class="kds-empty">No completed orders yet</div>';
      } else {
        /* Kanban-style time-bucket columns: the tab mirrors the open
           tab's card grid, but with minimized cards sorted by age. */
        const now = Date.now();
        const buckets = [
          { key: 'recent', label: 'Recent', test: (at) => at >= now - 3600000 },
          { key: '1h',     label: '1h',     test: (at) => at >= now - 3 * 3600000 && at < now - 3600000 },
          { key: '3h',     label: '3h',     test: (at) => at >= now - 6 * 3600000 && at < now - 3 * 3600000 },
          /* 6h bucket runs to the 24h auto-clear boundary */
          { key: '6h',     label: '6h',     test: (at) => at >= now - 24 * 3600000 && at < now - 6 * 3600000 },
        ];
        main.innerHTML = buckets.map(b => {
          const list = done.filter(o => b.test(o.completedAt || o.received))
            .sort((a, b2) => (b2.completedAt || b2.received) - (a.completedAt || a.received));
          completedBucketIds[b.key] = list.map(o => o.id);
          const allCollapsed = list.every(o => collapsedOrders.has(o.id));
          return `
            <div class="kds-col">
              <button class="kds-completed-col-head" onclick="toggleCol('${b.key}')" aria-expanded="${allCollapsed ? 'false' : 'true'}" aria-label="Expand or minimize ${b.label} orders" data-testid="kds-completed-bucket-${b.key}">
                <span>${b.label}</span><span class="kds-completed-col-count">${list.length}</span>
                <span class="kds-completed-col-chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:10px;height:10px"><path d="M6 9l6 6 6-6"/></svg></span>
              </button>
              ${list.map(completedCardHTML).join('')}
            </div>`;
        }).join('');
      }
      main.scrollTop = savedScroll;
    }
    prevTab = tab;
  }

  function overrideComplete(orderId, remaining, btn) {
    /* anchor the confirm on the order card + blur it (dedicated-waiter
       flow: the modal belongs to the card, not the screen) */
    const anchor = btn ? btn.closest('.kds-card') : null;
    confirmModal(
      'Force Finish this order? ' + remaining + ' item(s) still unchecked.',
      'Force Finish',
      () => complete(orderId),
      true,
      anchor
    );
  }

  /* ── confirm modal (P4: styled replacement for window.confirm) ── */
  let _confirmOk = null;
  let _confirmAnchor = null;
  function confirmModal(message, okLabel, onOk, danger, anchorEl) {
    const backdrop = document.getElementById('confirm-backdrop');
    const anchor = document.getElementById('confirm-anchor');
    document.getElementById('confirm-msg').textContent = message;
    const ok = document.getElementById('confirm-ok');
    ok.textContent = okLabel || 'Confirm';
    ok.classList.toggle('danger', !!danger);
    _confirmOk = onOk;
    /* anchored mode: card-centred modal + card blur, no page veil */
    backdrop.classList.toggle('anchored', !!anchorEl);
    anchor.classList.toggle('anchored', !!anchorEl);
    if (anchorEl) {
      const r = anchorEl.getBoundingClientRect();
      const modal = document.getElementById('confirm-modal');
      if (modal) modal.style.maxWidth = Math.max(220, Math.min(360, r.width - 16)) + 'px';
      anchorEl.classList.add('blurred');
      _confirmAnchor = anchorEl;
      backdrop.hidden = false;
      /* The anchored backdrop is transparent, so it is safe to show the
         modal first, MEASURE it, then position it on the card's centre.
         The old fixed 200/120 clamps pushed the modal off-centre whenever
         the card sat near a viewport edge; now it clamps only when the
         actual modal would leave the viewport (12px margin). */
      requestAnimationFrame(() => {
        const mw = modal ? modal.offsetWidth : 320;
        const mh = modal ? modal.offsetHeight : 150;
        const vw = window.innerWidth, vh = window.innerHeight;
        const margin = 12;
        const x = Math.max(margin + mw / 2, Math.min(vw - margin - mw / 2, r.left + r.width / 2));
        const y = Math.max(margin + mh / 2, Math.min(vh - margin - mh / 2, r.top + r.height / 2));
        anchor.style.left = x + 'px';
        anchor.style.top = y + 'px';
      });
    } else {
      _confirmAnchor = null;
      const modal = document.getElementById('confirm-modal');
      if (modal) modal.style.maxWidth = ''; // fall back to CSS
      backdrop.hidden = false;
    }
    ok.focus();
  }
  function closeConfirm() {
    const backdrop = document.getElementById('confirm-backdrop');
    if (backdrop.hidden) return;
    backdrop.hidden = true;
    /* remove the card blur + anchored states */
    if (_confirmAnchor) _confirmAnchor.classList.remove('blurred');
    _confirmAnchor = null;
    _confirmOk = null;
    document.getElementById('confirm-anchor').classList.remove('anchored');
    backdrop.classList.remove('anchored');
  }
  document.getElementById('confirm-ok').addEventListener('click', () => {
    const fn = _confirmOk;
    closeConfirm();
    if (fn) fn();
  });
  document.getElementById('confirm-cancel').addEventListener('click', closeConfirm);
  document.getElementById('confirm-backdrop').addEventListener('click', (e) => {
    if (e.target === document.getElementById('confirm-backdrop')) closeConfirm(); // click outside
  });
  document.addEventListener('keydown', (e) => {
    const backdrop = document.getElementById('confirm-backdrop');
    if (backdrop.hidden) return;
    if (e.key === 'Escape') { closeConfirm(); return; }
    if (e.key === 'Enter' && !e.repeat) { e.preventDefault(); document.getElementById('confirm-ok').click(); return; }
    if (e.key === 'Tab') { // trap focus between the two buttons
      const btns = backdrop.querySelectorAll('button');
      if (btns.length < 2) return;
      const first = btns[0], last = btns[btns.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });

  /* ── tabs ───────────────────────────────────────── */
  function moveTabIndicator() {
    const active = document.querySelector('.kds-tab.active');
    const ind = document.getElementById('tab-indicator');
    if (!active || !ind) return;
    ind.style.left = active.offsetLeft + 'px';
    ind.style.width = active.offsetWidth + 'px';
    /* 2-axis motion: squeeze (narrow+short) mid-flight → overshoot on landing → settle */
    ind.animate([
      { transform: 'scale(1, 1)' },
      { transform: 'scale(0.82, 0.85)', offset: 0.45 },
      { transform: 'scale(1.08, 1.18)', offset: 0.85 },
      { transform: 'scale(1, 1)' },
    ], { duration: 340, easing: 'ease-in-out' });
  }
  document.querySelectorAll('.kds-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      tab = btn.dataset.tab;
      try { localStorage.setItem(TAB_KEY, tab); } catch {}
      document.querySelectorAll('.kds-tab').forEach(b => b.classList.toggle('active', b === btn));
      /* the filter is tab-aware: Open gets All/Prepared + categories,
         Completed gets All / Dine in / Takeaway. Keep the button
         visible on both; just refresh its label and close the panel. */
      const filterWrap = document.getElementById('filter-wrap');
      toggleFilterPanel(false); // close any open dropdown first
      refreshFilterBtn();
      animateShow(filterWrap);
      render();
      moveTabIndicator();
    });
  });

  /* ── card colour panel (generated from COLOR_GROUPS) ──
     Accordion groups: each group is a toggle head + collapsible body.
     One group open at a time — the full 8-colour editor stays reachable
     without the wall of controls the panel used to show.
     Custom-only: each colour is set with the native picker or the hex
     input — no preset swatches. */
  function buildColorPanel() {
    const root = document.getElementById('color-panel');
    root.innerHTML = COLOR_GROUPS.map(g => `
      <button type="button" class="kds-acc-head" aria-expanded="false" data-testid="kds-settings-colors-group-${slugify(g.title)}">
        <span>${g.title}</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="kds-acc-body" hidden>
        ${g.keys.map(k => `
          <div class="kds-color-group">
            <div class="kds-color-head">
              <label for="hex-${k.key}">${k.label}</label>
              <input type="color" class="kds-native" id="native-${k.key}" data-key="${k.key}" value="${colors[k.key]}" aria-label="${k.label} colour picker" data-testid="kds-settings-colors-native-${k.key}">
              <input class="kds-hex-input" id="hex-${k.key}" data-key="${k.key}" spellcheck="false" aria-label="${k.label} hex" data-testid="kds-settings-colors-hex-${k.key}">
            </div>
          </div>
        `).join('')}
      </div>
    `).join('');
    /* accordion: opening one group closes the others */
    root.querySelectorAll('.kds-acc-head').forEach(head => {
      head.addEventListener('click', () => {
        const wasOpen = head.getAttribute('aria-expanded') === 'true';
        root.querySelectorAll('.kds-acc-head').forEach(h => {
          h.setAttribute('aria-expanded', 'false');
          h.nextElementSibling.hidden = true;
        });
        if (!wasOpen) {
          head.setAttribute('aria-expanded', 'true');
          head.nextElementSibling.hidden = false;
        }
      });
    });
    /* hex inputs: apply on Enter/blur if valid */
    root.querySelectorAll('.kds-hex-input').forEach(input => {
      const apply = () => {
        const v = input.value.trim();
        if (/^#?[0-9a-fA-F]{6}$/.test(v)) {
          pickColor(input.dataset.key, '#' + v.replace('#', '').toLowerCase());
        } else if (/^#?[0-9a-fA-F]{3}$/.test(v)) {
          const h = v.replace('#', '').split('').map(c => c + c).join('');
          pickColor(input.dataset.key, '#' + h.toLowerCase());
        } else {
          input.value = colors[input.dataset.key]; // revert invalid
        }
      };
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); input.blur(); } });
      input.addEventListener('blur', apply);
    });
    /* native colour picker: live update on input */
    root.querySelectorAll('.kds-native').forEach(native => {
      native.addEventListener('input', (e) => pickColor(e.target.dataset.key, e.target.value));
    });
    /* sync hex/native inputs to the active config — buildColorPanel can
       run on a theme switch, where every input is created fresh */
    COLOR_GROUPS.forEach(g => g.keys.forEach(k => syncColorRow(k.key)));
  }
  function syncColorRow(key) {
    const hex = document.getElementById('hex-' + key);
    if (hex && document.activeElement !== hex) hex.value = colors[key];
    const native = document.getElementById('native-' + key);
    if (native) native.value = colors[key];
  }
  function pickColor(key, value) {
    colors = { ...colors, [key]: value };
    colorConfigs[currentTheme()] = colors; // write back to THIS theme's slot
    saveColorConfigs();
    syncColorRow(key);
    render();
  }

  function toggleMenu(force) {
    const panel = document.getElementById('hamburger-panel');
    const btn = document.getElementById('hamburger-btn');
    const showing = force !== undefined ? force : panel.style.display !== 'block';
    panel.style.display = showing ? 'block' : 'none';
    panel.setAttribute('aria-hidden', String(!showing));
    btn.setAttribute('aria-expanded', showing);
    if (showing) {
      /* focus trap: keep Tab cycling inside the panel — focus the first
         control (outside-click and Escape dismiss it) */
      panel._lastFocus = document.activeElement;
      const first = panel.querySelector('button, input, [tabindex]:not([tabindex="-1"])');
      if (first) first.focus();
      /* indicator offsets are only valid once the panel is visible —
         re-measure the theme slider pill (it is zero-width while the
         panel is display:none at init) */
      moveThemeIndicator();
    } else if (panel._lastFocus) {
      panel._lastFocus.focus();
      panel._lastFocus = null;
    }
  }
  document.getElementById('hamburger-btn').addEventListener('click', (e) => {
    e.stopPropagation();
    toggleMenu();
  });
  /* close hamburger on outside click.
     Use composedPath() rather than panel.contains(e.target) so the
     ancestor chain is captured at dispatch time before any DOM
     mutation by a click handler can detach a node from the panel. */
  document.addEventListener('click', (e) => {
    const panel = document.getElementById('hamburger-panel');
    const btn = document.getElementById('hamburger-btn');
    const path = e.composedPath ? e.composedPath() : [];
    const inside = path.includes(panel) || path.includes(btn);
    if (!inside) toggleMenu(false);
  });
  /* close hamburger + filter on Escape */
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      toggleMenu(false);
      toggleFilterPanel(false);
      return;
    }
    /* Tab focus trap while the hamburger panel is open */
    const panel = document.getElementById('hamburger-panel');
    if (e.key === 'Tab' && panel.style.display === 'block') {
      const focusables = panel.querySelectorAll('button, input, [tabindex]:not([tabindex="-1"])');
      if (focusables.length === 0) return;
      const first = focusables[0];
      const last = focusables[focusables.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });

  /* ── display scale (board only — chrome stays proportional) ── */
  const PAGEZOOM_KEY = 'kds-proto-pagezoom';
  let pageZoom = loadPageZoom();
  function loadPageZoom() {
    try { const v = parseInt(localStorage.getItem(PAGEZOOM_KEY), 10); if (!isNaN(v)) return v; } catch {}
    return 100;
  }
  function savePageZoom() { try { localStorage.setItem(PAGEZOOM_KEY, String(pageZoom)); } catch {} }
  function applyPageZoom() {
    /* zoom ONLY the main board area — the topmenu and footer keep their
       size (proportional chrome); the flex layout gives the board the
       remaining space. NOTE: CSS `zoom` is Chrome/Safari-only;
       acceptable for the KDS tablet target (see review P5). */
    document.getElementById('main').style.zoom = pageZoom === 100 ? '' : pageZoom / 100;
    document.getElementById('pagezoom-value').textContent = pageZoom + '%';
  }
  document.getElementById('pagezoom-out').addEventListener('click', () => {
    pageZoom = Math.max(75, pageZoom - 10); savePageZoom(); applyPageZoom();
  });
  document.getElementById('pagezoom-in').addEventListener('click', () => {
    pageZoom = Math.min(150, pageZoom + 10); savePageZoom(); applyPageZoom();
  });
  document.getElementById('pagezoom-value').addEventListener('click', () => {
    pageZoom = 100; savePageZoom(); applyPageZoom();
  });
  applyPageZoom();

  /* ── kitchen switches (sound / auto-accept / animations) ──
     sound + ack persist the preference but have no observable effect
     yet: the prototype has no live order-arrival simulation to act on
     (deferred — see review P5). */
  const KITCHEN_KEY = 'kds-proto-kitchen';
  function loadKitchen() {
    try {
      const raw = localStorage.getItem(KITCHEN_KEY);
      if (raw) return { sound: true, ack: false, anim: true, ...JSON.parse(raw) };
    } catch {}
    return { sound: true, ack: false, anim: true };
  }
  function saveKitchen() { try { localStorage.setItem(KITCHEN_KEY, JSON.stringify(kitchen)); } catch {} }
  let kitchen = loadKitchen();
  function applyKitchen() {
    ['sound', 'ack', 'anim'].forEach(k => {
      const el = document.getElementById('toggle-' + k);
      if (!el) return;
      const on = kitchen[k] === true;
      el.classList.toggle('on', on);
      el.setAttribute('aria-checked', on);
    });
    /* global reduced-motion class: kills all CSS animations/transitions */
    document.body.classList.toggle('no-anim', kitchen.anim !== true);
  }
  document.getElementById('toggle-sound').addEventListener('click', () => { kitchen.sound = !kitchen.sound; saveKitchen(); applyKitchen(); });
  document.getElementById('toggle-ack').addEventListener('click', () => { kitchen.ack = !kitchen.ack; saveKitchen(); applyKitchen(); });
  document.getElementById('toggle-anim').addEventListener('click', () => { kitchen.anim = !kitchen.anim; saveKitchen(); applyKitchen(); });
  applyKitchen();

  /* scoped reset — colours only, for the CURRENT theme, with a styled
     confirm modal since it is the one irreversible-ish action in the panel */
  document.getElementById('reset-colors').addEventListener('click', () => {
    const th = currentTheme();
    confirmModal('Reset ' + th + ' theme card colours to the defaults?', 'Reset', () => {
      colors = { ...(th === 'light' ? DEFAULT_COLORS_LIGHT : DEFAULT_COLORS_DARK) };
      colorConfigs[th] = colors;
      saveColorConfigs();
      COLOR_GROUPS.forEach(g => g.keys.forEach(k => syncColorRow(k.key)));
      render();
    }, true);
  });

  /* ── shift toggle (persisted across reloads) ─────── */
  const SHIFT_KEY = 'kds-proto-shift';
  let shiftOn = false;
  try { shiftOn = localStorage.getItem(SHIFT_KEY) === '1'; } catch {}
  {
    const btn = document.getElementById('shift-btn');
    if (shiftOn) {
      btn.querySelectorAll('span').forEach((s, i) => s.classList.toggle('visible', i === 1));
      btn.classList.add('is-active');
    }
  }
  document.getElementById('shift-btn').addEventListener('click', (e) => {
    shiftOn = !shiftOn;
    const btn = document.getElementById('shift-btn');
    /* swap which stacked label is visible — width stays the same */
    btn.querySelectorAll('span').forEach((s, i) => s.classList.toggle('visible', shiftOn ? i === 1 : i === 0));
    btn.classList.toggle('is-active', shiftOn);
    try { localStorage.setItem(SHIFT_KEY, shiftOn ? '1' : '0'); } catch {}
  });

  /* ── theme toggle (light/dark) ──────────────────── */
  function moveThemeIndicator() {
    const on = document.querySelector('.kds-theme-option.on');
    const ind = document.getElementById('theme-indicator');
    if (!on || !ind) return;
    ind.style.left = on.offsetLeft + 'px';
    ind.style.width = on.offsetWidth + 'px';
    /* same squash-and-stretch as the tab slider */
    ind.animate([
      { transform: 'scale(1, 1)' },
      { transform: 'scale(0.82, 0.85)', offset: 0.45 },
      { transform: 'scale(1.08, 1.18)', offset: 0.85 },
      { transform: 'scale(1, 1)' },
    ], { duration: 340, easing: 'ease-in-out' });
  }
  function updateThemeTag() {
    const tag = document.getElementById('theme-tag');
    if (tag) tag.textContent = currentTheme();
  }
  document.getElementById('theme-toggle').addEventListener('click', () => {
    const isLight = document.getElementById('screen').classList.toggle('light');
    try { localStorage.setItem(THEME_KEY, isLight ? 'light' : 'dark'); } catch {}
    document.querySelectorAll('#theme-toggle .kds-theme-option').forEach(o =>
      o.classList.toggle('on', o.dataset.theme === (isLight ? 'light' : 'dark')));
    moveThemeIndicator();
    /* per-theme colours: swap to the other config, refresh panel + board */
    colors = colorConfigs[currentTheme()];
    updateThemeTag();
    buildColorPanel();
    render();
  });
  moveThemeIndicator();
  updateThemeTag();

  /* ── live clock + sync counter in footer ─────────── */
  let footerSyncAt = Date.now() - 2000; // mock: last kds:orders-changed 2s ago
  const footerStatusEl = document.getElementById('footer-status');
  const footerSyncEl = document.getElementById('footer-sync');
  function fmtSyncAgo(ms) {
    const s = Math.max(0, Math.round(ms / 1000));
    if (s < 60) return s + 's';
    return Math.floor(s / 60) + 'm ' + (s % 60) + 's';
  }
  function tick() {
    const now = new Date();
    document.getElementById('clock').textContent =
      now.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) + ' ' +
      now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    /* mock sync age: counts up live; every ~40s a new kds:orders-changed
       event resets it to ~0s (mirrors the 30s order-arrival cadence) */
    const age = Date.now() - footerSyncAt;
    footerSyncEl.textContent = 'Last sync: ' + fmtSyncAgo(age) + ' ago';
    if (age > 40000) footerSyncAt = Date.now();
  }
  /* connectivity: mostly Connected, brief offline blips */
  setInterval(() => {
    const offline = Math.random() < 0.06; // ~6% of ticks are a blip
    footerStatusEl.textContent = offline ? 'Disconnected' : 'Connected';
  }, 15000);
  setInterval(tick, 1000);
  tick();

  /* Live durations WITHOUT re-rendering: update the elapsed text on
     each card in place. Re-rendering the whole board every N seconds
     was destroying mid-animation cards (leaving/spawn/FLIP), so cards
     must never be rebuilt just to refresh a timer. */
  function tickCardTimers() {
    const cards = document.querySelectorAll('.kds-card[data-received]');
    if (cards.length === 0) return;
    const now = Date.now();
    cards.forEach(card => {
      /* skip completed cards — their time is frozen at completed_at */
      if (card.closest('.kds-main.completed-view')) return;
      const received = Number(card.dataset.received);
      if (!received) return;
      const el = card.querySelector('.kds-card-header-meta .time');
      if (el) el.textContent =
        new Date(received).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }) +
        ' · ' + fmtDuration(now - received);
    });
  }
  setInterval(tickCardTimers, 1000);
  buildColorPanel();
  refreshFilterBtn(); // label matches the restored tab (All / All Categories)
  render();
  /* measure the tab pill AFTER the first render: the count badge starts
     as '0' in the static HTML, so measuring earlier would lock the blue
     pill to the too-narrow pre-render width (only corrected by a later
     tab switch). */
  moveTabIndicator();

  /* Recompute columns when the window resizes — the column count is
     derived from width, so a resize (e.g. 1024px → different columns)
     must re-render. Debounced so dragging the window edge doesn't spam. */
  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (!leaveLock) render(); // wait out any card leave animation
    }, 150);
  });

  /* PWA: register the service worker for installability + offline.
     Path is relative to the page, so it works both at the repo root
     (local server) and under /dev/ on the hosted site. Requires a
     secure context — LAN IPs over HTTP silently fail, which is fine. */
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>
</body>
</html>
