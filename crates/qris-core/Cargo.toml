[package]
name        = "qris-core"
version     = "0.1.0"
edition.workspace    = true
rust-version.workspace = true
license     = "MIT OR Apache-2.0"
publish     = true
description = "Parse, build, decode, and render QRIS (EMVCo MPM) QR payment payloads for Indonesia"
repository  = "https://github.com/YOUR_ORG/qris-core"
documentation = "https://docs.rs/qris-core"
keywords    = ["qris", "qr-code", "emvco", "payment", "indonesia"]
categories  = ["encoding", "parser-implementations"]
readme      = "README.md"

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }
serde  = { workspace = true, optional = true }
rqrr   = { version = "0.5", optional = true }
qrcode = { version = "0.14", optional = true }
image  = { version = "0.25", default-features = false, features = ["jpeg", "png"], optional = true }

[features]
default = []
decode  = ["dep:rqrr",   "dep:image"]
render  = ["dep:qrcode", "dep:image"]
serde   = ["dep:serde"]

[dev-dependencies]
serde_json = { workspace = true }
axum = { workspace = true, features = ["multipart"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower-http = { workspace = true, features = ["cors"] }

[[example]]
name = "web_inspector"
path = "examples/web_inspector.rs"
required-features = ["decode", "render", "serde"]
