[package]
name = "oz-security"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "TLS configuration, PAN masking, and OS credential-store helpers for OZ-POS — key rotation, secure memory. At-rest encryption lives in oz-crypto."

# Inherits [workspace.lints] from the root Cargo.toml (missing_docs = warn).
[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
rand = { workspace = true }
zeroize = "1"
hex = { workspace = true }
chrono = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Security_Credentials", "Win32_Foundation"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
