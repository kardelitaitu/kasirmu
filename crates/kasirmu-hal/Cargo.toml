[package]
name = "kasirmu-hal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Hardware Abstraction Layer for kasir.mu: barcode scanners, receipt printers, cash drawers, customer displays, weight scales."

# Inherits [workspace.lints] from the root Cargo.toml (missing_docs = warn).
[lints]
workspace = true

[dependencies]
kasirmu-core = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
rusb = { workspace = true }
serialport = { workspace = true }

# Android-only: the Bluetooth SPP transport reaches the Java stack over JNI
# (transport/bt_android.rs is cfg(target_os = "android") and never compiles
# into the desktop shells).
#
# hex/sha2 join it for the ADR #57 §2.1 signing-certificate fingerprint
# (transport/apk_signature.rs), which hashes the DER certificate. They are
# gated to Android alongside `jni` rather than promoted to the shared
# dependency list: no desktop path needs them, so the desktop build stays
# byte-identical.
[target.'cfg(target_os = "android")'.dependencies]
jni = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

# Declared explicitly (rather than auto-discovered) so the example's inline
# `#[cfg(test)] mod tests` block stays inside the example target. The AGENTS.md
# rule against inline tests exists so production library code does not carry its
# tests; an `examples/*.rs` file is a standalone demonstration with its own local
# struct, so a sibling `*_tests.rs` cannot be used here — Cargo auto-discovers
# every `.rs` under `examples/` as its own target, and the sibling would then
# fail to compile with `too many leading super keywords` and no `main`.
[[example]]
name = "custom_barcode_scanner"
test = true

