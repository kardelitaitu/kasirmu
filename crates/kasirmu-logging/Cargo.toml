[package]
name = "kasirmu-logging"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Structured logging facade for kasir.mu — context-tagged log records, file + stdout output, log rotation, syslog, Event Log."

# Inherits [workspace.lints] from the root Cargo.toml (missing_docs = warn).
[lints]
workspace = true

[dependencies]
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["json", "registry", "env-filter"] }
tracing-appender = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_EventLog", "Win32_System_Diagnostics_Debug"] }

[dev-dependencies]
filetime = "0.2"
uuid = { workspace = true }
