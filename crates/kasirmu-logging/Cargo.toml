[package]
name = "kasirmu-logging"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Structured logging facade for kasir.mu — context-tagged log records, file + stdout output, log rotation."

# Inherits [workspace.lints] from the root Cargo.toml (missing_docs = warn).
[lints]
workspace = true

[dependencies]
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["json", "registry", "env-filter"] }
tracing-appender = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }

# The `libc` (Linux syslog) and `windows-sys` (Windows Event Log) target
# dependencies were removed 2026-09-29 with the modules that used them
# (C29 / decision D13). The crate is now pure safe Rust.

[dev-dependencies]
filetime = "0.2"
uuid = { workspace = true }
