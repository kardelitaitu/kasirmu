[package]
name = "kasirmu-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Domain types for kasir.mu: money, currency, cart, sale, inventory."

# Inherits [workspace.lints] from the root Cargo.toml (missing_docs = warn).
[lints]
workspace = true

[dependencies]
foundation = { workspace = true }
platform-core = { workspace = true }
modules-sales = { workspace = true }
modules-inventory = { workspace = true }
modules-crm = { workspace = true }
modules-loyalty = { workspace = true }
modules-staff = { workspace = true }
modules-terminal = { workspace = true }
modules-currency = { workspace = true }
modules-tax = { workspace = true }
serde = { workspace = true }
rusqlite = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
argon2 = { workspace = true }
oz-crypto = { workspace = true }
aes-gcm = { workspace = true }
zstd = { workspace = true }
aead = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
serde_json = { workspace = true }
rsa = { version = "0.9", features = ["pem", "sha2"] }
base64 = { workspace = true }
sha2 = { workspace = true }
lettre = { workspace = true }
redis = { version = "0.27", optional = true }
mdns-sd = { workspace = true, optional = true }

[features]
default = ["sync-http"]
sync-http = ["reqwest"]
cache-redis = ["dep:redis"]
lan-mdns = ["dep:mdns-sd"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }
serial_test = { workspace = true }
tokio = { workspace = true }

[[bench]]
name = "barcode_lookup"
harness = false

[[bench]]
name = "cart_bench"
harness = false

[[bench]]
name = "money_bench"
harness = false

[[bench]]
name = "transaction_commit"
harness = false
