[package]
name = "kasirmu-local-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Headless loopback REST API server for the register: embeds the kasirmu-api router on 127.0.0.1 with settings-driven enable/port/secret and per-store audit sink."

[lints]
workspace = true

[dependencies]
kasirmu-api = { workspace = true }
kasirmu-core = { workspace = true }
platform-core = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
reqwest = { workspace = true }
# Fixture directories under the gitignored target/ tree. Four tests here used
# `std::env::temp_dir()`, which on this project's Windows machines resolves to
# the MACHINE-level C:\WINDOWS\TEMP -- creatable but not deletable, so once a
# stale directory exists the create itself fails with PermissionDenied (os error
# 5) and the failure reads as a broken product. It also never cleaned up: the
# paths were bare and had no Drop.
kasirmu-test-support = { path = "../kasirmu-test-support" }
