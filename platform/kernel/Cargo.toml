[package]
name = "platform-kernel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "kasir.mu module system kernel: lifecycle management, dependency resolution, manifest parsing."

# Inherits [workspace.lints] from the root Cargo.toml (missing_docs = warn).
[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
foundation = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# The one definition of the scratch-directory root, and of the Windows TEMP trap
# it exists to avoid: an ordinary user can CREATE inside C:\WINDOWS\TEMP but
# cannot DELETE from it, so a fixture there is never cleaned up and a stale one
# makes the next create fail with PermissionDenied (os error 5).
kasirmu-test-support = { path = "../../crates/kasirmu-test-support" }
