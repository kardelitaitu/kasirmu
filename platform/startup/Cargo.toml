[package]
name = "platform-startup"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Shared application startup logic: module registration, event wiring, background sync daemon for desktop and tablet Tauri clients."

# Inherits [workspace.lints] from the root Cargo.toml (missing_docs = warn).
[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
foundation = { workspace = true }
kasirmu-core = { workspace = true }
# hardware.rs maps the persisted TerminalProfile onto the HAL's own
# HardwareConfig and registers the result. platform-core owns the profile
# type; neither depends on platform-startup, so this adds no cycle.
kasirmu-hal = { workspace = true }
platform-core = { workspace = true }
modules-crm = { workspace = true }
modules-inventory = { workspace = true }
modules-settings = { workspace = true }
modules-tax = { workspace = true }
modules-sales = { workspace = true }
modules-staff = { workspace = true }
modules-reporting = { workspace = true }
modules-terminal = { workspace = true }
modules-currency = { workspace = true }
modules-loyalty = { workspace = true }
# Stub verticals: registered for lifecycle and dependency-graph coverage;
# no domain logic yet. See modules/README.md.
modules-purchasing = { workspace = true }
modules-promotions = { workspace = true }
modules-giftcards = { workspace = true }
modules-kitchen = { workspace = true }
platform-kernel = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rusqlite = { workspace = true }
tauri = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
console-subscriber = { workspace = true, optional = true }
kasirmu-notification = { workspace = true, optional = true }

[features]
default = []
console = ["dep:console-subscriber"]
whatsapp-notifications = ["dep:kasirmu-notification"]

[dev-dependencies]
serial_test = { workspace = true }
tempfile = { workspace = true }
# startup_tests.rs reads modules/*/manifest.json to assert registration parity.
serde_json = { workspace = true }
