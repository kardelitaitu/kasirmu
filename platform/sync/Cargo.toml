[package]
name = "platform-sync"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Sync engine: offline queue, HTTP transport, push/pull replication, and conflict resolution for kasir.mu."

# Inherits [workspace.lints] from the root Cargo.toml (missing_docs = warn).
[lints]
workspace = true

[dependencies]
kasirmu-core = { workspace = true }
foundation = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true }
rusqlite = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
rand = { workspace = true }
tokio-postgres = { workspace = true }
deadpool-postgres = { workspace = true }
tokio-postgres-rustls = { workspace = true }
rustls = { workspace = true }
rustls-native-certs = { workspace = true }

[features]
slow-tests = []

[dev-dependencies]
axum = { workspace = true }
# P1-1: conflict resolution is the highest-risk surface in this crate — two
# terminals editing one sale, arriving in either order — and it had no
# property tests at all. `conflict_tests.rs` samples examples; these
# strategies range over the space the examples sit in.
proptest = { workspace = true }
