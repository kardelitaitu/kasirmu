[workspace]
resolver = "2"

# ── Members ───────────────────────────────────────────────────────────
#
# `crates/`, `modules/`, and `platform/` are globbed so that a new
# vertical becomes a workspace member the moment its directory exists.
# Adding a module is then two edits (this file's [workspace.dependencies]
# + the startup registration), not three — and `scripts/new-module.ps1`
# / `scripts/new-module.sh` performs both for you.
#
# `apps/` is deliberately listed explicitly: `apps/unified` (Docker /
# Caddy assets) and `apps/license-server` (Go) contain no Cargo.toml, and
# a glob over `apps/*` makes `cargo metadata` fail outright with
# "failed to load manifest for workspace member".
members = [
    "crates/*",
    "modules/*",
    "platform/*",
    "foundation",
    "apps/cloud-server",
    "apps/desktop-tauri",
    "apps/mobile-tauri",
]

# Standalone crates that pin their own dependency graph and must NOT
# perturb the workspace lockfile. Each already carries an empty
# `[workspace]` table; listing them here documents the intent and keeps
# `cargo package`/path-dependency discovery from pulling them back in.
exclude = [
    "tools/fuzz",
    "tools/fuzz/hfuzz",
    "scripts/updater-compat-check",
]

[workspace.package]
version = "0.0.40"
edition = "2024"
rust-version = "1.88"   # axum/tower-http deps (time 0.3.47+) require ≥ 1.88
license = "SEE LICENSE IN LICENSE"
license-file = "LICENSE"
publish = false
authors = ["kasir.mu contributors"]
repository = "https://github.com/kardelitaitu/oz-pos"  # TODO: update after repo rename
readme = "README.md"

[workspace.dependencies]
# all crates import from here: kasirmu-core = { workspace = true }
kasirmu-api = { path = "crates/kasirmu-api" }
kasirmu-core = { path = "crates/kasirmu-core" }
kasirmu-bridge = { path = "crates/kasirmu-bridge" }
kasirmu-crypto = { path = "crates/kasirmu-crypto" }
kasirmu-lan = { path = "crates/kasirmu-lan" }
kasirmu-local-api = { path = "crates/kasirmu-local-api" }
kasirmu-hal = { path = "crates/kasirmu-hal" }
kasirmu-lua = { path = "crates/kasirmu-lua" }
kasirmu-plugin = { path = "crates/kasirmu-plugin" }
kasirmu-security = { path = "crates/kasirmu-security" }
kasirmu-notification = { path = "crates/kasirmu-notification" }
kasirmu-payment = { path = "crates/kasirmu-payment" }
kasirmu-reporting = { path = "crates/kasirmu-reporting" }
kasirmu-logging = { path = "crates/kasirmu-logging" }
kasirmu-media = { path = "crates/kasirmu-media" }
kasirmu-cli = { path = "crates/kasirmu-cli" }
qris-core = { path = "crates/qris-core" }
foundation = { path = "foundation" }
platform-core = { path = "platform/core" }
platform-kernel = { path = "platform/kernel" }
modules-sales = { path = "modules/sales" }
modules-inventory = { path = "modules/inventory" }
modules-crm = { path = "modules/crm" }
modules-tax = { path = "modules/tax" }
modules-settings = { path = "modules/settings" }
modules-staff = { path = "modules/staff" }
modules-reporting = { path = "modules/reporting" }
modules-terminal = { path = "modules/terminal" }
modules-currency = { path = "modules/currency" }
modules-loyalty = { path = "modules/loyalty" }
# ── Planned verticals (stub modules) ──────────────────────────────────
# Each already exists as a registered no-op Module implementing the
# kernel lifecycle, owning its manifest.json + feature flag, with the
# domain logic still living in kasirmu-core / desktop-tauri. See
# modules/README.md for the promotion path from stub to owning module.
modules-purchasing = { path = "modules/purchasing" }
modules-promotions = { path = "modules/promotions" }
modules-giftcards = { path = "modules/giftcards" }
modules-kitchen = { path = "modules/kitchen" }
platform-startup = { path = "platform/startup" }
platform-sync = { path = "platform/sync" }
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }

# Ecosystem deps
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
thiserror = "1"
toml = "0.8"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "net", "io-util", "signal"] }
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
axum = { version = "0.8", features = ["macros"] }
jsonwebtoken = "9"
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip"] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
# Promoted from transitive to direct by the tablet file-picker slice: the tablet
# shell needs `tauri_plugin_fs::init()` registered so the JS content-URI bridge
# (`ui/src/api/image-pick.ts`) can read/write an Android `content://` URI. Until
# then the only edge was tauri-plugin-dialog -> tauri-plugin-fs, which registers
# no `plugin:fs|*` commands and so could not be called from the webview.
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-window-state = "2"
tauri-plugin-opener = "2"
# Android-only JNI bridge for the HAL Bluetooth transport (kasirmu-hal); the
# version is already resolved in Cargo.lock via tauri's own Android path.
jni = "0.21"
rusb = "0.9"
serialport = "4"
argon2 = { version = "0.5", features = ["std", "rand"] }
aes-gcm = "0.10"
zstd = { version = "0.13", features = ["zstdmt"] }
aead = "0.5"
rand = "0.8"
tracing-appender = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "gzip", "rustls-tls"] }
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
snow = "0.10"
hex = "0.4"
# Cloud HTTP middleware and test utilities
tower = { version = "0.5", features = ["limit"] }
http-body-util = "0.1"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
# Cloud sync Postgres transport — one canonical spec for kasirmu-api,
# platform-sync, and apps/cloud-server (feature-unified at build time).
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1"] }
deadpool-postgres = { version = "0.14", features = ["serde"] }
tokio-postgres-rustls = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
prometheus = { version = "0.14", features = ["process"] }
mlua = { version = "0.9", features = ["lua54", "vendored", "send"] }
notify = { version = "7", features = [] }
# Platform-specific FFI — version-only; per-crate features added at the consumer
windows-sys = { version = "0.59" }

regex = "1"
mdns-sd = "0.10"
zip = "2"

# ── Image ingest (spec 0046b) ─────────────────────────────────────────
# Desktop-client only: the authoring device transcodes product/menu images
# (decode via `image`, lossy WebP q40 encode via `webp`/libwebp). Tablet
# renders + downloads only; cloud re-verifies magic + sha-256 only. Neither
# links these. See docs/specs/_active/0046b-product-menu-images.md §3.3 + §5.6.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
webp = "0.3"

# Benchmarking
criterion = { version = "0.5", features = ["html_reports"] }
console-subscriber = "0.4"

# Shared build-dependencies
embed-resource = "3"

# Shared dev-dependencies (hoisted for single source of truth)
tempfile = "3"
serial_test = "3"
proptest = "1"
wiremock = "0.6.5"

# ── Workspace lint policy ─────────────────────────────────────────────
#
# Every member opts in with `[lints] workspace = true`, so a new crate
# inherits the house rule instead of re-declaring `#![warn(missing_docs)]`
# in its lib.rs. AGENTS.md requires a doc comment on every public item;
# this makes that requirement structural rather than per-crate boilerplate.
#
# `unsafe_code` deliberately stays OUT of this table, for two reasons.
#
# First, Cargo rejects a manifest that sets both `[lints] workspace = true`
# and a local `[lints.rust]` override ("cannot override `workspace.lints`
# in `lints`"), so a crate cannot relax a workspace lint from its manifest.
#
# Second, and decisively: `unsafe_code` is not uniformly deniable here.
# `kasirmu-logging` calls syslog/eventlog through FFI (`syslog.rs`,
# `eventlog.rs`) and `kasirmu-notification` uses `unsafe` in its tests, and
# neither currently carries a crate-level opt-out — adding a workspace-wide
# deny would break both builds, which is out of scope for a plumbing change.
#
# The crates that DO deny it keep the file-local `#![deny(unsafe_code)]`
# inner attribute, which stays the reviewable place for an exception:
# `kasirmu-lua` narrows two `unsafe impl Send/Sync` with `#[allow(unsafe_code)]`
# plus a `// SAFETY:` rationale, and `kasirmu-security` scopes its Windows
# CredRead/CredWrite FFI behind `#![allow(unsafe_code)]` in `windows.rs`.
[workspace.lints.rust]
missing_docs = "warn"


[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 8
strip = "symbols"
overflow-checks = true

# kasirmu-app (Tauri shell) — optimized for the Tauri binary.
# Cargo only allows opt-level, codegen-units, debug, strip,
# debug-assertions, and overflow-checks in package profiles.
# lto and panic must be set at the workspace level when we're
# closer to release.
[profile.release.package.kasirmu-app]
codegen-units = 1
opt-level = "s"
strip = true

[profile.dev]
opt-level = 0
incremental = true
codegen-units = 256
# `true` embedded full DWARF in every artifact. Measured 2026-09-19: the
# Android debug .so was 413.5 MB and the debug APK 420.7 MB, against 26.9 MB
# for release — linking, packaging and the wireless `adb install` all paid
# for it on every iteration. `line-tables-only` keeps file:line in Rust
# backtraces (enough to read a panic) and drops locals/inline frames.
debug = "line-tables-only"
overflow-checks = false
split-debuginfo = "off"  # Skip DWARF splitting for faster linking on Windows

# Cryptographic and compression crates optimized for speed in tests and dev mode
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.aes-gcm]
opt-level = 3

[profile.dev.package.aead]
opt-level = 3

[profile.dev.package.zstd]
opt-level = 3

# Database and serialization dependencies optimized for faster test execution
[profile.dev.package.rusqlite]
opt-level = 3

[profile.dev.package.serde_json]
opt-level = 3

# Windows: skip DWARF debug info splitting to speed up linking after tests
# Optimized test profile — inherits dev but reduces binary size and link time
[profile.test]
inherits = "dev"
strip = "symbols"
debug = 0
codegen-units = 16


# A01: foundation tests are runtime-trivial (0.1s for 475 tests);
# higher codegen-units trades binary size for faster compile with zero
# quality impact. Scoped per-package to avoid affecting other crates.
[profile.test.package.foundation]
codegen-units = 256

# TDD profile: fastest possible compile for tight test loops
[profile.tdd]
inherits = "dev"
debug = false
incremental = true
