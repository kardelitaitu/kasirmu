[advisories]
# Keep yanked crates visible but non-blocking (default is already warn).
yanked = "warn"
# Only fail on unmaintained/unsound crates that a workspace crate depends on
# DIRECTLY; transitive-only findings stay visible as warnings. This mirrors
# the .cargo/audit.toml stance that these are informational. They used to
# be reviewed on a schedule: `.github/workflows/security.yml` is retired
# (`security.yml.bak`, whose inert copy carries cron `0 6 * * 1`), so as of
# 2026-09-16 no schedule reviews them — and with no cargo-deny runner, no
# thing reports them either.
unmaintained = "workspace"
unsound = "workspace"
# RUSTSEC-2023-0071 — Marvin Attack (rsa 0.9.x, medium 5.9). Mirrors the
# ignore in .cargo/audit.toml (Owner: architecture team · Reviewed:
# 2026-08-03): no fixed 0.9.x release; the private key is used only by the
# operator-side signing path, never for network-originated oracle queries.
ignore = [
    "RUSTSEC-2023-0071",
]
