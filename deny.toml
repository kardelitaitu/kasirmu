# cargo-deny configuration — mirrors the reviewed baseline in .cargo/audit.toml.
#
# Policy (see audit/27-ci-pipeline.md + docs/ci-pipeline.md security section):
#   • License check: fail-closed. Only the permissive licenses below are
#     allowed; anything new must be added deliberately.
#   • Advisories: all vulnerability advisories fail (cargo-deny 0.19 has no
#     severity threshold). Unmaintained/unsound/yanked are gated at the
#     `workspace` level so a transitive-only finding stays visible but does
#     not block CI — matching the "informational warnings stay visible but
#     non-blocking" stance documented in .cargo/audit.toml.
#   • The workspace's own crates are proprietary (LICENSE, `SEE LICENSE IN
#     LICENSE` is not SPDX-parseable) — clarified per crate below.
#
# Refresh procedure (DOCKER-02-style, deliberate):
#   After adding a dependency, run `cargo deny check licenses` and add any
#   new license to `allow` ONLY after reviewing it. Run `cargo deny check
#   advisories` and move an advisory to `ignore` only with a justification
#   mirroring .cargo/audit.toml (owner + review date + rationale).

[licenses]
allow = [
    # The workspace's own proprietary license (root LICENSE file), applied
    # via the [[licenses.clarify]] entries below.
    "LicenseRef-OZ-POS-Proprietary",
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# The workspace's own crates are proprietary (root LICENSE file, declared as
# `license = "SEE LICENSE IN LICENSE"` which is not SPDX-parseable). Clarify
# each against the root LICENSE so they are treated as the project's own
# code. If a LICENSE hash ever changes, cargo-deny prints the expected value
# — update deliberately.
[[licenses.clarify]]
name = "foundation"
version = "*"
expression = "LicenseRef-OZ-POS-Proprietary"
license-files = [{ path = "../LICENSE", hash = 0x137696cf }]
