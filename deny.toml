# cargo-deny configuration — mirrors the reviewed baseline in .cargo/audit.toml.
#
# Policy (see docs/operations/ci-pipeline.md — the two paths named here
# until 2026-09-16, `audit/27-ci-pipeline.md` and `docs/ci-pipeline.md`,
# exist neither at the root nor under docs/; the page moved to operations/).
#   • License check: fail-closed. Only the permissive licenses below are
#     allowed; anything new must be added deliberately.
#   • Advisories: all vulnerability advisories fail (cargo-deny 0.19 has no
#     severity threshold). Unmaintained/unsound/yanked are gated at the
#     `workspace` level so a transitive-only finding stays visible but does
#     not fail the check — matching the "informational warnings stay visible
#     but non-blocking" stance documented in .cargo/audit.toml. Non-blocking
#     is the smaller problem: nothing runs this file in CI at all. Neither
#     `dev-ci.yml` nor `release.yml` has a cargo-deny step
#     (`grep -c "cargo deny" .github/workflows/dev-ci.yml` → 0), `check.sh`
#     and `run-pre-push.py` do not call it, and `scripts/gates.json` files
#     the `audit` row as `status: "retired"`. Every statement below about
#     what "fails CI" is therefore about what this config WOULD do if a
#     runner invoked it — as measured 2026-09-16, `cargo deny check
#     advisories` exits 1 locally on RUSTSEC-2026-0285 (rustls 0.23.41) and
#     nobody is told.
#   • The workspace's own crates are proprietary (LICENSE, `SEE LICENSE IN
#     LICENSE` is not SPDX-parseable) — clarified per crate below.
#
# Refresh procedure (DOCKER-02-style, deliberate — and entirely MANUAL:
# no live workflow, no pre-commit hook step, no pre-push step and no
# scripts/check.sh leg invokes cargo-deny (`grep -rn "cargo deny"
# .github/workflows/*.yml scripts/check.sh scripts/run-pre-push.py` hits
# nothing outside a comment), so none of the steps below happens by itself:
#   After adding a dependency, run `cargo deny check licenses` and add any
#   new license to `allow` ONLY after reviewing it. Run `cargo deny check
#   advisories` and move an advisory to `ignore` only with a justification
#   mirroring .cargo/audit.toml (owner + review date + rationale).

[licenses]
allow = [
    # The workspace's own proprietary license (root LICENSE file), applied
    # via the [[licenses.clarify]] entries below.
    "LicenseRef-OZ-POS-Proprietary",
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# The workspace's own crates are proprietary (root LICENSE file, declared as
# `license = "SEE LICENSE IN LICENSE"` which is not SPDX-parseable). Clarify
# each against the root LICENSE so they are treated as the project's own
# code. If a LICENSE hash ever changes, cargo-deny prints the expected value
# — but only to whoever runs the check, and nothing runs it (see the Refresh
# procedure above). That gap has already cost one full cycle: the root LICENSE
# text changed at `4fae8bba2` (2026-09-14), 13 days after this file was last
# edited (`86aa825f9`, 2026-09-01), and all 35 clarify hashes sat stale and
# warning-ing in silence until `f25347c63` (2026-09-16) re-pinned them. Re-run
# `cargo deny check licenses` after ANY edit to the root LICENSE.
[[licenses.clarify]]
name = "foundation"
version = "*"
expression = "LicenseRef-OZ-POS-Proprietary"
license-files = [{ path = "../LICENSE", hash = 0x137696cf }]
