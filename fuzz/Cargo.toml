[package]
name = "oz-pos-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "Proprietary"
description = "Fuzz testing targets for OZ-POS critical parsing and arithmetic paths"

[package.metadata]
cargo-fuzz = true

# The fuzz crate is a standalone cargo-fuzz workspace (it depends on
# workspace crates by path but must NOT be a member of the root
# workspace, which would make cargo-fuzz fail with "current package
# believes it's in a workspace when it's not").
[workspace]

# Feature flags for C-heavy dependencies.
#
# kasirmu-core and kasirmu-plugin both bring in bundled SQLite (rusqlite) via C code.
# When the fuzz workspace became standalone (no longer inheriting root workspace
# profile overrides), SQLite's C initialization started conflicting with
# libFuzzer's signal-handler setup on Linux, producing a deadly-signal exit-77
# on the very first (empty-bytes) iteration of lightweight targets like
# sku_parse.
#
# Gate them behind opt-in features so each fuzz binary only links the C deps
# it actually needs:
#
#   (default)           - foundation + kasirmu-lua only; covers sku_parse,
#                         money_parse (no C-lib initialization conflicts).
#   kasirmu-core-fuzz        - adds kasirmu-core + bundled SQLite; needed for cart_deser.
#   kasirmu-plugin-fuzz      - adds kasirmu-plugin (implies kasirmu-core-fuzz); needed for
#                         ozpkg_parse + manifest_parse.
#   lua-fuzz            - enables lua_sandbox (kasirmu-lua already in base deps).
[features]
kasirmu-core-fuzz   = ["dep:kasirmu-core"]
kasirmu-plugin-fuzz = ["kasirmu-core-fuzz", "dep:kasirmu-plugin", "dep:toml"]
lua-fuzz       = []

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
foundation = { path = "../foundation" }
kasirmu-lua = { path = "../crates/kasirmu-lua" }
kasirmu-core   = { path = "../crates/kasirmu-core",   optional = true }
kasirmu-plugin = { path = "../crates/kasirmu-plugin", optional = true }
# kasirmu-lua migrated from rlua to mlua 0.9; the lua_sandbox target inspects
# the sandbox via mlua types, so mlua must be a direct dep with the same
# features kasirmu-lua enables (lua54, vendored, send).
mlua = { version = "0.9", features = ["lua54", "vendored", "send"] }
# Pure-Rust; unconditional because percentage_parse exercises the serde
# range-check boundary (previously only pulled in via kasirmu-core-fuzz).
serde_json = "1"
toml = { version = "0.8", optional = true }

[[bin]]
name = "sku_parse"
path = "fuzz_targets/sku_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "money_parse"
path = "fuzz_targets/money_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cart_deser"
path = "fuzz_targets/cart_deser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "lua_sandbox"
path = "fuzz_targets/lua_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ozpkg_parse"
path = "fuzz_targets/ozpkg_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "manifest_parse"
path = "fuzz_targets/manifest_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "percentage_parse"
path = "fuzz_targets/percentage_parse.rs"
test = false
doc = false
bench = false
